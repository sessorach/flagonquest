  // equipped weapons instead, handled the same way by App's
  // equipmentBonuses) and/or a known-technique bonus (currently just
  // Shallow/Deep Health, from Toughened Body/Resolve/Spirit — see
  // techniqueBonuses). Either source, when nonzero, is added to the
  // shown value and called out separately in the formula line, e.g.
  // "= Essence (+2 equipped)" or "= Body (+3 known)".
  const block = (title, rows, footer) => (
    <div className="sheet-box" style={{
      background: "#161b27", border: "0.5px solid #2d3555", borderRadius: 8, padding: "10px 12px",
      display: "flex", flexDirection: "column", gap: 2, flex: "1 1 220px",
    }}>
      <div style={{ fontSize: 12, color: TEXT.label, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 5 }}>
        {title}
      </div>
      {rows.map(([label, base, formula, statKey], i) => {
        const eq = statKey ? bonus(statKey) : 0;
        const tq = statKey ? techBonus(statKey) : 0;
        const wound = wounded && statKey && WOUND_PENALTY_KEYS.has(statKey) ? -2 : 0;
        const parts = [];
        if (eq !== 0) parts.push(`${eq > 0 ? "+" : "−"}${Math.abs(eq)} equipped`);
        if (tq !== 0) parts.push(`${tq > 0 ? "+" : "−"}${Math.abs(tq)} known`);
        return (
          <div key={label} className={i % 2 === 1 ? "row-alt" : undefined} style={{
            display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
            padding: "2px 4px", borderRadius: 4,
            background: i % 2 === 1 ? "rgba(255,255,255,0.03)" : "transparent",
          }}>
            <div>
              <div style={{ fontSize: 13, fontWeight: 700, color: TEXT.name }}>{label}</div>
              {(formula || wound !== 0) && (
                <div style={{ fontSize: 11, color: TEXT.faint, fontStyle: "italic" }}>
                  {formula}{parts.length > 0 && ` (${parts.join(", ")})`}
                  {wound !== 0 && (
                    <span style={{ color: "#e0645f", fontWeight: 700, fontStyle: "normal" }}> · Wounded {wound}</span>
                  )}
                </div>
              )}
            </div>
            <span style={{ fontSize: 16, fontWeight: 500, color: TEXT.name, flexShrink: 0 }}>{base + eq + tq + wound}</span>
          </div>
        );
      })}
      {footer && (
        <div style={{ fontSize: 11, color: TEXT.faint, fontStyle: "italic", marginTop: 4 }}>
          {footer}
        </div>
      )}
    </div>
  );

  return (
    <div className="derived-stats-row" style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
      {block("Vitals", [
        ["Speed",          1 + (statPoints.Agility || 0), "= 1 + Agility", "speed"],
        ["Resting Health", statPoints.Body || 0, "= Body"],
        ["Reflex",         st("Insight"), "= Insight"],
        ["Cards Per Day",  2 * ((statPoints.Cunning || 0) + (statPoints.Mind || 0)), "= 2 × (Cunning + Mind)"],
      ])}
      {block("Defenses", [
        ["Parry Defense",    8 + Math.max(st("Melee"), st("Brawl")), "= 8 + Melee or Brawl", "parry_defense"],
        ["Dodge Defense",    8 + Math.max(st("Acrobatics"), st("Brawl")), "= 8 + Acrobatics or Brawl", "dodge_defense"],
        ["Bodily Defense",   8 + st("Resilience"), "= 8 + Resilience", "bodily_defense"],
        ["Mental Defense",   8 + st("Composure"), "= 8 + Composure", "mental_defense"],
        ["Instinct Defense", 8 + st("Insight"), "= 8 + Insight", "instinct_defense"],
      ])}
      {block("Resists", [
        ["Physical Resist",  essence, "= Essence", "physical_resist"],
        ["Fire Resist",      essence, "= Essence", "fire_resist"],
        ["Frost Resist",     essence, "= Essence", "frost_resist"],
        ["Brilliant Resist", essence, "= Essence", "brilliant_resist"],
        ["Shadow Resist",    essence, "= Essence", "shadow_resist"],
      ], "Essence adds to each Resist.")}
      {/* Health — the only box with live, clickable widgets instead of
          just computed numbers, so it gets its own layout rather than
          going through the generic block() row renderer above. Current
          health is session-tracking state (like the Character Sheet's
          Expended checkboxes), not part of the build — see App's
          currentHealth/setHealthTrack and its exclusion from doExport. */}
      <div className="sheet-box" style={{
        background: "#161b27", border: "0.5px solid #2d3555", borderRadius: 8, padding: "10px 12px",
        display: "flex", flexDirection: "column", gap: 8, flex: "1 1 220px",
      }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
          <div style={{ fontSize: 12, color: TEXT.label, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em" }}>
            Health
          </div>
          {/* Always rendered (just hidden, not unmounted) so the Health
              rows below never shift position when Wounded toggles on or
              off — same idea for the caption underneath. */}
          <span style={{
            visibility: wounded ? "visible" : "hidden",
            fontSize: 11, fontWeight: 700, color: "#e0645f",
            border: "0.5px solid #e0645f", borderRadius: 4, padding: "1px 6px",
            textTransform: "uppercase", letterSpacing: "0.04em",
          }}>
            <GlossaryTerm term="Wounded" description={woundedDesc} />
          </span>
        </div>
        {/* Bad Luck on flips can't be auto-applied (no dice/card engine
            here), unlike the -2 to Speed/Defenses, which is — called out
            in plain text, not hidden behind the badge's hover tooltip,
            so it's just as hard to miss as the numbers that did change. */}
        <div style={{ visibility: wounded ? "visible" : "hidden", fontSize: 11, color: "#e0645f", lineHeight: 1.4, marginTop: -4 }}>
          Wounded: −2 Defenses/Speed applied. Also apply Bad Luck to all flips.
        </div>
        <HealthTrack
          label="Shallow Health" max={shallowMax}
          current={currentHealth.shallow ?? shallowMax}
          onChange={v => onHealthChange && onHealthChange("shallow", v)}
        />
        <HealthTrack
          label="Deep Health" max={deepMax}
          current={currentHealth.deep ?? deepMax}
          onChange={v => onHealthChange && onHealthChange("deep", v)}
        />
      </div>
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// ATTACK WORKSPACE — Character Sheet only, right under Derived Stats.
// Every equipped Held-slot weapon, auto-listed with its Accuracy/Damage/
// Range (computed, not stored — see equippedWeaponAttacks), plus any
// number of freeform custom rows for anything the auto-list can't see
// (a spell attack, whose numbers live in a Technique's prose rather
// than a structured data field). No Skill or Might Requirement column
// — both stay on the item's own card instead (weaponInfo in
// InventoryTile), keeping this table to just the numbers that change
// attack-to-attack. A Notes column on every row — auto or custom — is a
// fillable reminder for that specific attack (a weapon's on-hit effect,
// a note about when to use a spell), rather than one catch-all
// scratchpad for the whole workspace.
// Always shown, even with nothing equipped yet — it's meant to stay
// available as a fillable blank, on screen and on the printed page,
// not just a summary of already-picked stuff like the rest of the sheet.
// ══════════════════════════════════════════════════════════════════
// A Thrown weapon's Accuracy/Range cells each carry two values (one for
// a close-range Melee swing, one for the thrown attack) instead of one
// — see parseDualModeWeapon. Swords/bow emoji tag each line so it reads
// at a glance without needing a legend.
function isDualValue(v) { return v != null && typeof v === "object"; }
function AttackDualCell({ melee, ranged, format = v => v ?? "—" }) {
  return (
    <span style={{ display: "flex", flexDirection: "column", gap: 1 }}>
      <span>⚔️ {format(melee)}</span>
      <span>🏹 {format(ranged)}</span>
    </span>
  );
}
function formatAccuracyValue(v) {
  return v != null ? `${v >= 0 ? "+" : ""}${v}` : "—";
}

function AttackWorkspace({
  weaponRows, customAttacks, onAddCustomAttack, onUpdateCustomAttack, onRemoveCustomAttack,
  onWeaponNoteChange,
}) {
  const hasRows = weaponRows.length > 0 || customAttacks.length > 0;
  // minmax(0, ...) — plain fr tracks still respect each cell's content
  // min-width by default, which would force this box wider than the
  // page; minmax(0, ...) lets a track shrink below that (the input's own
  // overflow/ellipsis styling covers the rest). No Skill column — see
  // the header comment above.
  const colTemplate = "minmax(0,1fr) minmax(0,0.5fr) minmax(0,0.9fr) minmax(0,0.5fr) minmax(0,2.4fr) 20px";
  const headerStyle = { fontSize: 11, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.04em" };
  const inputStyle = { fontSize: 13, padding: "3px 6px", width: "100%", minWidth: 0, boxSizing: "border-box" };
  // Same alternating-tint idea as Stats & Skills/Derived Stats (row-alt)
  // — a running index across both weaponRows and customAttacks so the
  // stripe pattern stays continuous across the boundary between them,
  // rather than each list restarting its own odd/even count from 0.
  const rowStyle = i => ({
    display: "grid", gridTemplateColumns: colTemplate, gap: 6, alignItems: "center",
    padding: "2px 4px", borderRadius: 4,
    background: i % 2 === 1 ? "rgba(255,255,255,0.03)" : "transparent",
  });

  return (
    <div className="sheet-box" style={{
      background: "#161b27", border: "0.5px solid #2d3555", borderRadius: 8,
      padding: "10px 12px", display: "flex", flexDirection: "column", gap: 6,
    }}>
      <div style={{ fontSize: 12, color: TEXT.label, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em" }}>
        Attacks
      </div>
      {hasRows && (
        <div style={{ display: "grid", gridTemplateColumns: colTemplate, gap: 6 }}>
          <span style={headerStyle}>Name</span>
          <span style={headerStyle}>Accuracy</span>
          <span style={headerStyle}>Damage</span>
          <span style={headerStyle}>Range</span>
          <span style={headerStyle}>Notes</span>
          <span />
        </div>
      )}
      {weaponRows.map((r, i) => (
        <div key={r.key} className={i % 2 === 1 ? "row-alt" : undefined} style={rowStyle(i)}>
          <span style={{ fontSize: 13, color: TEXT.name, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis" }}>
            {r.name}
          </span>
          <span style={{ fontSize: 13, color: TEXT.body }}>
            {isDualValue(r.accuracy)
              ? <AttackDualCell melee={r.accuracy.melee} ranged={r.accuracy.ranged} format={formatAccuracyValue} />
              : formatAccuracyValue(r.accuracy)}
          </span>
          <span style={{ fontSize: 13, color: TEXT.body, overflow: "hidden", textOverflow: "ellipsis" }}>{r.damage ?? "—"}</span>
          <span style={{ fontSize: 13, color: TEXT.body }}>
            {isDualValue(r.range)
              ? <AttackDualCell melee={r.range.melee} ranged={r.range.ranged} />
              : (r.range ?? "—")}
          </span>
          <input
            type="text" value={r.notes} onChange={e => onWeaponNoteChange(r.key, e.target.value)}
            placeholder="Reminder…" style={inputStyle}
          />
          <span />
        </div>
      ))}
      {customAttacks.map((r, i) => (
        <div key={r.id} className={(i + weaponRows.length) % 2 === 1 ? "row-alt" : undefined} style={rowStyle(i + weaponRows.length)}>
          <input type="text" value={r.name} onChange={e => onUpdateCustomAttack(r.id, "name", e.target.value)} placeholder="Name…" style={inputStyle} />
          <input type="text" value={r.accuracy} onChange={e => onUpdateCustomAttack(r.id, "accuracy", e.target.value)} placeholder="+0" style={inputStyle} />
          <input type="text" value={r.damage} onChange={e => onUpdateCustomAttack(r.id, "damage", e.target.value)} placeholder="—" style={inputStyle} />
          <input type="text" value={r.range} onChange={e => onUpdateCustomAttack(r.id, "range", e.target.value)} placeholder="—" style={inputStyle} />
          <input type="text" value={r.notes} onChange={e => onUpdateCustomAttack(r.id, "notes", e.target.value)} placeholder="Reminder…" style={inputStyle} />
          <button
            onClick={() => onRemoveCustomAttack(r.id)}
            aria-label={`Remove ${r.name || "attack row"}`}
            className="no-print"
            style={{ background: "transparent", border: "none", color: TEXT.faint, fontSize: 14, lineHeight: 1, padding: 0 }}
          >
            ✕
          </button>
        </div>
      ))}
      {!hasRows && (
        <div style={{ fontSize: 13, color: TEXT.faint, textAlign: "center", padding: "4px 0" }}>
          No weapons equipped yet.
        </div>
      )}
      <button
        onClick={onAddCustomAttack}
        className="no-print"
        style={{
          marginTop: 4, alignSelf: "flex-start", padding: "4px 10px", fontSize: 12, fontWeight: 500, borderRadius: 6,
          background: "transparent", color: TEXT.muted, border: "0.5px solid #2d3555",
        }}
      >
        + Add custom row
      </button>
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// CUSTOM TECHNIQUE CARD — a freeform tile for a GM-granted ability that
// doesn't come from the data file: just a title and rules text, no
// level/tags/prereqs, and never counted toward XP. Same card look as a
// real TechCard so it reads as "one more technique," editable on the
// Builder tab and read-only (title + text only) on the Character Sheet.
// ══════════════════════════════════════════════════════════════════
function CustomTechniqueCard({ tech, onTitleChange, onTextChange, onRemove, readOnly = false }) {
  const cardStyle = {
    background: "#161b27", border: "0.5px solid #2d3555", borderRadius: 8,
    padding: "12px 14px", display: "flex", flexDirection: "column", gap: 7,
  };

  if (readOnly) {
    // Nothing to show for a copy the player added but never filled in.
    if (!tech.title.trim() && !tech.text.trim()) return null;
    return (
      <div className="tech-card" style={cardStyle}>
        <span style={{
          fontFamily: "'MedievalSharp', Georgia, serif", fontWeight: "bold",
          fontSize: 17, color: TEXT.name, lineHeight: 1.3,
        }}>
          {tech.title.trim() || "Untitled technique"}
        </span>
        {tech.text && (
          <div style={{ fontSize: 14, color: TEXT.body, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
            {tech.text}
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="tech-card" style={cardStyle}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <input
          type="text"
          value={tech.title}
          onChange={e => onTitleChange(e.target.value)}
          placeholder="Technique name…"
          style={{
            flex: 1, fontFamily: "'MedievalSharp', Georgia, serif", fontWeight: "bold",
            fontSize: 16, padding: "4px 8px",
          }}
        />
        <button
          onClick={onRemove}
          aria-label="Remove custom technique"
          style={{ background: "transparent", border: "none", color: TEXT.faint, fontSize: 18, lineHeight: 1, padding: "2px 4px", flexShrink: 0 }}
        >
          ✕
        </button>
      </div>
      <textarea
        value={tech.text}
        onChange={e => onTextChange(e.target.value)}
        placeholder="Rules text…"
        rows={3}
        style={{ fontSize: 13 }}
      />
    </div>
  );
}

// Flat stat-bonus columns an item can carry — see ITEM_MAP in convert.py.
// [data key, short display label]
const ITEM_STAT_FIELDS = [
  ["physical_resist", "Physical Resist"], ["fire_resist", "Fire Resist"],
  ["frost_resist", "Frost Resist"], ["brilliant_resist", "Brilliant Resist"],
  ["shadow_resist", "Shadow Resist"], ["speed", "Speed"],
  ["parry_defense", "Parry Defense"], ["dodge_defense", "Dodge Defense"],
  ["bodily_defense", "Bodily Defense"], ["mental_defense", "Mental Defense"],
  ["instinct_defense", "Instinct Defense"],
  ["shallow_health", "Shallow Health"], ["deep_health", "Deep Health"],
];

// Weapon-only fields, shown as a compact info line rather than "+N" stat
// badges — Accuracy/Damage/Range/etc. aren't bonuses that sum into a
// derived stat the way ITEM_STAT_FIELDS entries are, they're the
// weapon's own intrinsic profile.
const WEAPON_INFO_FIELDS = [
  ["accuracy", "Accuracy", v => `${v >= 0 ? "+" : ""}${v}`],
  ["damage", "Damage", v => v],
  ["range", "Range", v => v],
  ["relevant_skill", "Skill", v => v],
  ["might_requirement", "Might Req", v => v],
];

// A "+N"/"−N" badge for one flat stat bonus — shared by the equipment
// summary badges and the per-item tile badges, so a negative value (an
// armor penalty) reads as "−1", not the "+-1" naive interpolation would give.
function statBadge(label, v) {
  return `${label} ${v >= 0 ? "+" : "−"}${Math.abs(v)}`;
}

// ══════════════════════════════════════════════════════════════════
// INVENTORY TILE — one owned item: name, category/slot, description/
// effects text, any flat stat bonuses or weapon profile it carries, and
// a quantity stepper. Cost only shows up when editable (the Items tab)
// — the Character Sheet doesn't need it. On the Character Sheet
// specifically (readOnly + showEquip), it also gets an Equipped
// checkbox — disabled when equipping it would overflow its (effective —
// see effectiveSlot) Slot's capacity. Weapon Defense for Parry is shown
// as an info badge but no longer picked by hand — see equipmentBonuses,
// which auto-uses the best Weapon Defense among everything equipped. A
// Masterwork item with base_item_options also gets a base-item picker
// (e.g. Dauntless Wrap built onto Light or Heavy Armor) — but only on
// the Items tab, where the rest of an item's build config lives; the
// Character Sheet only shows the resulting composite stat badges (own
// stats + the chosen base item's), same as equipmentBonuses uses. A
// Masterwork item is also "buildable" like a Feature technique — fixed-
// level ones (item.levels has one entry) just get a "Lv N" badge, and
// ones with a choice of levels (item.levels has more than one) get a
// picker instead, editable wherever Qty is (Items tab, plain badge on
// the read-only Sheet). Its Cost badge scales with the picked level for
// a Masterwork item priced per-level (item.value_per_level).
// ══════════════════════════════════════════════════════════════════
function InventoryTile({
  entry, item, allItems = [], onQtyChange, onRemove, readOnly = false,
  showEquip = false, onToggleEquipped, equipDisabled = false,
  onBaseItemChange, onLevelChange,
  onDragStart, onDragEnd, onDragOver, onDrop, isDragging = false,
  statPoints = {}, skillPoints = {},
}) {
  if (!item) return null; // stale reference to a removed/renamed data row
  const baseItemOptions = (item.base_item_options || [])
    .map(id => allItems.find(i => i.id === id))
    .filter(Boolean);
  const baseItem = entry.baseItemId ? allItems.find(i => i.id === entry.baseItemId) : null;
  const levels = item.category === "Masterwork" ? (item.levels || []) : [];
  const hasLevel = levels.length > 0;
  const variableLevel = levels.length > 1;
  const displayLevel = entry.level ?? levels[0];
  const statBadges = ITEM_STAT_FIELDS
    .map(([key, label]) => {
      const own  = typeof item[key] === "number" ? item[key] : 0;
      const base = baseItem && typeof baseItem[key] === "number" ? baseItem[key] : 0;
      return [label, own + base];
    })
    .filter(([, v]) => v !== 0);
  // Category = "Material" items (see MATERIAL_TYPES) — the Types a
  // crafting recipe would check this material against.
  const materialTypes = splitCSV(item.material_types);
  const weaponInfo = item.category === "Weapon"
    ? WEAPON_INFO_FIELDS
        .filter(([key]) => key !== "might_requirement")
        .map(([key, label, fmt]) => [label, item[key], fmt])
        .filter(([, v]) => v != null && v !== "")
    : [];
  const canParry = item.category === "Weapon" && typeof item.weapon_defense === "number";
  // Might Requirement gets its own conditionally-colored badge instead
  // of joining the plain weaponInfo line, so it can flag red — only on
  // the Character Sheet (showEquip), where "does this character
  // currently qualify" is a meaningful question; on the Items tab it's
  // just reference info about the item, not tied to any character yet.
  const mightReq = typeof item.might_requirement === "number" ? item.might_requirement : null;
  const mightMet = mightReq == null || !showEquip || skillTotalValue(statPoints, skillPoints, "Might") >= mightReq;
  // A Masterwork item priced per-level (e.g. "20 Gold per level") has no
  // flat Cost of its own — its price depends on which level you build it
  // at, so compute it from the picked level instead.
  const displayCost = item.value_per_level && hasLevel
    ? `${displayLevel * item.value_per_level} Gold`
    : item.cost;

  return (
    <div
      className="tech-card"
      onDragOver={onDragOver}
      onDrop={onDrop}
      style={{
        background: "#161b27",
        border: entry.equipped ? "0.5px solid #a07c2e" : "0.5px solid #2d3555",
        borderRadius: 8,
        padding: "10px 12px", display: "flex", flexDirection: "column", gap: 6,
        opacity: isDragging ? 0.5 : 1,
      }}
    >
      <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
        {onDragStart && (
          <div
            draggable
            onDragStart={onDragStart}
            onDragEnd={onDragEnd}
            title="Drag to reorder"
            aria-label={`Drag to reorder ${item.name}`}
            style={{
              display: "flex", alignItems: "center", justifyContent: "center",
              width: 16, flexShrink: 0, cursor: "grab", color: TEXT.faint, fontSize: 16,
              userSelect: "none",
            }}
          >
            ⠿
          </div>
        )}
        <span style={{
          fontFamily: "'MedievalSharp', Georgia, serif", fontWeight: "bold",
          fontSize: 15, color: TEXT.name, flex: 1, lineHeight: 1.3,
        }}>
          {item.name}
        </span>
        {!readOnly && (
          <button
            onClick={onRemove}
            aria-label={`Remove ${item.name}`}
            style={{ background: "transparent", border: "none", color: TEXT.faint, fontSize: 16, lineHeight: 1, padding: "2px 4px", flexShrink: 0 }}
          >
            ✕
          </button>
        )}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
        <span style={{ fontSize: 11, color: TEXT.muted, background: "#0d1117", border: "0.5px solid #2d3555", borderRadius: 3, padding: "1px 5px" }}>
          {item.category}{item.slot ? ` · ${item.slot}` : ""}
        </span>
        {hasLevel && (
          variableLevel && !readOnly ? (
            <select
              value={displayLevel}
              onChange={e => onLevelChange(Number(e.target.value))}
              style={{ fontSize: 11, color: TEXT.name, background: "#24221a", border: "0.5px solid #5b5540", borderRadius: 3, padding: "1px 4px" }}
            >
              {levels.map(lv => <option key={lv} value={lv}>Lv {lv}</option>)}
            </select>
          ) : (
            <span style={{ fontSize: 11, color: TEXT.name, background: "#24221a", border: "0.5px solid #5b5540", borderRadius: 3, padding: "1px 6px" }}>
              Lv {displayLevel}
            </span>
          )
        )}
        {!readOnly && displayCost && (
          <span style={{ fontSize: 12, color: TEXT.faint }}>{displayCost}</span>
        )}
      </div>
      {/* Fluff description — italic and muted, skipped on the read-only
          Character Sheet, same treatment as a technique's Description. */}
      {!readOnly && item.description && (
        <div style={{ fontSize: 13, color: TEXT.muted, fontStyle: "italic", lineHeight: 1.5 }}>
          {item.description}
        </div>
      )}
      {/* Effects — the actual rules text, shown everywhere */}
      {item.effects && (
        <div style={{ fontSize: 13, color: TEXT.body, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>
          {item.effects}
        </div>
      )}
      {(weaponInfo.length > 0 || mightReq != null) && (
        <div style={{ fontSize: 12, color: TEXT.faint, lineHeight: 1.5 }}>
          {weaponInfo.map(([label, v, fmt]) => `${label} ${fmt(v)}`).join("  ·  ")}
          {canParry && `  ·  Parry ${item.weapon_defense >= 0 ? "+" : ""}${item.weapon_defense}`}
          {mightReq != null && (
            <>
              {"  ·  "}
              <span style={{
                color: !showEquip ? "inherit" : (mightMet ? "#6fae5a" : "#e0645f"),
                fontWeight: !showEquip ? "inherit" : 600,
              }}>
                Might Req {mightReq}
              </span>
            </>
          )}
        </div>
      )}
      {statBadges.length > 0 && (
        <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
          {statBadges.map(([label, v]) => (
            <span key={label} style={{
              fontSize: 11, color: "#e8c46a", background: "#20180a", border: "0.5px solid #6b5423",
              borderRadius: 4, padding: "1px 6px",
            }}>
              {statBadge(label, v)}
            </span>
          ))}
        </div>
      )}
      {materialTypes.length > 0 && (
        <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
          {materialTypes.map(t => (
            <span key={t} style={{
              fontSize: 11, color: "#e8c46a", background: "#20180a", border: "0.5px solid #6b5423",
              borderRadius: 4, padding: "1px 6px",
            }}>
              {t}
            </span>
          ))}
        </div>
      )}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginTop: "auto" }}>
        <span style={{ fontSize: 12, color: TEXT.faint }}>Qty</span>
        {readOnly ? (
          <span style={{ fontSize: 14, fontWeight: 500, color: TEXT.name }}>{entry.qty}</span>
        ) : (
          <PointStepper value={entry.qty} max={99} onChange={onQtyChange} />
        )}
      </div>
      {showEquip && effectiveSlot(item) && (
        <div style={{ display: "flex", alignItems: "center", gap: 12, paddingTop: 4, borderTop: "0.5px solid #2d3555" }}>
          <label
            title={equipDisabled ? `No room left in the ${effectiveSlot(item)} slot` : undefined}
            style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: equipDisabled ? TEXT.faint : TEXT.body, cursor: equipDisabled ? "not-allowed" : "pointer" }}
          >
            <input
              type="checkbox"
              checked={!!entry.equipped}
              disabled={equipDisabled}
              onChange={onToggleEquipped}
            />
            Equipped
          </label>
        </div>
      )}
      {!readOnly && baseItemOptions.length > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: TEXT.body }}>
          <span style={{ color: TEXT.faint, flexShrink: 0 }}>Base item</span>
          <select
            value={entry.baseItemId || ""}
            onChange={e => onBaseItemChange(e.target.value)}
            style={{ fontSize: 12, flex: 1, minWidth: 0 }}
          >
            <option value="">None (no bonus)</option>
            {baseItemOptions.map(bi => <option key={bi.id} value={bi.id}>{bi.name}</option>)}
          </select>
        </div>
      )}
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// CUSTOM ITEM TILE — a freeform item the player writes in themselves,
// same idea as CustomTechniqueCard: a name, description, and quantity.
// It can also carry: a Slot (so it shares SLOT_CAPACITY/Equipped with
// real items — a custom Ring still only leaves room for one more Ring),
// manually-entered flat stats (for homebrew gear that isn't in the data
// file at all), and any number of attached Masterwork powers (for the
// one in-game ability that lets you stack more than one Masterwork
// enchantment on an item) — each with its own level, and its Effects
// text shown in full since that's the actual rules text for the power.
// Slot/Stats/Powers are edited on the Items tab; the Character Sheet
// only shows the composite result — combined stat badges (manual stats
// + every attached power's own stats) and each power's effect text —
// plus the Equipped checkbox, same split as InventoryTile's base-item
// picker vs. its composite badges.
// ══════════════════════════════════════════════════════════════════
function CustomItemTile({
  entry, allItems = [], onNameChange, onTextChange, onQtyChange, onRemove, readOnly = false,
  onSlotChange, showEquip = false, onToggleEquipped, equipDisabled = false,
  onAddStat, onStatChange, onRemoveStat, onAddPower, onPowerLevelChange, onRemovePower,
  onDragStart, onDragEnd, onDragOver, onDrop, isDragging = false,
  onAddWeapon, onRemoveWeapon, onWeaponChange, statPoints = {},
  enabledSupplements = null,
}) {
  if (readOnly && !entry.name.trim() && !entry.text.trim()) return null; // nothing to show

  const stats = entry.stats || {};
  const statKeysUsed = new Set(Object.keys(stats));
  const availableStats = ITEM_STAT_FIELDS.filter(([key]) => !statKeysUsed.has(key));
  // Only offer a new power to attach from an enabled supplement (see
  // the Sources panel on Builder) — a power already attached before
  // its supplement was disabled still resolves normally below (powers
  // looks it up in the full allItems, not this filtered list).
  const masterworkOptions = allItems.filter(i =>
    i.category === "Masterwork" && (!enabledSupplements || enabledSupplements.includes(i.supplement))
  );
  const powers = (entry.powers || [])
    .map(p => ({ ...p, item: allItems.find(i => i.id === p.itemId) }))
    .filter(p => p.item);

  // Combined stat badges — manual stats plus every attached power's own
  // flat stats, summed per key (mirrors InventoryTile's own-item +
  // base-item combine, and equipmentBonuses' version of the same math).
  const combinedStats = {};
  ITEM_STAT_FIELDS.forEach(([key, label]) => {
    let v = 0, any = false;
    if (typeof stats[key] === "number") { v += stats[key]; any = true; }
    powers.forEach(p => { if (typeof p.item[key] === "number") { v += p.item[key]; any = true; } });
    if (any && v !== 0) combinedStats[key] = [label, v];
  });
  const statBadges = Object.values(combinedStats);

  const selectStyle = { fontSize: 12, color: TEXT.name, background: "#24221a", border: "0.5px solid #5b5540", borderRadius: 3, padding: "1px 4px" };

  return (
    <div
      className="tech-card"
      onDragOver={onDragOver}
      onDrop={onDrop}
      style={{
        background: "#161b27",
        border: entry.equipped ? "0.5px solid #a07c2e" : "0.5px solid #2d3555",
        borderRadius: 8,
        padding: "10px 12px", display: "flex", flexDirection: "column", gap: 6,
        opacity: isDragging ? 0.5 : 1,
      }}
    >
      <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
        {onDragStart && (
          <div
            draggable
            onDragStart={onDragStart}
            onDragEnd={onDragEnd}
            title="Drag to reorder"
            aria-label={`Drag to reorder ${entry.name || "custom item"}`}
            style={{
              display: "flex", alignItems: "center", justifyContent: "center",
              width: 16, flexShrink: 0, cursor: "grab", color: TEXT.faint, fontSize: 16,
              userSelect: "none",
            }}
          >
            ⠿
          </div>
        )}
        {readOnly ? (
          <span style={{
            fontFamily: "'MedievalSharp', Georgia, serif", fontWeight: "bold",
            fontSize: 15, color: TEXT.name, flex: 1, lineHeight: 1.3,
          }}>
            {entry.name.trim() || "Untitled item"}
          </span>
        ) : (
          <input
            type="text"
            value={entry.name}
            onChange={e => onNameChange(e.target.value)}
            placeholder="Item name…"
            style={{
              flex: 1, minWidth: 0, fontFamily: "'MedievalSharp', Georgia, serif", fontWeight: "bold",
              fontSize: 14, padding: "4px 8px",
            }}
          />
        )}
        {!readOnly && (
          <button
            onClick={onRemove}
            aria-label={`Remove ${entry.name || "custom item"}`}
            style={{ background: "transparent", border: "none", color: TEXT.faint, fontSize: 16, lineHeight: 1, padding: "2px 4px", flexShrink: 0 }}
          >
            ✕
          </button>
        )}
      </div>
      {!readOnly && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: TEXT.body }}>
          <span style={{ color: TEXT.faint, flexShrink: 0 }}>Slot</span>
          <select value={entry.slot || ""} onChange={e => onSlotChange(e.target.value)} style={{ fontSize: 12, flex: 1, minWidth: 0 }}>
            <option value="">No slot</option>
            {ITEM_SLOTS.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>
      )}
      {readOnly && entry.slot && (
        <span style={{ fontSize: 11, color: TEXT.muted, background: "#0d1117", border: "0.5px solid #2d3555", borderRadius: 3, padding: "1px 5px", alignSelf: "flex-start" }}>
          Custom · {entry.slot}
        </span>
      )}
      {readOnly ? (
        entry.text && (
          <div style={{ fontSize: 13, color: TEXT.body, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>
            {entry.text}
          </div>
        )
      ) : (
        <textarea
          value={entry.text}
          onChange={e => onTextChange(e.target.value)}
          placeholder="Description…"
          rows={2}
          style={{ fontSize: 13 }}
        />
      )}

      {statBadges.length > 0 && (
        <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
          {statBadges.map(([label, v]) => (
            <span key={label} style={{
              fontSize: 11, color: "#e8c46a", background: "#20180a", border: "0.5px solid #6b5423",
              borderRadius: 4, padding: "1px 6px",
            }}>
              {statBadge(label, v)}
            </span>
          ))}
        </div>
      )}

      {!readOnly && (
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {Object.entries(stats).map(([key, v]) => {
            const label = (ITEM_STAT_FIELDS.find(([k]) => k === key) || [key, key])[1];
            return (
              <div key={key} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
                <span style={{ color: TEXT.faint, flex: 1 }}>{label}</span>
                <input
                  type="number"
                  value={v}
                  onChange={e => onStatChange(key, Number(e.target.value) || 0)}
                  style={{ width: 56, fontSize: 12, textAlign: "right" }}
                />
                <button
                  onClick={() => onRemoveStat(key)}
                  aria-label={`Remove ${label}`}
                  style={{ background: "transparent", border: "none", color: TEXT.faint, fontSize: 14, lineHeight: 1, padding: "0 2px" }}
                >
                  ✕
                </button>
              </div>
            );
          })}
          {availableStats.length > 0 && (
            <select
              value=""
              onChange={e => { if (e.target.value) onAddStat(e.target.value); e.target.selectedIndex = 0; }}
              style={{ fontSize: 12 }}
            >
              <option value="">+ Add stat…</option>
              {availableStats.map(([key, label]) => <option key={key} value={key}>{label}</option>)}
            </select>
          )}
        </div>
      )}

      {/* Weapon stats — opt-in, so a non-weapon custom item (a trinket, a
          piece of armor) never shows an irrelevant Accuracy/Damage/Range
          form. Once added, the item behaves just like a real Weapon for
          the Attack Workspace and Parry Defense — see
          customWeapon{Accuracy,Parry,Range,Damage} and
          equippedWeaponAttacks/equipmentBonuses. The Improvised Weapon
          checkbox is how a makeshift weapon (a chair leg, a broken
          bottle) gets built now, instead of a dedicated data-file item —
          build its normal profile, then toggle the box to apply the
          same -1 Accuracy/-1 Parry/half Range the old built-in
          Improvised Weapon item used to carry. */}
      {readOnly && entry.weapon && (() => {
        const w = entry.weapon;
        const parts = [];
        const acc = customWeaponAccuracy(w);
        if (acc != null) parts.push(`Accuracy ${acc >= 0 ? "+" : ""}${acc}`);
        const dmg = customWeaponDamage(w, statPoints);
        if (dmg != null) parts.push(`Damage ${dmg}`);
        const rng = customWeaponRange(w);
        if (rng != null) parts.push(`Range ${rng}`);
        if (w.skill) parts.push(`Skill ${w.skill}`);
        const parry = customWeaponParry(w);
        if (parry != null) parts.push(`Parry ${parry >= 0 ? "+" : ""}${parry}`);
        if (parts.length === 0) return null;
        return (
          <div style={{ fontSize: 12, color: TEXT.faint, lineHeight: 1.5 }}>
            {parts.join("  ·  ")}{w.improvised && "  ·  Improvised"}
          </div>
        );
      })()}
      {!readOnly && (
        entry.weapon ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 5, border: "0.5px solid #2d3555", borderRadius: 6, padding: "6px 8px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ fontSize: 11, color: TEXT.label, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.04em", flex: 1 }}>
                Weapon Stats
              </span>
              <button
                onClick={onRemoveWeapon}
                aria-label="Remove weapon stats"
                style={{ background: "transparent", border: "none", color: TEXT.faint, fontSize: 14, lineHeight: 1, padding: "0 2px" }}
              >
                ✕
              </button>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
              <span style={{ color: TEXT.faint, width: 78, flexShrink: 0 }}>Accuracy</span>
              <input
                type="number" value={entry.weapon.accuracy ?? ""}
                onChange={e => onWeaponChange("accuracy", e.target.value === "" ? null : Number(e.target.value))}
                placeholder="0" style={{ width: 56, fontSize: 12, textAlign: "right" }}
              />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
              <span style={{ color: TEXT.faint, width: 78, flexShrink: 0 }}>Damage</span>
              <input
                type="number" value={entry.weapon.damageBase ?? ""}
                onChange={e => onWeaponChange("damageBase", e.target.value === "" ? null : Number(e.target.value))}
                placeholder="0" style={{ width: 56, fontSize: 12, textAlign: "right" }}
              />
              <select
                value={entry.weapon.damageStat || ""}
                onChange={e => onWeaponChange("damageStat", e.target.value || null)}
                style={{ fontSize: 12, flex: 1, minWidth: 0 }}
              >
                <option value="">No Stat bonus</option>
                {STATS.map(s => <option key={s} value={s}>+ {s}</option>)}
              </select>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
              <span style={{ color: TEXT.faint, width: 78, flexShrink: 0 }}>Damage Type</span>
              <input
                type="text" value={entry.weapon.damageType}
                onChange={e => onWeaponChange("damageType", e.target.value)}
                placeholder="Physical" style={{ flex: 1, minWidth: 0, fontSize: 12 }}
              />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
              <span style={{ color: TEXT.faint, width: 78, flexShrink: 0 }}>Range</span>
              <input
                type="text" value={entry.weapon.range}
                onChange={e => onWeaponChange("range", e.target.value)}
                placeholder="Close" style={{ flex: 1, minWidth: 0, fontSize: 12 }}
              />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
              <span style={{ color: TEXT.faint, width: 78, flexShrink: 0 }}>Skill</span>
              <input
                type="text" value={entry.weapon.skill}
                onChange={e => onWeaponChange("skill", e.target.value)}
                placeholder="Melee" style={{ flex: 1, minWidth: 0, fontSize: 12 }}
              />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
              <span style={{ color: TEXT.faint, width: 78, flexShrink: 0 }}>Parry</span>
              <input
                type="number" value={entry.weapon.weaponDefense ?? ""}
                onChange={e => onWeaponChange("weaponDefense", e.target.value === "" ? null : Number(e.target.value))}
                placeholder="—" style={{ width: 56, fontSize: 12, textAlign: "right" }}
              />
            </div>
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: TEXT.body, cursor: "pointer" }}>
              <input
                type="checkbox" checked={!!entry.weapon.improvised}
                onChange={e => onWeaponChange("improvised", e.target.checked)}
              />
              Improvised Weapon (−1 Accuracy, −1 Parry, half Range)
            </label>
          </div>
        ) : (
          <button
            onClick={onAddWeapon}
            style={{
              fontSize: 12, color: TEXT.muted, background: "transparent", border: "0.5px solid #2d3555",
              borderRadius: 4, padding: "4px 8px", alignSelf: "flex-start",
            }}
          >
            + Add weapon stats
          </button>
        )
      )}

      {/* Attached Masterwork powers — for the one ability that lets you
          stack more than one on an item. Effects text always shows, on
          both the Items tab and the read-only Sheet, since that's the
          actual rules text a player needs to use the power. */}
      {powers.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {powers.map(p => {
            const levels = p.item.levels || [];
            const variableLevel = levels.length > 1;
            const displayLevel = p.level ?? levels[0];
            return (
              <div key={p.id} style={{ border: "0.5px solid #2d3555", borderRadius: 6, padding: "6px 8px", display: "flex", flexDirection: "column", gap: 3 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 13, fontWeight: 500, color: TEXT.name, flex: 1 }}>{p.item.name}</span>
                  {levels.length > 0 && (
                    variableLevel && !readOnly ? (
                      <select value={displayLevel} onChange={e => onPowerLevelChange(p.id, Number(e.target.value))} style={selectStyle}>
                        {levels.map(lv => <option key={lv} value={lv}>Lv {lv}</option>)}
                      </select>
                    ) : (
                      <span style={selectStyle}>Lv {displayLevel}</span>
                    )
                  )}
                  {!readOnly && (
                    <button
                      onClick={() => onRemovePower(p.id)}
                      aria-label={`Remove ${p.item.name}`}
                      style={{ background: "transparent", border: "none", color: TEXT.faint, fontSize: 14, lineHeight: 1, padding: "0 2px" }}
                    >
                      ✕
                    </button>
                  )}
                </div>
                {p.item.effects && (
                  <div style={{ fontSize: 12, color: TEXT.body, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>
                    {p.item.effects}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
      {!readOnly && (
        <select
          value=""
          onChange={e => { if (e.target.value) onAddPower(e.target.value); e.target.selectedIndex = 0; }}
          style={{ fontSize: 12 }}
        >
          <option value="">+ Add Masterwork power…</option>
          {masterworkOptions.map(mw => <option key={mw.id} value={mw.id}>{mw.name}</option>)}
        </select>
      )}

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginTop: "auto" }}>
        <span style={{ fontSize: 12, color: TEXT.faint }}>Qty</span>
        {readOnly ? (
          <span style={{ fontSize: 14, fontWeight: 500, color: TEXT.name }}>{entry.qty}</span>
        ) : (
          <PointStepper value={entry.qty} max={99} onChange={onQtyChange} />
        )}
      </div>
      {showEquip && entry.slot && (
        <div style={{ display: "flex", alignItems: "center", gap: 12, paddingTop: 4, borderTop: "0.5px solid #2d3555" }}>
          <label
            title={equipDisabled ? `No room left in the ${entry.slot} slot` : undefined}
            style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: equipDisabled ? TEXT.faint : TEXT.body, cursor: equipDisabled ? "not-allowed" : "pointer" }}
          >
            <input type="checkbox" checked={!!entry.equipped} disabled={equipDisabled} onChange={onToggleEquipped} />
            Equipped
          </label>
        </div>
      )}
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// SOURCES SECTION — Builder tab only. Collapsed by default; expands to
// a checkbox per known supplement (Base Game, Goblin Game, …), letting
// a player enable or disable which supplements' items/backgrounds show
// up as pickable — see the App-level enabledSupplements/toggleSupplement
// and where InventorySection/BackgroundsSection filter their search
// results by it. Unchecking a supplement only hides it from those
// picker lists going forward; anything already added to the build
// stays exactly as it was.
// ══════════════════════════════════════════════════════════════════
function SourcesSection({ supplements, enabledSupplements, onToggle }) {
  const [collapsed, setCollapsed] = useState(true);
  const collapseBtnStyle = {
    fontSize: 12, color: TEXT.muted, background: "transparent",
    border: "0.5px solid #2d3555", borderRadius: 4, padding: "2px 10px", flexShrink: 0,
  };

  if (collapsed) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
        <div style={{ fontSize: 13, color: TEXT.body }}>
          {enabledSupplements.length > 0 ? enabledSupplements.join(", ") : "None enabled"}
        </div>
        <button onClick={() => setCollapsed(false)} style={collapseBtnStyle}>Show</button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
        <button onClick={() => setCollapsed(true)} style={collapseBtnStyle}>Hide</button>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {supplements.map(s => (
          <label key={s} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, color: TEXT.body, cursor: "pointer" }}>
            <input type="checkbox" checked={enabledSupplements.includes(s)} onChange={() => onToggle(s)} />
            {s}
          </label>
        ))}
      </div>
    </div>
  );
}

// A background's exclusivity group: General is its own slot, Settler
// and Wildfolk share one slot (mutually exclusive with each other, not
// just within themselves — see toggleBackground), and anything else
// (a Goblin clan background, Category = the clan's own name) gets a
// slot unique to that one background, i.e. no exclusivity with
// anything at all, not even its own clan's other bonus — clan
// membership grants every one of its bonuses at once, not a choice
// among them.
function backgroundSlot(bg) {
  if (bg.category === "Settler" || bg.category === "Wildfolk") return "Type";
  if (bg.category === "General") return "General";
  return `free:${bg.id}`;
}
// Which backgrounds show up regardless of the Settler/Wildfolk toggle —
// true General ones, plus anything not on that axis at all (a Goblin
// clan background), matching how clan membership isn't itself a
// Settler-or-Wildfolk choice. Settler/Wildfolk backgrounds only show
// while their own toggle is active.
function isAlwaysAvailableBackground(category) {
  return category !== "Settler" && category !== "Wildfolk";
}

// ══════════════════════════════════════════════════════════════════
// BACKGROUNDS SECTION — a Settler/Wildfolk toggle, the selected
// background(s) as a drag-reorderable list (same handle as techniques),
// and a picker grid of everything still eligible to pick. Selecting a
// background already picked in the same slot (General, whichever of
// Settler/Wildfolk the toggle is on, or — freely, no exclusivity at
// all — a Goblin clan background) replaces it, like a radio button —
// see backgroundSlot. Read-only on the Character Sheet: just the
// picks, no toggle/picker.
// ══════════════════════════════════════════════════════════════════
function BackgroundsSection({
  backgrounds, backgroundType, onBackgroundTypeChange,
  selectedIds, onToggle, onMove, dragId, setDragId,
  enabledSupplements = null,
  readOnly = false,
}) {
  const [collapsed, setCollapsed] = useState(true);
  const selected = selectedIds.map(id => backgrounds.find(b => b.id === id)).filter(Boolean);

  if (readOnly) {
    if (selected.length === 0) return null;
    return (
      <div className="tech-list">
        {selected.map(bg => <BackgroundCard key={bg.id} bg={bg} readOnly />)}
      </div>
    );
  }

  const collapseBtnStyle = {
    fontSize: 12, color: TEXT.muted, background: "transparent",
    border: "0.5px solid #2d3555", borderRadius: 4, padding: "2px 10px", flexShrink: 0,
  };

  // Tucked out of the way — just the picks (if any), plus a button to
  // bring the toggle/picker grid back.
  if (collapsed) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
        <div style={{ fontSize: 13, color: selected.length > 0 ? TEXT.body : TEXT.faint }}>
          {selected.length > 0 ? selected.map(bg => bg.name).join(", ") : "No backgrounds selected"}
        </div>
        <button onClick={() => setCollapsed(false)} style={collapseBtnStyle}>Show</button>
      </div>
    );
  }

  const eligible  = backgrounds.filter(b =>
    (!enabledSupplements || enabledSupplements.includes(b.supplement)) &&
    (isAlwaysAvailableBackground(b.category) || b.category === backgroundType)
  );
  const available = eligible.filter(b => !selectedIds.includes(b.id));
  const toggleBtnStyle = active => ({
    padding: "4px 14px", fontSize: 13, fontWeight: 500, borderRadius: 6,
    background: active ? "#d4a843" : "transparent",
    color: active ? "#0a0e18" : TEXT.muted,
    border: `0.5px solid ${active ? "#d4a843" : "#2d3555"}`,
  });

  return (
    <div>
      <div style={{ display: "flex", gap: 6, marginBottom: 12, alignItems: "center", justifyContent: "space-between", flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => onBackgroundTypeChange("Settler")} style={toggleBtnStyle(backgroundType === "Settler")}>Settler</button>
          <button onClick={() => onBackgroundTypeChange("Wildfolk")} style={toggleBtnStyle(backgroundType === "Wildfolk")}>Wildfolk</button>
        </div>
        <button onClick={() => setCollapsed(true)} style={collapseBtnStyle}>Hide</button>
      </div>

      {selected.length > 0 && (
        <div className="tech-list" style={{ marginBottom: 12 }}>
          {selected.map(bg => (
            <div
              key={bg.id}
              onDragOver={e => { if (dragId) e.preventDefault(); }}
              onDrop={e => { e.preventDefault(); if (dragId) onMove(dragId, bg.id); setDragId(null); }}
              style={{ display: "flex", gap: 6, alignItems: "stretch", opacity: dragId === bg.id ? 0.5 : 1 }}
            >
              <div
                draggable
                onDragStart={e => { e.dataTransfer.effectAllowed = "move"; setDragId(bg.id); }}
                onDragEnd={() => setDragId(null)}
                title="Drag to reorder"
                aria-label={`Drag to reorder ${bg.name}`}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "center",
                  width: 22, flexShrink: 0, cursor: "grab", color: TEXT.faint, fontSize: 16,
                  userSelect: "none",
                }}
              >
                ⠿
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <BackgroundCard bg={bg} selected onToggle={onToggle} />
              </div>
            </div>
          ))}
        </div>
      )}

      {available.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 10 }}>
          {available.map(bg => <BackgroundCard key={bg.id} bg={bg} onToggle={onToggle} />)}
        </div>
      )}
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// INVENTORY SECTION — a Gold field, a search+category picker to add
// items (items.json has 116 rows, so results only show once you search
// or pick a category rather than always listing all of them), and a
// multi-column grid of what's actually carried — wider tiles than the
// single-column technique list, since items are meant to read as a
// visually distinct "shelf" rather than another technique-shaped list.
// Read-only on the Character Sheet: just Gold + the carried grid, no
// picker, no Cost on the tiles.
// ══════════════════════════════════════════════════════════════════
// How much of a slot's capacity is spent — 2 for Held (two hands) and
// Ring (one per hand), 1 for everything else. A 2H weapon/bow takes
// both Held slots at once (its own held_slots column); everything else,
// including rings, takes 1. A custom item always costs 1 (no held_slots
// concept for freeform gear).
// The 12 canonical crafting Material Types from the rulebook's Creating
// Items chapter — shared by the Material item category (see items.csv's
// Material Types column) and custom materials below, so a future
// crafting-recipe checker can treat either source the same way.
const MATERIAL_TYPES = ["Bone", "Cloth", "Leather", "Metal", "Wood", "Food",
  "Medicinal", "Precious", "Brilliant", "Fire", "Frost", "Shadow"];

// ══════════════════════════════════════════════════════════════════
// CUSTOM MATERIAL TILE — a GM-granted crafting material that doesn't
// come from the data file, e.g. a special one that counts as both Metal
// and Fire. Deliberately much lighter than CustomItemTile (no slot,
// equip, stats, or powers — materials aren't worn) since the whole
// point is this should take a few clicks, not a form: a name, a Level
// (capped at 5 like every data-file item), and any number of Types
// toggled on. Read-only view only lists the Types that are actually on,
// not the full picker.
// ══════════════════════════════════════════════════════════════════
function CustomMaterialTile({ entry, onNameChange, onLevelChange, onQtyChange, onToggleType, onRemove, readOnly = false }) {
  return (
    <div className="tech-card" style={{
      background: "#161b27", border: "0.5px solid #2d3555", borderRadius: 8,
      padding: "10px 12px", display: "flex", flexDirection: "column", gap: 6,
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        {readOnly ? (
          <span style={{ fontFamily: "'MedievalSharp', Georgia, serif", fontWeight: "bold", fontSize: 15, color: TEXT.name, flex: 1 }}>
            {entry.name || "Custom material"}
          </span>
        ) : (
          <input
            type="text" placeholder="Material name…"
            value={entry.name} onChange={e => onNameChange(e.target.value)}
            style={{ flex: 1, fontSize: 14, fontFamily: "'MedievalSharp', Georgia, serif" }}
          />
        )}
        {!readOnly && (
          <button
            onClick={onRemove}
            aria-label={`Remove ${entry.name || "custom material"}`}
            style={{ background: "transparent", border: "none", color: TEXT.faint, fontSize: 16, lineHeight: 1, padding: "2px 4px", flexShrink: 0 }}
          >
            ✕
          </button>
        )}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <span style={{ fontSize: 12, color: TEXT.faint }}>Level</span>
        {readOnly ? (
          <span style={{ fontSize: 13, color: TEXT.name }}>{entry.level}</span>
        ) : (
          <PointStepper value={entry.level} max={5} onChange={onLevelChange} />
        )}
      </div>
      <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
        {MATERIAL_TYPES.filter(t => !readOnly || entry.types.includes(t)).map(t => {
          const active = entry.types.includes(t);
          return (
            <button
              key={t}
              onClick={readOnly ? undefined : () => onToggleType(t)}
              disabled={readOnly}
              style={{
                fontSize: 11, padding: "1px 7px", borderRadius: 4,
                background: active ? "#20180a" : "transparent",
                color: active ? "#e8c46a" : TEXT.faint,
                border: `0.5px solid ${active ? "#6b5423" : "#2d3555"}`,
                cursor: readOnly ? "default" : "pointer",
              }}
            >
              {t}
            </button>
          );
        })}
        {readOnly && entry.types.length === 0 && (
          <span style={{ fontSize: 12, color: TEXT.faint, fontStyle: "italic" }}>No types set</span>
        )}
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginTop: "auto" }}>
        <span style={{ fontSize: 12, color: TEXT.faint }}>Qty</span>
        {readOnly ? (
          <span style={{ fontSize: 14, fontWeight: 500, color: TEXT.name }}>{entry.qty}</span>
        ) : (
          <PointStepper value={entry.qty} max={99} onChange={onQtyChange} />
        )}
      </div>
    </div>
  );
}


const ITEM_SLOTS = ["Head", "Neck", "Torso", "Hands", "Ring", "Held", "Belt", "Feet", "Other"];
const SLOT_CAPACITY = { Held: 2, Ring: 2 };
// "Unarmed" (fighting bare-handed) is a Weapon with no Slot in the data
// — no weapon item is required — but it still needs an empty hand to
// throw a punch with, so it's treated as an ordinary one-handed Held
// item everywhere slot capacity and equip eligibility are checked
// (effectiveSlot falls it back to "Held"; slotCost's default of 1
// applies since it has no held_slots of its own to override that). It
// can't be equipped, same as any other Held item, if both hands are
// already full — e.g. with a Heavy Two-Handed weapon.
function effectiveSlot(item) {
  return item.slot || (item.category === "Weapon" ? "Held" : null);
}
function slotCost(item) {
  return effectiveSlot(item) === "Held" ? (item.held_slots || 1) : 1;
}

function InventorySection({
  items, inventory, gold, onGoldChange, onAdd, onQtyChange, onRemove, readOnly = false,
  showEquip = false, onToggleEquipped, onBaseItemChange, onLevelChange,
  customItems = [], onAddCustomItem, onUpdateCustomItem, onRemoveCustomItem,
  onToggleCustomItemEquipped, onAddCustomItemStat, onCustomItemStatChange, onRemoveCustomItemStat,
  onAddCustomItemPower, onCustomItemPowerLevelChange, onRemoveCustomItemPower,
  onAddCustomItemWeapon, onRemoveCustomItemWeapon, onCustomItemWeaponChange, statPoints, skillPoints,
  enabledSupplements = null,
  dragId, setDragId, onMoveInventoryItem, onMoveCustomItem,
  customMaterials = [], onAddCustomMaterial, onUpdateCustomMaterial, onToggleCustomMaterialType, onRemoveCustomMaterial,
}) {
  const [search, setSearch] = useState("");
  const [category, setCategory] = useState("");
  // Advanced filters — Slot, Tags (freeform keywords like "Implement"
  // or "Grenade"), and Supplement (Base Game vs. a supplement like
  // Goblin Game) — a cross-section of the item-data columns that
  // aren't already covered by the name search or the Category picker.
  const [advancedOpen, setAdvancedOpen] = useState(false);
  const [slotFilter, setSlotFilter] = useState("");
  const [tagFilter, setTagFilter] = useState("");
  const [supplementFilter, setSupplementFilter] = useState("");
  const NO_SLOT = "__none__";
  // Items from a disabled supplement (see the Sources panel on
  // Builder) never show up as something new to add — but `items`
  // itself stays the full list, since a copy already carried from a
  // since-disabled supplement still needs to render normally (base-item
  // lookups, Masterwork power resolution, etc.) rather than vanishing.
  const visibleItems = useMemo(
    () => enabledSupplements ? items.filter(it => enabledSupplements.includes(it.supplement)) : items,
    [items, enabledSupplements]
  );
  const categories = useMemo(() => [...new Set(visibleItems.map(i => i.category))].sort(), [visibleItems]);
  const slots = useMemo(() => [...new Set(visibleItems.map(i => i.slot).filter(Boolean))].sort(), [visibleItems]);
  const tagOptions = useMemo(() => {
    const set = new Set();
    visibleItems.forEach(it => splitCSV(it.tags).forEach(t => set.add(t)));
    return [...set].sort();
  }, [visibleItems]);
  const supplements = useMemo(() => [...new Set(visibleItems.map(i => i.supplement).filter(Boolean))].sort(), [visibleItems]);

  const results = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q && !category && !slotFilter && !tagFilter && !supplementFilter) return [];
    return visibleItems
      .filter(it =>
        (!category || it.category === category) &&
        (!slotFilter || (slotFilter === NO_SLOT ? !it.slot : it.slot === slotFilter)) &&
        (!tagFilter || splitCSV(it.tags).includes(tagFilter)) &&
        (!supplementFilter || it.supplement === supplementFilter) &&
        (!q || it.name.toLowerCase().includes(q))
      )
      .slice(0, 40);
  }, [visibleItems, search, category, slotFilter, tagFilter, supplementFilter]);

  // Slot capacity used by everything currently equipped — real items and
  // custom items share the same per-slot capacity, since a custom Ring
  // still only leaves room for one more Ring. Used for the Equipped-by-
  // slot summary and for disabling a checkbox that would overflow a slot.
  const bySlot = useMemo(() => {
    const map = {};
    if (!showEquip) return map;
    inventory.forEach(e => {
      if (!e.equipped) return;
      const item = items.find(i => i.id === e.itemId);
      const slot = item && effectiveSlot(item);
      if (!slot) return;
      const name = item.name + (e.level && item.levels?.length > 1 ? ` (Lv ${e.level})` : "");
      (map[slot] ??= []).push({ name, cost: slotCost(item) });
    });
    customItems.forEach(c => {
      if (!c.equipped || !c.slot) return;
      (map[c.slot] ??= []).push({ name: c.name.trim() || "Custom item", cost: 1 });
    });
    return map;
  }, [inventory, items, customItems, showEquip]);

  // Crafting materials (Category = "Material") never get equipped, so
  // they'd just be dead weight in the Equipped-sorted gear grid below —
  // pulled out into their own list, shown alongside custom materials in
  // the Materials box near the bottom instead.
  const materialInventory = inventory.filter(e => items.find(i => i.id === e.itemId)?.category === "Material");
  const gearInventory = inventory.filter(e => items.find(i => i.id === e.itemId)?.category !== "Material");

  // On the Character Sheet (showEquip, always readOnly), equipped items
  // float to the top of the grid so what's actually being worn/wielded
  // reads first — the Items tab keeps whatever order the player dragged
  // things into (see the drag handles below), since reordering there
  // would be pointless if the Sheet just re-sorted it anyway.
  const displayInventory = showEquip
    ? [...gearInventory].sort((a, b) => (b.equipped ? 1 : 0) - (a.equipped ? 1 : 0))
    : gearInventory;
  const displayCustomItems = showEquip
    ? [...customItems].sort((a, b) => (b.equipped ? 1 : 0) - (a.equipped ? 1 : 0))
    : customItems;

  const grid = (
    gearInventory.length === 0 && customItems.length === 0 ? (
      <div style={{ textAlign: "center", padding: "20px 16px", color: TEXT.faint, fontSize: 14 }}>
        {readOnly ? "No items carried." : "No items carried yet — search below to add some."}
      </div>
    ) : (
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 10 }}>
        {displayInventory.map(entry => {
          const item = items.find(i => i.id === entry.itemId);
          const slot = item && effectiveSlot(item);
          let equipDisabled = false;
          if (showEquip && slot && !entry.equipped) {
            const capacity = SLOT_CAPACITY[slot] || 1;
            const used = (bySlot[slot] || []).reduce((sum, x) => sum + x.cost, 0);
            equipDisabled = used + slotCost(item) > capacity;
          }
          return (
            <InventoryTile
              key={entry.uid}
              entry={entry}
              item={item}
              allItems={items}
              onQtyChange={readOnly ? undefined : (q => onQtyChange(entry.uid, q))}
              onRemove={readOnly ? undefined : (() => onRemove(entry.uid))}
              readOnly={readOnly}
              showEquip={showEquip}
              equipDisabled={equipDisabled}
              onToggleEquipped={() => onToggleEquipped(entry.uid)}
              onBaseItemChange={v => onBaseItemChange(entry.uid, v)}
              onLevelChange={readOnly ? undefined : (lv => onLevelChange(entry.uid, lv))}
              statPoints={statPoints} skillPoints={skillPoints}
              onDragStart={readOnly ? undefined : (e => { e.dataTransfer.effectAllowed = "move"; setDragId(entry.uid); })}
              onDragEnd={readOnly ? undefined : (() => setDragId(null))}
              onDragOver={readOnly ? undefined : (e => { if (dragId) e.preventDefault(); })}
              onDrop={readOnly ? undefined : (e => { e.preventDefault(); if (dragId) onMoveInventoryItem(dragId, entry.uid); setDragId(null); })}
              isDragging={dragId === entry.uid}
            />
          );
        })}
        {displayCustomItems.map(entry => {
          let equipDisabled = false;
          if (showEquip && entry.slot && !entry.equipped) {
            const capacity = SLOT_CAPACITY[entry.slot] || 1;
            const used = (bySlot[entry.slot] || []).reduce((sum, x) => sum + x.cost, 0);
            equipDisabled = used + 1 > capacity;
          }
          return (
            <CustomItemTile
              key={entry.id}
              entry={entry}
              allItems={items}
              readOnly={readOnly}
              showEquip={showEquip}
              equipDisabled={equipDisabled}
              onNameChange={readOnly ? undefined : (v => onUpdateCustomItem(entry.id, "name", v))}
              onTextChange={readOnly ? undefined : (v => onUpdateCustomItem(entry.id, "text", v))}
              onQtyChange={readOnly ? undefined : (q => onUpdateCustomItem(entry.id, "qty", q))}
              onSlotChange={readOnly ? undefined : (v => onUpdateCustomItem(entry.id, "slot", v))}
              onRemove={readOnly ? undefined : (() => onRemoveCustomItem(entry.id))}
              onToggleEquipped={() => onToggleCustomItemEquipped(entry.id)}
              onAddStat={key => onAddCustomItemStat(entry.id, key)}
              onStatChange={(key, v) => onCustomItemStatChange(entry.id, key, v)}
              onRemoveStat={key => onRemoveCustomItemStat(entry.id, key)}
              onAddPower={itemId => onAddCustomItemPower(entry.id, itemId)}
              onPowerLevelChange={(powerId, lv) => onCustomItemPowerLevelChange(entry.id, powerId, lv)}
              onRemovePower={powerId => onRemoveCustomItemPower(entry.id, powerId)}
              onAddWeapon={() => onAddCustomItemWeapon(entry.id)}
              onRemoveWeapon={() => onRemoveCustomItemWeapon(entry.id)}
              onWeaponChange={(field, v) => onCustomItemWeaponChange(entry.id, field, v)}
              statPoints={statPoints}
              enabledSupplements={enabledSupplements}
              onDragStart={readOnly ? undefined : (e => { e.dataTransfer.effectAllowed = "move"; setDragId(entry.id); })}
              onDragEnd={readOnly ? undefined : (() => setDragId(null))}
              onDragOver={readOnly ? undefined : (e => { if (dragId) e.preventDefault(); })}
              onDrop={readOnly ? undefined : (e => { e.preventDefault(); if (dragId) onMoveCustomItem(dragId, entry.id); setDragId(null); })}
              isDragging={dragId === entry.id}
            />
          );
        })}
      </div>
    )
  );

  return (
    <div>
      <div className="sheet-box" style={{
        display: "inline-flex", alignItems: "center", gap: 8,
        background: "#161b27", border: "0.5px solid #2d3555", borderRadius: 8,
        padding: "8px 12px", marginBottom: 14,
      }}>
        <span style={{ fontSize: 12, color: TEXT.label, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em" }}>Gold</span>
        {readOnly ? (
          <span style={{ fontSize: 15, fontWeight: 500, color: TEXT.name }}>{gold || "0"}</span>
        ) : (
          <input
            type="text" inputMode="numeric" placeholder="0"
            value={gold}
            onChange={e => onGoldChange(e.target.value.replace(/[^\d]/g, ""))}
            style={{ width: 70, fontSize: 14, textAlign: "right" }}
          />
        )}
      </div>

      {showEquip && (
        <div className="sheet-box" style={{
          background: "#161b27", border: "0.5px solid #2d3555", borderRadius: 8,
          padding: "10px 12px", marginBottom: 14,
          display: "flex", flexDirection: "column", gap: 4,
        }}>
          <div style={{ fontSize: 12, color: TEXT.label, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 2 }}>
            Equipped
          </div>
          {ITEM_SLOTS.map(slot => (
            <div key={slot} style={{ display: "flex", gap: 8, fontSize: 13 }}>
              <span style={{ color: TEXT.faint, minWidth: 46, flexShrink: 0 }}>{slot}</span>
              <span style={{ color: (bySlot[slot] || []).length ? TEXT.body : TEXT.faint }}>
                {(bySlot[slot] || []).length ? bySlot[slot].map(x => x.name).join(", ") : "—"}
              </span>
            </div>
          ))}
        </div>
      )}

      {!readOnly && (
        <>
          <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
            <input
              type="text" placeholder="Search items to add…"
              value={search} onChange={e => setSearch(e.target.value)}
              style={{ flex: "1 1 220px", fontSize: 13 }}
            />
            <select value={category} onChange={e => setCategory(e.target.value)} style={{ fontSize: 13 }}>
              <option value="">All categories</option>
              {categories.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <button
              onClick={() => setAdvancedOpen(o => !o)}
              style={{
                padding: "6px 14px", fontSize: 13, fontWeight: 500, borderRadius: 6,
                background: "transparent", color: TEXT.muted, border: "0.5px solid #2d3555",
                display: "flex", alignItems: "center", gap: 5,
              }}
            >
              {advancedOpen ? "▲" : "▼"} Advanced
            </button>
          </div>
          {advancedOpen && (
            <div style={{
              display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap",
              fontSize: 13, color: TEXT.muted,
              background: "#12161f", border: "0.5px solid #2d3555",
              borderRadius: 8, padding: "10px 14px", marginBottom: 10,
            }}>
              <select value={slotFilter} onChange={e => setSlotFilter(e.target.value)} style={{ fontSize: 13 }}>
                <option value="">Any slot</option>
                {slots.map(s => <option key={s} value={s}>{s}</option>)}
                <option value={NO_SLOT}>No slot</option>
              </select>
              <select value={tagFilter} onChange={e => setTagFilter(e.target.value)} style={{ fontSize: 13 }}>
                <option value="">Any keyword</option>
                {tagOptions.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
              <select value={supplementFilter} onChange={e => setSupplementFilter(e.target.value)} style={{ fontSize: 13 }}>
                <option value="">Any supplement</option>
                {supplements.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          )}
          {results.length > 0 && (
            <div style={{
              display: "flex", flexDirection: "column", gap: 4, marginBottom: 14,
              maxHeight: 220, overflowY: "auto",
              border: "0.5px solid #2d3555", borderRadius: 6, padding: 8,
            }}>
              {results.map(it => (
                <div key={it.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "3px 4px" }}>
                  <span style={{ fontSize: 13, color: TEXT.body }}>
                    {it.name} <span style={{ fontSize: 11, color: TEXT.faint }}>({it.category}{it.slot ? ` · ${it.slot}` : ""})</span>
                  </span>
                  <button
                    onClick={() => onAdd(it.id)}
                    style={{ fontSize: 12, color: "#d4a843", background: "transparent", border: "0.5px solid #a07c2e", borderRadius: 4, padding: "2px 8px", flexShrink: 0 }}
                  >
                    + Add
                  </button>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {grid}

      {!readOnly && (
        <button
          onClick={onAddCustomItem}
          style={{
            marginTop: 10, padding: "6px 14px", fontSize: 14, fontWeight: 500, borderRadius: 6,
            background: "transparent", color: TEXT.muted, border: "0.5px solid #2d3555",
            display: "flex", alignItems: "center", gap: 5,
          }}
        >
          + Add custom item
        </button>
      )}

      {/* Materials — kept visually separate from the gear grid above
          since they're resources to spend (crafting), not things worn
          or wielded. Catalog materials (Category = "Material", added via
          the search above like any other item) and custom materials
          (GM-granted, arbitrary Type combinations — see
          CustomMaterialTile) render side by side here since a future
          crafting-recipe check needs to treat them the same way. */}
      {(materialInventory.length > 0 || customMaterials.length > 0 || !readOnly) && (
        <div style={{ marginTop: 20 }}>
          <div style={{ fontSize: 13, color: TEXT.faint, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.07em" }}>
            Materials
          </div>
          {materialInventory.length === 0 && customMaterials.length === 0 ? (
            <div style={{ textAlign: "center", padding: "16px", color: TEXT.faint, fontSize: 14 }}>
              {readOnly ? "No materials carried." : "No materials carried yet — search above (Category: Material) or add a custom one below."}
            </div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 10 }}>
              {materialInventory.map(entry => {
                const item = items.find(i => i.id === entry.itemId);
                return (
                  <InventoryTile
                    key={entry.uid}
                    entry={entry}
                    item={item}
                    allItems={items}
                    onQtyChange={readOnly ? undefined : (q => onQtyChange(entry.uid, q))}
                    onRemove={readOnly ? undefined : (() => onRemove(entry.uid))}
                    readOnly={readOnly}
                    statPoints={statPoints} skillPoints={skillPoints}
                  />
                );
              })}
              {customMaterials.map(entry => (
                <CustomMaterialTile
                  key={entry.id}
                  entry={entry}
                  readOnly={readOnly}
                  onNameChange={readOnly ? undefined : (v => onUpdateCustomMaterial(entry.id, "name", v))}
                  onLevelChange={readOnly ? undefined : (v => onUpdateCustomMaterial(entry.id, "level", v))}
                  onQtyChange={readOnly ? undefined : (v => onUpdateCustomMaterial(entry.id, "qty", v))}
                  onToggleType={readOnly ? undefined : (t => onToggleCustomMaterialType(entry.id, t))}
                  onRemove={readOnly ? undefined : (() => onRemoveCustomMaterial(entry.id))}
                />
              ))}
            </div>
          )}
          {!readOnly && (
            <button
              onClick={onAddCustomMaterial}
              style={{
                marginTop: 10, padding: "6px 14px", fontSize: 14, fontWeight: 500, borderRadius: 6,
                background: "transparent", color: TEXT.muted, border: "0.5px solid #2d3555",
                display: "flex", alignItems: "center", gap: 5,
              }}
            >
              + Add custom material
            </button>
          )}
        </div>
      )}
    </div>
  );
}

// BUILD PANEL — character name, stats, export/import/share, and the
// build list. Rendered both on the standalone "My build" tab and in
// the sticky sidebar next to the technique list on wide screens.
// ══════════════════════════════════════════════════════════════════
function XPTiles({ knownXP, unknownCount, totalXP }) {
  return (
    <>
      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap" }}>
        <div style={{
          background:"#161b27", border:"0.5px solid #2d3555",
          borderRadius:8, padding:"8px 14px", minWidth:110,
        }}>
          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:4 }}>Technique XP</div>
          <div style={{ fontSize:22, fontWeight:500 }}>
            {unknownCount > 0 ? `${knownXP}+` : `${knownXP}`}
            <span style={{ fontSize:13, color:TEXT.faint, marginLeft:4 }}>XP</span>
          </div>
        </div>
        <div style={{
          background:"#161b27", border:"0.5px solid #2d3555",
          borderRadius:8, padding:"8px 14px", minWidth:110,
        }}>
          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:4 }}>Total XP</div>
          <div style={{ fontSize:22, fontWeight:500 }}>
            {unknownCount > 0 ? `${totalXP}+` : `${totalXP}`}
