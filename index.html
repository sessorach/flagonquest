<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlagonQuest</title>
  <link rel="icon" href="assets/mug-icon.png">

  <!-- Tabler Icons webfont — used for the button icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <!-- MedievalSharp — fantasy display font for names/headings (free, OFL license) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

  <!-- React 18 (the UI framework) and ReactDOM (renders it to the page) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone: lets us write JSX (the HTML-in-JS syntax) directly
       in this file without a build step. Fine for a small group tool. -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ── Reset & base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e8dfc8;
      min-height: 100vh;
    }

    /* ── Inputs ────────────────────────────────────────────────── */
    input[type=text], input[type=search], textarea {
      background: #1e2435;
      border: 0.5px solid #2d3555;
      border-radius: 6px;
      padding: 7px 11px;
      color: #e8dfc8;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type=text]:focus,
    input[type=search]:focus,
    textarea:focus { border-color: #d4a843; }

    select { cursor: pointer; outline: none; transition: border-color 0.15s; }
    select:focus { border-color: #d4a843; }

    input[type=range]    { accent-color: #d4a843; cursor: pointer; }
    input[type=checkbox] { accent-color: #d4a843; cursor: pointer; }

    /* ── Site header ───────────────────────────────────────────────
       Narrow screens: just a wrapping flex row, DOM order = brand,
       switcher, nav — so the logo still reads first on mobile.
       Wide screens: a 3-column grid (switcher / brand / nav) with the
       brand truly centered regardless of how wide the other two are;
       `order` puts the switcher first and nav last without changing
       the DOM order the narrow layout relies on. */
    .site-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    @media (min-width: 900px) {
      .site-header { display: grid; grid-template-columns: 1fr auto 1fr; }
      .site-header .site-header-left  { order: 1; justify-self: start; }
      .site-header .site-header-brand { order: 2; justify-self: center; }
      .site-header .site-header-nav   { order: 3; justify-self: end; }
    }

    /* ── Technique list (Browse) ──────────────────────────────────
       Always a single column — cards show full technique text now,
       so multiple columns made them too narrow to read comfortably. */
    .tech-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Browse layout: list + build sidebar ────────────────────────
       Mobile/narrow: just the list. The build panel lives on its own
       "My build" tab, same as before.
       Wide screens: list on the left, a sticky build sidebar on the
       right so you can pick techniques and watch your build fill in
       without switching tabs. */
    .browse-layout { display: block; }
    .browse-build-panel { display: none; }
    @media (min-width: 1000px) {
      .browse-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 20px;
        align-items: start;
      }
      .browse-build-panel {
        display: block;
        position: sticky;
        top: 78px;
        max-height: calc(100vh - 96px);
        overflow-y: auto;
        background: #12161f;
        border: 0.5px solid #2d3555;
        border-radius: 8px;
        padding: 16px;
      }
    }

    /* ── Stats & Skills grid ───────────────────────────────────────
       5 stat blocks — one column on narrow screens, stepping up as
       space allows, capped at 5-across (never more, even on very
       wide screens) since there are exactly 5 stats. */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 560px)  { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 840px)  { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1100px) { .stat-grid { grid-template-columns: repeat(5, 1fr); } }

    /* ── Scrollbar ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3555; border-radius: 4px; }

    /* ── Buttons ───────────────────────────────────────────────── */
    button { font-family: inherit; cursor: pointer; }
    button:hover { opacity: 0.85; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    button:disabled:hover { opacity: 0.5; }
    .rulebook-link:hover { opacity: 0.85; }

    /* ── Print / "Save as PDF" (Character Sheet only) ─────────────
       Flattens the dark theme to plain black-on-white, hides the
       header/tabs, and reshapes the boxes into solid-bordered, tightly
       packed blocks closer to a paper character sheet — small type is
       fine here, this is a reference printout, not a screen. !important
       throughout since the whole app is otherwise styled inline. */
    @media print {
      @page { margin: 0.4in; }
      .no-print { display: none !important; }
      body { background: #fff !important; }
      * {
        background: #fff !important;
        color: #111 !important;
        border-color: #000 !important;
        box-shadow: none !important;
      }

      .sheet-page { max-width: none !important; padding: 0 !important; padding-bottom: 26px !important; }

      /* Solid black boxes instead of the screen's faint hairlines — the
         name/concept box, the print-only Total XP box, Stats & Skills,
         Vitals/Defenses/Health/Resists, and each technique all get this
         treatment, and none of them split across a page break. The
         header row itself (.sheet-header) stays unboxed — its two
         children are the boxes, not the row around them. */
      .sheet-box, .tech-card {
        border-width: 1px !important;
        border-style: solid !important;
        border-radius: 2px !important;
        break-inside: avoid;
      }
      .sheet-box { padding: 5px 8px !important; zoom: 0.85; }
      .tech-card { padding: 6px 9px !important; gap: 4px !important; zoom: 0.68; }

      /* Hidden on screen (the StatsPanel's own XP summary bar, marked
         no-print below, covers this there); shown only here, as its own
         small box in the header. */
      .print-only { display: flex !important; }

      /* Stats & Skills stays 5-across regardless of the page's physical
         width — the .stat-grid breakpoints are viewport-width media
         queries tuned for screens, and a printed page is narrower. */
      .stat-grid { grid-template-columns: repeat(5, 1fr) !important; gap: 5px !important; }
      .tech-list { gap: 5px !important; }

      /* Vitals/Defenses/Health/Resists likewise stays 4-across — on
         screen this row's flex-wrap only kicks in on a narrow window, so
         it never wraps there, but a printed page is narrower than most
         screens and would otherwise push the 4th box (Resists) onto its
         own nearly-empty line. Forcing nowrap here just lets the boxes'
         existing flex-shrink narrow them to fit one line instead. */
      .derived-stats-row { flex-wrap: nowrap !important; gap: 6px !important; }
      .derived-stats-row .sheet-box { padding: 4px 6px !important; }

      /* Alternating row tint — screen uses a faint white overlay (fine on
         the dark theme), but that's invisible once print flattens every
         background to white, so it needs its own rule here. A light gray
         band reads clearly and costs barely any ink; specific enough to
         win over the "background: #fff" rule above despite both being
         !important (that's decided by selector specificity, not just
         source order — .row-alt beats the bare * selector). The row's
         own children (label, formula, value, the skill-total badge) also
         got forced to solid white by that same "*" rule, which punched
         opaque holes in the band wherever a nested element sat — so
         those need clearing back to transparent too. */
      .row-alt { background: #ececec !important; }
      .row-alt * { background: transparent !important; }

      /* Attribution — repeats at the bottom of every printed page
         instead of trailing wherever the last card happens to end. */
      .attribution-footer {
        position: fixed !important;
        left: 0; right: 0; bottom: 0;
        padding: 4px 16px !important;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/*
 ╔═══════════════════════════════════════════════════════════════════╗
 ║  FLAGONQUEST — Technique Browser & Character Builder             ║
 ║  index.html · Phase 1                                            ║
 ╠═══════════════════════════════════════════════════════════════════╣
 ║  HOW THIS FILE WORKS                                             ║
 ║                                                                   ║
 ║  DATA: On page load, the app fetches two JSON files from the     ║
 ║  data/ folder sitting next to this index.html. Those files are   ║
 ║  generated from your spreadsheet by running scripts/convert.py.  ║
 ║                                                                   ║
 ║  LOCAL TESTING: Browsers block fetch() on file:// URLs. To test  ║
 ║  locally, open a terminal in your repo folder and run:           ║
 ║    python -m http.server 8000                                    ║
 ║  Then visit localhost:8000 in your browser.                      ║
 ║                                                                   ║
 ║  BUILD ENTRIES: `build` is an array of { uid, id } — id is the   ║
 ║  technique ID, uid is a unique ID for that specific *copy* (so   ║
 ║  Duplicate/Encounter techniques can be learned more than once).  ║
 ║  Per-copy data — free-text notes, Feature-builder choices, an    ║
 ║  optional rename, and Character-Sheet "expended" checkbox state  ║
 ║  — are keyed by uid, not by technique id, in the `notes` /       ║
 ║  `configs` / `renames` / `expended` state and persisted to       ║
 ║  localStorage (`expended` is session-tracking only, so it's left ║
 ║  out of Export/Import — see doExport()).                         ║
 ║                                                                   ║
 ║  FILTERING: `visible` is techniques.filter(...), recomputed by   ║
 ║  useMemo() only when a filter changes.                           ║
 ║                                                                   ║
 ║  BUILD ROWS: `buildRows` groups build entries for display — a    ║
 ║  plain repeatable technique collapses into one "×N" row, but a   ║
 ║  technique with its own notes or Feature-builder choices per     ║
 ║  copy (free_text / features) always gets one row per copy, since ║
 ║  those copies aren't interchangeable.                            ║
 ║                                                                   ║
 ║  EXPORT/IMPORT: full fidelity, including notes and Feature        ║
 ║  choices. SHARE LINK: technique list + character name only, to   ║
 ║  keep the URL short — notes/Feature choices don't round-trip.    ║
 ║                                                                   ║
 ║  RETAIN ACROSS REFRESH: the whole block of state above (build     ║
 ║  through noteRows) is persisted to localStorage like everything   ║
 ║  else. The address bar also mirrors the active character's build  ║
 ║  live in the same #build= format "Copy share link" uses (see the  ║
 ║  sync effect near the top of App()) — so the page is always       ║
 ║  sitting on a current, copy-pasteable link, and a plain refresh   ║
 ║  can tell that hash apart from an actual shared link someone      ║
 ║  opened and skip re-decoding its own echo.                        ║
 ║                                                                   ║
 ║  CHARACTER SLOTS: localStorage can hold more than one character   ║
 ║  (see the CHARACTER SLOTS helpers just above App()) — each one's  ║
 ║  full data lives under its own `flagonquest-char-<id>` key, with  ║
 ║  a small [{id, name}] registry and an active-id pointer alongside ║
 ║  it. Opening a share link or importing a file always adds a new   ║
 ║  slot and switches to it (addCharacterSlot) rather than touching  ║
 ║  whichever character was already open, so neither can overwrite   ║
 ║  work in progress. A one-time migration folds any pre-slots       ║
 ║  install's flat `flagonquest-*` keys into a first character.      ║
 ║                                                                   ║
 ║  LAYOUT: on wide screens the Browse tab shows the technique list  ║
 ║  and the build panel side by side (see .browse-layout in the     ║
 ║  <style> block). On narrow screens the build panel is reached     ║
 ║  through its own "My build" tab instead. Both places render the  ║
 ║  same <BuildPanel> component so they never drift apart.          ║
 ╚═══════════════════════════════════════════════════════════════════╝
*/

// ── Text color scale ────────────────────────────────────────────────
// Warm off-white/tan tones instead of blue-grey, so body text stands
// out against the dark blue background instead of blending into it.
// Ordered brightest → dimmest; nothing outranks `name`.
const TEXT = {
  name:  "#e8dfc8",  // technique names — brightest text on the page
  body:  "#d3c9a3",  // readable content: field values, effects text
  label: "#a68f52",  // field labels ("Action:", "Cost:", etc.)
  muted: "#9c9576",  // secondary text: tags, skills, inactive nav
  faint: "#726c58",  // least prominent: prereqs, counts, hints
};

// ── Helpers ────────────────────────────────────────────────────────

// Format level range for display.
// e.g. level_min=1, level_max=4 → "Lv 1–4"  |  level_min=null → "Draft"
function lvlLabel(lMin, lMax) {
  if (lMin == null) return "Draft";
  const hi = lMax ?? lMin;
  return lMin === hi ? `Lv ${lMin}` : `Lv ${lMin}–${hi}`;
}

// Does this technique fall within the current level filter range?
// Drafts (no level yet) always pass — there's no toggle to hide them.
// Two ranges overlap when: techMin <= filterMax AND techMax >= filterMin.
function matchesLevel(t, fMin, fMax) {
  if (t.level_min == null) return true;
  const hi = t.level_max ?? t.level_min;
  return t.level_min <= fMax && hi >= fMin;
}

// XP cost of a technique at a fixed level: level × 3.
// Returns null for drafts or range techniques (e.g. Lv 1–4) where we
// don't know which level was purchased — callers that DO know (a
// Feature-built technique's chosen level) compute level × 3 directly
// instead of calling this.
function techXP(t) {
  if (t.level_min == null) return null;
  if (t.level_min !== t.level_max && t.level_max != null) return null;
  return t.level_min * 3;
}

// Encode/decode build state for shareable URL hash.
// Only the technique ID list + character name — see the file-header
// note on why notes/Feature choices are left out of share links.
function encBuild(payload) {
  return btoa(JSON.stringify(payload));
}
function decBuild(str) {
  try { return JSON.parse(atob(str)); } catch { return null; }
}

// Split a comma-separated string into a trimmed array
function splitCSV(str) {
  if (!str) return [];
  return str.split(",").map(s => s.trim()).filter(Boolean);
}

// A unique ID for one *copy* of a technique in the build, so repeated
// purchases (Duplicate/Encounter) can each carry their own notes or
// Feature-builder choices instead of sharing one blob of data.
function makeUid() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

// Is this a Duplicate/Encounter technique — one that can be learned
// (and added to the build) more than once?
function isRepeatable(tech) {
  const tags = splitCSV(tech.tags);
  return tags.includes("Duplicate") || tags.includes("Encounter");
}

// Does this technique need the level-picker/build flow instead of a plain
// Add/Remove button? True for Feature-built techniques (obviously), but
// also for anything with a variable level range even without Features —
// e.g. Temper Soulblade, which just needs a fixed level chosen for XP
// cost/display purposes, with the rest handled by its free-text notes.
function needsLevelPicker(tech) {
  return !!tech.features || (tech.level_min != null && tech.level_max != null && tech.level_min !== tech.level_max);
}

// A technique's point budget per level, as { [level]: { points, advanced } }.
// Prefers the structured "Feature Budget" data column (convert.py parses
// it into tech.feature_budget) — falls back to regexing the "Points:
// Level 1: 3 basic; Level 2: 6 basic; ..." sentence out of the Effects
// text for any technique whose spreadsheet row hasn't been given that
// column yet. Returns null if neither is present, so callers fall back
// to an unlimited/unstructured picker instead of guessing.
function parsePointBudget(tech) {
  if (tech.feature_budget) return tech.feature_budget;
  const effectsText = tech.effects;
  if (!effectsText) return null;
  const re = /Level\s*(\d+):\s*(\d+)\s*basic(\/advanced)?/gi;
  const map = {};
  let m;
  while ((m = re.exec(effectsText))) {
    map[+m[1]] = { points: +m[2], advanced: !!m[3] };
  }
  return Object.keys(map).length > 0 ? map : null;
}

// Word/digit → number, for resolving phrases like "twice" or "four times".
const MULTIPLIER_WORDS = {
  once: 1, twice: 2, thrice: 3,
  one: 1, two: 2, three: 3, four: 4, five: 5,
  six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
};
function wordOrDigitToNumber(tok) {
  const t = tok.toLowerCase();
  if (/^\d+$/.test(t)) return parseInt(t, 10);
  return MULTIPLIER_WORDS[t] ?? null;
}

// Substitutes every "X" in a Feature's description with how many copies of
// that Feature were chosen (per F065 Abjuring: "X is the number of copies
// of this feature"), collapsing simple arithmetic like "X + 1" or "twice X"
// into one number. Terms that mix X with a card-suit placeholder (e.g.
// "X + [Hearts]") are left partly symbolic — we substitute X but can't
// resolve the suit, so both remain in the text.
function applyFeatureCount(text, count) {
  if (!text || count == null || !/\bX\b/.test(text)) return text;
  let out = text;

  // "N times X" / "<word> times X" → a single computed number
  out = out.replace(
    /\b(\d+|once|twice|thrice|one|two|three|four|five|six|seven|eight|nine|ten)\s+times?\s+X\b/gi,
    (m, tok) => {
      const n = wordOrDigitToNumber(tok);
      return n != null ? String(n * count) : m;
    }
  );

  // "twice X" / "thrice X" with no "times" in between
  out = out.replace(/\b(twice|thrice)\s+X\b/gi, (m, tok) => String(wordOrDigitToNumber(tok) * count));

  // Any remaining bare X
  out = out.replace(/\bX\b/g, String(count));

  // Collapse pure-number addition chains ("4 + 1" → "5"); leaves
  // "4 + [Hearts]" alone since [Hearts] isn't a plain number.
  out = out.replace(/\b\d+(?:\s*\+\s*\d+)+\b/g, m =>
    String(m.split("+").reduce((sum, part) => sum + parseInt(part.trim(), 10), 0))
  );

  return out;
}

// Wraps every whole-word, case-sensitive match of a glossary term in
// `text` with a hoverable <GlossaryTerm> — e.g. "Slowed" inside a
// technique's Effects text becomes moused-over-able. Terms are matched
// longest-first so multi-word entries ("Good Luck") win over any
// single-word one that happens to be a substring. Returns `text`
// untouched when there's nothing to link, so callers can render the
// result directly either way.
function withGlossary(text, glossary) {
  if (!text || !glossary || glossary.length === 0) return text;
  const terms = [...glossary].sort((a, b) => b.term.length - a.term.length);
  const escaped = terms.map(g => g.term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const re = new RegExp(`\\b(${escaped.join("|")})\\b`, "g");
  const byTerm = Object.fromEntries(glossary.map(g => [g.term, g.description]));
  const parts = text.split(re);
  if (parts.length === 1) return text;
  return parts.map((part, i) =>
    byTerm[part] ? <GlossaryTerm key={i} term={part} description={byTerm[part]} /> : part
  );
}

// ── Stats & Skills ────────────────────────────────────────────────
// 5 stats, 5 skills each. A skill's "Skill Total" — used all over the
// character sheet's derived numbers — is the stat's points plus the
// skill's own points.
const STAT_SKILLS = {
  Agility: ["Acrobatics", "Archery", "Brawl", "Melee", "Stealth"],
  Body:    ["Athletics", "Awareness", "Might", "Presence", "Resilience"],
  Cunning: ["Insight", "Masquerade", "Persuasion", "Streetwise", "Survival"],
  Mind:    ["Academics", "Composure", "Craft", "Medicine", "Mixology"],
  Essence: ["Meditation", "Performance", "Rapport", "Sorcery", "Theurgy"],
};
const STATS = Object.keys(STAT_SKILLS);
const SKILL_STAT = {};
STATS.forEach(stat => STAT_SKILLS[stat].forEach(skill => { SKILL_STAT[skill] = stat; }));
const ALL_STAT_SKILLS = Object.keys(SKILL_STAT);

// Points are bought one at a time starting from 0: a skill point at
// level N costs N XP, a stat point costs double that (2N). The total
// cost to reach level N is the triangular-number sum of 1..N (doubled
// for stats) — e.g. a skill bought up to 3 costs 1+2+3 = 6 total.
function skillTotalCost(n) { return (n * (n + 1)) / 2; }
function statTotalCost(n)  { return n * (n + 1); }

function skillTotalValue(statPoints, skillPoints, skill) {
  return (statPoints[SKILL_STAT[skill]] || 0) + (skillPoints[skill] || 0);
}

// Resolves one "[... Skill Total]" bracket's inner text (with the trailing
// "Skill Total" already stripped by the caller) to a number, for the
// modifiers actually used in the data: "half your X", "twice X", and
// "X or Y" (uses whichever of the two is higher). Returns null for
// anything it can't confidently resolve (unrecognized skill name), so the
// caller can just leave the original bracket text untouched.
function resolveSkillTotalToken(inner, statPoints, skillPoints) {
  let text = inner.trim();
  const mods = [];
  const modRe = /^(half|your|twice)\s+/i;
  let m;
  while ((m = modRe.exec(text))) {
    mods.push(m[1].toLowerCase());
    text = text.slice(m[0].length);
  }
  const skillNames = text.split(/\s+or\s+/i).map(s => s.trim()).filter(Boolean);
  const validSkills = skillNames.filter(s => ALL_STAT_SKILLS.includes(s));
  if (validSkills.length === 0) return null;
  let value = Math.max(...validSkills.map(s => skillTotalValue(statPoints, skillPoints, s)));
  if (mods.includes("half"))  value = Math.floor(value / 2);
  if (mods.includes("twice")) value = value * 2;
  return value;
}

// Like withGlossary, but also — when `skillTotals` is given ({ statPoints,
// skillPoints }) — finds every "[... Skill Total]" bracket in `text` and
// prepends the character's actual computed value in the same bold/glow
// style as the Stats & Skills panel, so e.g. "[Might Skill Total]" reads
// as "5 [Might Skill Total]" without the player cross-referencing their
// sheet. Used only on the read-only Character Sheet — everywhere else
// `skillTotals` is left null and this behaves exactly like withGlossary.
function withSkillTotals(text, glossary, skillTotals) {
  if (!text || !skillTotals) return withGlossary(text, glossary);
  const re = /\[([^\[\]]*Skill Total)\]/gi;
  const parts = text.split(re);
  if (parts.length === 1) return withGlossary(text, glossary);
  return parts.map((part, i) => {
    if (i % 2 === 0) return withGlossary(part, glossary);
    const value = resolveSkillTotalToken(part.replace(/\s*Skill Total\s*$/i, ""), skillTotals.statPoints, skillTotals.skillPoints);
    if (value == null) return `[${part}]`;
    return (
      <React.Fragment key={i}>
        <span style={{ fontWeight:700, color:"#e8c46a", textShadow:"0 0 6px rgba(212,168,67,0.45)" }}>{value}</span>
        {" "}[{part}]
      </React.Fragment>
    );
  });
}


// ══════════════════════════════════════════════════════════════════
// CHARACTER SLOTS — localStorage holds any number of characters, each
// under its own `flagonquest-char-<id>` key, plus a small registry
// (`flagonquest-characters`, an [{id, name}] list) so the switcher can
// list them without loading every one, and `flagonquest-active-character`
// for which one is currently open. This is all still per-device/browser
// storage, same as before — slots just mean it can hold more than one
// character instead of exactly one.
// ══════════════════════════════════════════════════════════════════

// A brand-new character's blank data — also the fallback shape used to
// backfill any fields missing from an older/partial saved blob.
function emptyCharacterData() {
  return {
    build: [], notes: {}, configs: {}, renames: {}, expended: {},
    statPoints:  Object.fromEntries(STATS.map(s => [s, 0])),
    skillPoints: Object.fromEntries(ALL_STAT_SKILLS.map(s => [s, 0])),
    xpBudget: "75", charName: "", charConcept: "", charNotes: "", noteRows: [],
  };
}

function loadCharacterData(id) {
  try {
    const raw = JSON.parse(localStorage.getItem(`flagonquest-char-${id}`) || "null");
    return { ...emptyCharacterData(), ...raw };
  } catch { return emptyCharacterData(); }
}

function saveCharacterData(id, data) {
  localStorage.setItem(`flagonquest-char-${id}`, JSON.stringify(data));
}

// One-time upgrade path: before slots existed, a character's fields
// lived directly under flat `flagonquest-*` keys. If those are present
// and no slot registry exists yet, fold them into a single character
// so nobody's existing work disappears when this ships. The old flat
// keys are left in place afterward (unused, but harmless) rather than
// deleted, so a migration bug can't destroy data — only fail to migrate it.
function migrateLegacyCharacter() {
  if (localStorage.getItem("flagonquest-build") === null && localStorage.getItem("flagonquest-char-name") === null) {
    return null;
  }
  const readJSON = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
    catch { return fallback; }
  };
  const data = {
    ...emptyCharacterData(),
    build:       readJSON("flagonquest-build", []),
    notes:       readJSON("flagonquest-notes", {}),
    configs:     readJSON("flagonquest-configs", {}),
    renames:     readJSON("flagonquest-renames", {}),
    expended:    readJSON("flagonquest-expended", {}),
    statPoints:  { ...emptyCharacterData().statPoints,  ...readJSON("flagonquest-stat-points", {}) },
    skillPoints: { ...emptyCharacterData().skillPoints, ...readJSON("flagonquest-skill-points", {}) },
    xpBudget:    localStorage.getItem("flagonquest-xp-budget") ?? "75",
    charName:    localStorage.getItem("flagonquest-char-name") || "",
    charConcept: localStorage.getItem("flagonquest-char-concept") || "",
    charNotes:   localStorage.getItem("flagonquest-char-notes") || "",
    noteRows:    readJSON("flagonquest-note-rows", []),
  };
  const id = makeUid();
  saveCharacterData(id, data);
  return { id, name: data.charName || "Unnamed hero" };
}

// Resolves which character is active and its data, on first load only
// (see the useRef guard where this is called) — handles the legacy
// migration above, and creating a first character on a totally fresh
// install, so the app always has at least one valid active character.
function loadActiveCharacterState() {
  let characters = [];
  try { characters = JSON.parse(localStorage.getItem("flagonquest-characters")) || []; } catch {}
  let activeId = localStorage.getItem("flagonquest-active-character");

  if (characters.length === 0) {
    const migrated = migrateLegacyCharacter();
    if (migrated) {
      characters = [migrated];
      activeId = migrated.id;
    } else {
      const id = makeUid();
      saveCharacterData(id, emptyCharacterData());
      characters = [{ id, name: "" }];
      activeId = id;
    }
    localStorage.setItem("flagonquest-characters", JSON.stringify(characters));
    localStorage.setItem("flagonquest-active-character", activeId);
  }
  if (!activeId || !characters.some(c => c.id === activeId)) {
    activeId = characters[0].id;
    localStorage.setItem("flagonquest-active-character", activeId);
  }
  return { activeId, characters, data: loadCharacterData(activeId) };
}


// ══════════════════════════════════════════════════════════════════
// FEATURE BUILDER — pick a level and a set of Features within that
// level's point budget, for Buildable techniques (Battle Maneuver,
// Healing Magic, etc.) that are assembled from the Features sheet
// instead of having fixed effects.
// ══════════════════════════════════════════════════════════════════
function FeatureBuilder({ tech, features, budgetMap, initial, saveLabel, onSave, onCancel }) {
  const availableLevels = [];
  for (let lv = tech.level_min; lv <= (tech.level_max ?? tech.level_min); lv++) {
    if (!budgetMap || budgetMap[lv]) availableLevels.push(lv);
  }

  const [level, setLevel]   = useState(initial?.level ?? availableLevels[0] ?? tech.level_min);
  // Changing `level` never touches `counts` — picking a higher level (an
  // "upgrade") keeps every previously chosen Feature and its count intact,
  // it just opens up more budget to add to them.
  const [counts, setCounts] = useState(() => ({ ...(initial?.picks ?? {}) }));

  const budget           = budgetMap ? budgetMap[level] : null;
  const points            = budget ? budget.points : null;
  const advancedUnlocked = budget ? budget.advanced : true;

  const basicFeatures    = features.filter(f => f.tier === "Basic");
  const advancedFeatures = features.filter(f => f.tier === "Advanced");

  const spent      = Object.entries(counts).reduce((sum, [id, n]) =>
    sum + n * (features.find(f => f.id === id)?.point_cost ?? 0), 0);
  const remaining  = points != null ? points - spent : null;
  const overBudget = remaining != null && remaining < 0;

  const incFeature = f => {
    if (remaining != null && f.point_cost > remaining) return;
    setCounts(c => ({ ...c, [f.id]: (c[f.id] || 0) + 1 }));
  };
  const decFeature = f => setCounts(c => {
    const next = (c[f.id] || 0) - 1;
    const copy = { ...c };
    if (next <= 0) delete copy[f.id]; else copy[f.id] = next;
    return copy;
  });

  const stepBtnStyle = {
    width: 20, height: 20, lineHeight: "18px", padding: 0,
    fontSize: 13, color: TEXT.muted, background: "transparent",
    border: "0.5px solid #2d3555", borderRadius: 4,
  };

  const featureRow = f => {
    const count    = counts[f.id] || 0;
    const disabled = remaining != null && f.point_cost > remaining;
    return (
      <div key={f.id} style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0, marginTop: 2 }}>
          <button onClick={() => decFeature(f)} disabled={count === 0} style={stepBtnStyle}>−</button>
          <span style={{ width: 16, textAlign: "center", fontSize: 13, color: TEXT.body }}>{count}</span>
          <button onClick={() => incFeature(f)} disabled={disabled} style={stepBtnStyle}>+</button>
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 13, color: TEXT.body }}>
            <strong>{f.feature_name}</strong>
            <span style={{ color: TEXT.faint }}> ({f.point_cost} pt{f.point_cost !== 1 ? "s" : ""} each)</span>
          </div>
          <div style={{ fontSize: 13, color: TEXT.muted, lineHeight: 1.4 }}>
            {count > 0 ? applyFeatureCount(f.description, count) : f.description}
          </div>
          {f.prereq && (
            <div style={{ fontSize: 12, color: TEXT.faint }}>Requires: {f.prereq}</div>
          )}
        </div>
      </div>
    );
  };

  return (
    <div style={{
      background: "#0d1117", border: "0.5px solid #2d3555", borderRadius: 6,
      padding: "10px 12px", display: "flex", flexDirection: "column", gap: 10,
    }}>
      {/* Level picker + point budget */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, color: TEXT.label, fontWeight: 500 }}>Level</span>
        {availableLevels.map(lv => (
          <button
            key={lv}
            onClick={() => setLevel(lv)}
            style={{
              padding: "2px 10px", fontSize: 13, borderRadius: 4,
              background: lv === level ? "#d4a84322" : "transparent",
              color:      lv === level ? "#d4a843" : TEXT.muted,
              border: `0.5px solid ${lv === level ? "#d4a843" : "#2d3555"}`,
            }}
          >
            {lv}
          </button>
        ))}
        {points != null && (
          <span style={{ fontSize: 13, color: overBudget ? "#c0392b" : TEXT.muted, marginLeft: "auto" }}>
            {spent} / {points} pts{overBudget ? ` — over by ${-remaining}` : ""}
          </span>
        )}
      </div>

      {/* Basic-tier features */}
      {basicFeatures.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <div style={{ fontSize: 12, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em" }}>
            Basic
          </div>
          {basicFeatures.map(featureRow)}
        </div>
      )}

      {/* Advanced-tier features — only once the chosen level unlocks them */}
      {advancedFeatures.length > 0 && (
        advancedUnlocked ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ fontSize: 12, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em" }}>
              Advanced
            </div>
            {advancedFeatures.map(featureRow)}
          </div>
        ) : (
          <div style={{ fontSize: 12, color: TEXT.faint, fontStyle: "italic" }}>
            Advanced features unlock at a higher level.
          </div>
        )
      )}

      <div style={{ display: "flex", gap: 8 }}>
        <button
          onClick={() => onSave({ level, picks: counts })}
          disabled={overBudget}
          style={{
            fontSize: 13, color: overBudget ? TEXT.faint : "#d4a843",
            background: "transparent",
            border: `0.5px solid ${overBudget ? "#2d3555" : "#a07c2e"}`,
            borderRadius: 4, padding: "4px 12px",
          }}
        >
          {saveLabel}
        </button>
        <button onClick={onCancel} style={{
          fontSize: 13, color: TEXT.muted, background: "transparent",
          border: "0.5px solid #2d3555", borderRadius: 4, padding: "4px 12px",
        }}>
          Cancel
        </button>
      </div>
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// FEATURES SECTION — shown on a TechCard instead of the usual Add
// button when the technique is Buildable-from-Features. Lists any
// copies already built (level + chosen features), with Edit/Remove
// and — for repeatable techniques — Duplicate (same features again)
// alongside "+ Build another copy" (pick different features).
// ══════════════════════════════════════════════════════════════════
function FeaturesSection({
  tech, features, instances, configs, repeatable,
  onSaveConfig, onDuplicateInstance, onRemoveInstance,
  renames, onRenameChange, glossary,
}) {
  const [builderFor, setBuilderFor]   = useState(null); // null | "new" | a uid
  const [builderSeed, setBuilderSeed] = useState(null); // the {level, picks} to open the builder with
  const budgetMap = useMemo(() => parsePointBudget(tech), [tech]);
  const maxLevel = tech.level_max ?? tech.level_min;

  const smallBtn = {
    fontSize: 12, color: TEXT.muted, background: "transparent",
    border: "0.5px solid #2d3555", borderRadius: 4, padding: "2px 8px",
  };
  const smallDangerBtn = {
    fontSize: 12, color: "#c0392b", background: "transparent",
    border: "0.5px solid #c0392b", borderRadius: 4, padding: "2px 8px",
  };

  const openNew     = () => { setBuilderFor("new"); setBuilderSeed(null); };
  const openEdit    = uid => { setBuilderFor(uid); setBuilderSeed(configs[uid] ?? null); };
  // "Upgrade" jumps straight to the next level up, keeping every Feature
  // (and its count) already chosen — the increased budget just leaves
  // room to add more, per the "buildable techniques can be upgraded but
  // must keep all previous options" rule.
  const openUpgrade = uid => {
    const cfg = configs[uid];
    const nextLevel = Math.min((cfg?.level ?? tech.level_min) + 1, maxLevel);
    setBuilderFor(uid);
    setBuilderSeed({ level: nextLevel, picks: cfg?.picks ?? {} });
  };
  const closeBuilder = () => { setBuilderFor(null); setBuilderSeed(null); };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ fontSize: 12, color: TEXT.label, fontWeight: 500 }}>
        {features.length > 0 ? "Built from Features" : "Level"}
      </div>

      {/* Copies already learned */}
      {instances.map((uid, i) => {
        const cfg = configs[uid];
        if (builderFor === uid) {
          return (
            <FeatureBuilder
              key={`${uid}-${builderSeed?.level}`}
              tech={tech}
              features={features}
              budgetMap={budgetMap}
              initial={builderSeed}
              saveLabel="Save changes"
              onCancel={closeBuilder}
              onSave={next => { onSaveConfig(tech.id, uid, next); closeBuilder(); }}
            />
          );
        }
        const picks = cfg ? Object.entries(cfg.picks) : [];
        return (
          <div key={uid} style={{
            background: "#0d1117", border: "0.5px solid #2d3555", borderRadius: 6,
            padding: "8px 10px", display: "flex", flexDirection: "column", gap: 4,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, color: TEXT.body }}>
                {instances.length > 1 ? `Copy ${i + 1} — ` : ""}
                {cfg ? `Level ${cfg.level}` : "Not configured"}
              </span>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {repeatable && cfg && (
                  <button onClick={() => onDuplicateInstance(uid)} style={smallBtn}>Duplicate</button>
                )}
                {cfg && cfg.level < maxLevel && (
                  <button onClick={() => openUpgrade(uid)} style={smallBtn}>Upgrade</button>
                )}
                <button onClick={() => openEdit(uid)} style={smallBtn}>Edit</button>
                <button onClick={() => onRemoveInstance(uid)} style={smallDangerBtn}>Remove</button>
              </div>
            </div>
            {features.length > 0 && (
              <input
                type="text"
                value={renames[uid] || ""}
                onChange={e => onRenameChange(uid, e.target.value)}
                placeholder="Rename this build (optional)…"
                style={{ fontSize: 12, padding: "3px 6px" }}
              />
            )}
            {picks.length > 0 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                {picks.map(([fid, n]) => {
                  const f = features.find(x => x.id === fid);
                  if (!f) return null;
                  return (
                    <div key={fid} style={{ fontSize: 12, color: TEXT.muted, lineHeight: 1.4 }}>
                      <strong style={{ color: TEXT.body }}>{f.feature_name}{n > 1 ? ` ×${n}` : ""}</strong>
                      {" — "}{withGlossary(applyFeatureCount(f.description, n), glossary)}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}

      {/* Build the first copy, or another one with different features */}
      {builderFor === "new" ? (
        <FeatureBuilder
          key="new"
          tech={tech}
          features={features}
          budgetMap={budgetMap}
          initial={builderSeed}
          saveLabel="Add to build"
          onCancel={closeBuilder}
          onSave={next => { onSaveConfig(tech.id, null, next); closeBuilder(); }}
        />
      ) : (instances.length === 0 || repeatable) && (
        <button
          onClick={openNew}
          style={{
            fontSize: 13, color: "#d4a843", background: "transparent",
            border: "0.5px solid #a07c2e", borderRadius: 4,
            padding: "4px 10px", alignSelf: "flex-start",
          }}
        >
          + Build {instances.length > 0 ? "another copy" : "this technique"}
        </button>
      )}
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// TECHNIQUE CARD — shown in the browse list
// Full detail: tags, description, all mechanical fields, complete
// effects/special text, prereqs, and related skills at the bottom.
// ══════════════════════════════════════════════════════════════════
function TechCard({
  tech, instances, techFeatures,
  notes, onNoteChange,
  configs, onSaveConfig, onDuplicateInstance,
  onAdd, onRemove, onRemoveInstance,
  renames, onRenameChange, expended, onExpendedChange,
  glossary,
  readOnly = false,
  // Set only by the read-only Character Sheet, which gives every distinct
  // build of a Feature-built technique its own card instead of nesting
  // them all under one — see the sheetCards note in App(). When present,
  // this card represents exactly this one build: { name, cfg, uids }.
  group = null,
  // { statPoints, skillPoints } — set only by the read-only Character
  // Sheet, so it can resolve "[X Skill Total]" brackets in gameplay text
  // to the character's actual numbers. See withSkillTotals.
  skillTotals = null,
}) {
  const tags   = splitCSV(tech.tags);
  const skills = splitCSV(tech.related_skills);

  // "Encounter" is important enough to live in the corner with the level
  // badge — everything else stays in the tags line.
  const hasEncounter = tags.includes("Encounter");
  const otherTags     = tags.filter(t => t !== "Encounter");

  // Duplicate/Encounter techniques can be learned more than once —
  // each purchase is its own build entry, so "Add to build" stays
  // available instead of flipping straight to "Remove".
  const repeatable = isRepeatable(tech);
  const count        = group ? group.uids.length : instances.length;
  const expendedUids = group ? group.uids : instances;
  const displayName  = group ? (group.name || tech.name) : tech.name;
  const displayLevel = group && group.cfg ? `Lv ${group.cfg.level}` : lvlLabel(tech.level_min, tech.level_max);

  return (
    <div className="tech-card" style={{
      background: "#161b27",
      border: "0.5px solid #2d3555",
      borderRadius: 8,
      padding: "12px 14px",
      display: "flex",
      flexDirection: "column",
      gap: 7,
    }}>

      {/* Name (+ purchase count on the read-only sheet) and corner badges
          — Encounter (if present) sits left of Level, Level always stays
          pinned in the far corner. Expended checkboxes (if any) share the
          tags line below instead of stacking under the badges here, so
          there's no gap between the header and the card body. */}
      <div style={{ display:"flex", alignItems:"flex-start", gap:8 }}>
        <span style={{
          fontFamily: "'MedievalSharp', Georgia, serif",
          fontWeight: "bold",
          fontSize: 17,
          color: TEXT.name,
          flex: 1,
          lineHeight: 1.3,
        }}>
          {displayName}
          {readOnly && count > 1 && (
            <span style={{ fontFamily:"system-ui, sans-serif", fontStyle:"italic", fontWeight:400, fontSize:13, color:TEXT.faint, marginLeft:8 }}>
              (known {count}×)
            </span>
          )}
        </span>
        <div style={{ display:"flex", flexDirection:"row", alignItems:"center", gap:4, flexShrink:0 }}>
          {hasEncounter && (
            <span style={{
              fontSize: 17, fontWeight: 500,
              color: "#e6943a",
              background: "#2a1a00",
              border: "0.5px solid #a0672e",
              borderRadius: 4,
              padding: "1px 8px",
              whiteSpace: "nowrap",
            }}>
              Encounter
            </span>
          )}
          <span style={{
            fontSize: 17, fontWeight: 500,
            color: TEXT.name,
            background: "#24221a",
            border: "0.5px solid #5b5540",
            borderRadius: 4,
            padding: "1px 8px",
            whiteSpace: "nowrap",
          }}>
            {displayLevel}
          </span>
        </div>
      </div>

      {/* Remaining tags (left) and Expended checkboxes (right), sharing
          one line — this row shows up whenever either side has content. */}
      {(otherTags.length > 0 || (readOnly && hasEncounter && expendedUids.length > 0)) && (
        <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ display:"flex", gap:6, flexWrap:"wrap", alignItems:"center" }}>
            {otherTags.map(tag => (
              <span key={tag} style={{
                fontSize: 12,
                color: tag === "Buildable" ? "#7F77DD"
                     : tag === "Duplicate" ? "#1D9E75"
                     : TEXT.muted,
                background: "#0d1117",
                border: "0.5px solid #2d3555",
                borderRadius: 3,
                padding: "1px 5px",
              }}>
                {tag}
              </span>
            ))}
          </div>
          {readOnly && hasEncounter && expendedUids.length > 0 && (
            <div style={{ display:"flex", gap:6, alignItems:"center" }}>
              {expendedUids.map((uid, i) => (
                <label key={uid} title={expendedUids.length > 1 ? `Copy ${i + 1} expended` : "Expended"} style={{
                  display:"flex", alignItems:"center", gap:3, fontSize:12, color:TEXT.faint, cursor:"pointer",
                }}>
                  <input type="checkbox" checked={!!expended[uid]} onChange={e => onExpendedChange(uid, e.target.checked)} />
                  {expendedUids.length > 1 ? i + 1 : "Expended"}
                </label>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Fluff description — italic and muted. Skipped on the read-only
          Character Sheet, which is meant to be a lean reference. */}
      {!readOnly && tech.description && (
        <div style={{ fontSize:14, color:TEXT.muted, fontStyle:"italic", lineHeight:1.5 }}>
          {withGlossary(tech.description, glossary)}
        </div>
      )}

      {/* Mechanical fields — condition, action, cost, target — each its own line */}
      {[
        ["Condition", tech.condition],
        ["Action",    tech.action],
        ["Cost",      tech.cost],
        ["Target",    tech.target],
      ].filter(([, v]) => v).map(([label, val]) => (
        <div key={label} style={{ fontSize:14, color:TEXT.body, lineHeight:1.4 }}>
          <span style={{ color:TEXT.label, fontWeight:500 }}>{label}: </span>
          {withSkillTotals(val, glossary, skillTotals)}
        </div>
      ))}

      {/* Effects — the main rules text, shown in full */}
      {tech.effects && (
        <div style={{
          fontSize: 14, color: TEXT.body, lineHeight: 1.6,
          whiteSpace: "pre-wrap",  // preserves any line breaks in the text
        }}>
          {withSkillTotals(tech.effects, glossary, skillTotals)}
        </div>
      )}

      {/* Building — how to build this Feature-based technique ("When you
          learn this, choose features that apply..."). Reference text for
          whoever's building it, right above the picker it explains;
          skipped on the read-only Character Sheet, which only needs to
          show what the technique actually does, not how it was built. */}
      {!readOnly && tech.building && (
        <div style={{ fontSize:13, color:TEXT.faint, lineHeight:1.4, fontStyle:"italic" }}>
          {withGlossary(tech.building, glossary)}
        </div>
      )}

      {/* Built from Features — replaces the plain Add/Remove flow below.
          On the read-only sheet this card either IS one specific Feature
          build (`group` set — its picks render directly, no editing
          chrome) or, for a non-Feature Buildable/Duplicate technique like
          Temper Soulblade, has nothing to show here at all (its level
          badge already went generic and its distinguishing info lives in
          the per-copy Notes below); everywhere else FeaturesSection
          handles listing/editing every copy of the technique in one
          card. */}
      {needsLevelPicker(tech) && (readOnly ? (
        group && group.cfg && Object.keys(group.cfg.picks).length > 0 && (
          <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
            {Object.entries(group.cfg.picks).map(([fid, n]) => {
              const f = techFeatures.find(x => x.id === fid);
              if (!f) return null;
              return (
                <div key={fid} style={{ fontSize:13, color:TEXT.body, lineHeight:1.5 }}>
                  <strong style={{ color:TEXT.name }}>{f.feature_name}{n > 1 ? ` ×${n}` : ""}</strong>
                  {" — "}{withSkillTotals(applyFeatureCount(f.description, n), glossary, skillTotals)}
                </div>
              );
            })}
          </div>
        )
      ) : (
        <FeaturesSection
          tech={tech}
          features={techFeatures}
          instances={instances}
          configs={configs}
          repeatable={repeatable}
          onSaveConfig={onSaveConfig}
          onDuplicateInstance={onDuplicateInstance}
          onRemoveInstance={onRemoveInstance}
          renames={renames}
          onRenameChange={onRenameChange}
          glossary={glossary}
        />
      ))}

      {/* Free-text notes — one box per copy in the build, since e.g. each
          Soulblade you learn can choose a different weapon type. Editable
          everywhere except the read-only Character Sheet, where it's just
          a static record of what was already written. */}
      {tech.free_text && (readOnly ? (
        instances.length > 0 && (
          <div>
            <div style={{ fontSize:12, color:TEXT.label, fontWeight:500, marginBottom:4 }}>
              Notes
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {instances.map((uid, i) => (
                <div key={uid} style={{
                  fontSize:13, color: notes[uid] ? TEXT.body : TEXT.faint, lineHeight:1.5,
                  fontStyle: notes[uid] ? "normal" : "italic",
                  background:"#0d1117", border:"0.5px solid #2d3555", borderRadius:6, padding:"6px 10px",
                }}>
                  {instances.length > 1 && (
                    <span style={{ color:TEXT.faint, fontStyle:"normal" }}>Copy {i + 1}: </span>
                  )}
                  {notes[uid] || "No notes"}
                </div>
              ))}
            </div>
          </div>
        )
      ) : (
        <div>
          <div style={{ fontSize:12, color:TEXT.label, fontWeight:500, marginBottom:4 }}>
            Notes
          </div>
          {instances.length === 0 ? (
            <div style={{ fontSize:13, color:TEXT.faint, fontStyle:"italic" }}>
              Add this to your build, then note your choices for each copy you learn.
            </div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {instances.map((uid, i) => (
                <div key={uid} style={{ display:"flex", gap:6, alignItems:"flex-start" }}>
                  <textarea
                    value={notes[uid] || ""}
                    onChange={e => onNoteChange(uid, e.target.value)}
                    placeholder={instances.length > 1 ? `Copy ${i + 1} notes…` : "Add your notes…"}
                    rows={2}
                    style={{ flex:1, fontSize:13 }}
                  />
                  {instances.length > 1 && (
                    <button
                      onClick={() => onRemoveInstance(uid)}
                      aria-label={`Remove copy ${i + 1}`}
                      style={{ background:"transparent", border:"none", color:TEXT.faint, fontSize:16, lineHeight:1, padding:"2px 4px" }}
                    >
                      ✕
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      ))}

      {/* Special rules text */}
      {tech.special && (
        <div style={{ fontSize:14, color:TEXT.body, lineHeight:1.5 }}>
          <span style={{ color:TEXT.label, fontWeight:500 }}>Special: </span>
          {withSkillTotals(tech.special, glossary, skillTotals)}
        </div>
      )}

      {/* Prerequisites and related skills — skipped on the read-only
          Character Sheet to keep it lean; still shown everywhere you're
          actually picking/reviewing techniques. */}
      {!readOnly && tech.prereqs && (
        <div style={{ fontSize:13, color:TEXT.faint, lineHeight:1.4 }}>
          <span style={{ fontWeight:500 }}>Prereqs: </span>
          {tech.prereqs}
        </div>
      )}

      {!readOnly && skills.length > 0 && (
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", alignItems:"center" }}>
          {skills.map(skill => (
            <span key={skill} style={{
              fontSize: 12,
              color: TEXT.faint,
              border: "0.5px solid #232a3d",
              borderRadius: 3,
              padding: "1px 5px",
            }}>
              {skill}
            </span>
          ))}
        </div>
      )}

      {/* Add / Remove button(s) — skipped entirely on the read-only
          Character Sheet, and Features-built techniques manage this
          themselves above so it's skipped for those too */}
      {!readOnly && !needsLevelPicker(tech) && (
        <div style={{ marginTop:2, display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
          {repeatable ? (
            <>
              <button
                onClick={() => onAdd(tech.id)}
                style={{
                  fontSize: 13, color: "#d4a843",
                  background: "transparent",
                  border: "0.5px solid #a07c2e",
                  borderRadius: 4, padding: "2px 10px",
                }}
              >
                + Add to build
              </button>
              {count > 0 && (
                <>
                  <span style={{ fontSize:13, color:TEXT.muted }}>Known ×{count}</span>
                  <button
                    onClick={() => onRemove(tech.id)}
                    style={{
                      fontSize: 13, color: "#c0392b",
                      background: "transparent",
                      border: "0.5px solid #c0392b",
                      borderRadius: 4, padding: "2px 10px",
                    }}
                  >
                    Remove one
                  </button>
                </>
              )}
            </>
          ) : count > 0 ? (
            <button
              onClick={() => onRemove(tech.id)}
              style={{
                fontSize: 13, color: "#c0392b",
                background: "transparent",
                border: "0.5px solid #c0392b",
                borderRadius: 4, padding: "2px 10px",
              }}
            >
              Remove
            </button>
          ) : (
            <button
              onClick={() => onAdd(tech.id)}
              style={{
                fontSize: 13, color: "#d4a843",
                background: "transparent",
                border: "0.5px solid #a07c2e",
                borderRadius: 4, padding: "2px 10px",
              }}
            >
              + Add to build
            </button>
          )}
        </div>
      )}
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// GLOSSARY TERM — a capitalized game term (e.g. "Slowed") found inside
// technique/Feature text, shown with a dotted underline; hover (or tap,
// for touch devices) reveals its short definition. Click also toggles it
// so it works without a mouse.
// ══════════════════════════════════════════════════════════════════
function GlossaryTerm({ term, description }) {
  const [open, setOpen] = useState(false);
  return (
    <span
      onMouseEnter={() => setOpen(true)}
      onMouseLeave={() => setOpen(false)}
      onClick={e => { e.stopPropagation(); setOpen(o => !o); }}
      style={{ position: "relative", borderBottom: "1px dotted #a68f52", cursor: "help" }}
    >
      {term}
      {open && (
        <span className="no-print" style={{
          position: "absolute", left: 0, top: "100%", marginTop: 4, zIndex: 50,
          display: "block", width: 220,
          background: "#12161f", border: "0.5px solid #d4a843", borderRadius: 6,
          padding: "6px 10px", fontSize: 12, lineHeight: 1.4,
          color: TEXT.body, fontStyle: "normal", fontWeight: 400,
          fontFamily: "system-ui, -apple-system, sans-serif",
          boxShadow: "0 4px 14px rgba(0,0,0,0.45)",
        }}>
          <strong style={{ color: "#d4a843" }}>{term}</strong>: {description}
        </span>
      )}
    </span>
  );
}


// ══════════════════════════════════════════════════════════════════
// POINT STEPPER — the small "− N +" control shared by every stat and
// skill row in the Stats & Skills panel.
// ══════════════════════════════════════════════════════════════════
function PointStepper({ value, onChange, max = 5 }) {
  const btnStyle = {
    width: 20, height: 20, lineHeight: "18px", padding: 0,
    fontSize: 13, color: TEXT.muted, background: "transparent",
    border: "0.5px solid #2d3555", borderRadius: 4,
  };
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
      <button onClick={() => onChange(Math.max(0, value - 1))} disabled={value <= 0} style={btnStyle}>−</button>
      <span style={{ width: 16, textAlign: "center", fontSize: 13, color: TEXT.body }}>{value}</span>
      <button onClick={() => onChange(Math.min(max, value + 1))} disabled={value >= max} style={btnStyle}>+</button>
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// STATS PANEL — the 5-stat/5-skill-each point-buy grid, plus the XP
// spent on it and an optional total-XP budget. Interactive; rendered
// both on the "My build" tab and the Character Sheet so adjusting a
// stat is never more than one click away from either place.
// ══════════════════════════════════════════════════════════════════
function StatsPanel({
  statPoints, skillPoints, onStatChange, onSkillChange,
  xpBudget, onBudgetChange, statSkillXP,
  techniqueXP = 0, techniqueXPUnknown = false,
  readOnly = false,
}) {
  const totalSpent = statSkillXP + techniqueXP;
  const budgetNum  = xpBudget !== "" ? parseInt(xpBudget, 10) : null;
  const remaining  = budgetNum != null && !isNaN(budgetNum) ? budgetNum - totalSpent : null;

  return (
    <div>
      {/* The Character Sheet shows this same "Total XP Spent" number
          again, alone, in its own small box in the print header (see
          the print-only box in the view === "sheet" JSX) — so this
          fuller breakdown is print-hidden to avoid saying it twice. */}
      <div className="sheet-box no-print" style={{
        display: "flex", alignItems: "center", gap: 22, flexWrap: "wrap",
        marginBottom: 14, padding: "10px 14px", background: "#12161f",
        border: "0.5px solid #2d3555", borderRadius: 8,
      }}>
        <div>
          <div style={{ fontSize: 11, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.07em" }}>
            Stats &amp; Skills XP
          </div>
          <div style={{ fontSize: 20, fontWeight: 500 }}>{statSkillXP}</div>
        </div>
        <div>
          <div style={{ fontSize: 11, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.07em" }}>
            Total XP Spent
          </div>
          <div style={{ fontSize: 20, fontWeight: 500 }}>
            {totalSpent}{techniqueXPUnknown ? "+" : ""}
          </div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 13, color: TEXT.faint }}>Experience Total</span>
            {readOnly ? (
              <span style={{ fontSize: 14, fontWeight: 500, color: TEXT.name }}>{xpBudget || "—"}</span>
            ) : (
              <input
                type="text" inputMode="numeric" placeholder="—"
                value={xpBudget}
                onChange={e => onBudgetChange(e.target.value.replace(/[^\d]/g, ""))}
                style={{ width: 70, fontSize: 14, textAlign: "right" }}
              />
            )}
          </div>
          {remaining != null && (
            <span style={{ fontSize: 14, fontWeight: 500, color: remaining < 0 ? "#c0392b" : "#d4a843" }}>
              {remaining < 0 ? `${-remaining} over budget` : `${remaining} remaining`}
            </span>
          )}
        </div>
      </div>

      <div className="stat-grid">
        {STATS.map(stat => (
          <div key={stat} className="sheet-box" style={{
            background: "#161b27", border: "0.5px solid #2d3555", borderRadius: 8, padding: "10px 12px",
          }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{
                fontFamily: "'MedievalSharp', Georgia, serif", fontSize: 15,
                fontWeight: "bold", color: TEXT.name,
              }}>
                {stat}
              </span>
              {readOnly ? (
                <span style={{ fontSize: 15, fontWeight: 500, color: TEXT.name }}>{statPoints[stat] || 0}</span>
              ) : (
                <PointStepper value={statPoints[stat] || 0} max={5} onChange={n => onStatChange(stat, n)} />
              )}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {/* Skill Total (right) is what actually gets used at the table —
                  Stat/Skill points underneath it are just how you got there —
                  so it gets a bigger, badge-styled, glowing number to draw the
                  eye, and rows alternate a faint tint so a long list of five
                  stays easy to scan across. */}
              {STAT_SKILLS[stat].map((skill, i) => (
                <div key={skill} className={i % 2 === 1 ? "row-alt" : undefined} style={{
                  display: "flex", alignItems: "center", gap: 6,
                  padding: "2px 4px", borderRadius: 4,
                  background: i % 2 === 1 ? "rgba(255,255,255,0.03)" : "transparent",
                }}>
                  <span style={{ fontSize: 13, color: TEXT.body, flex: 1 }}>{skill}</span>
                  {readOnly ? (
                    <span style={{ fontSize: 13, color: TEXT.body, width: 16, textAlign: "center" }}>
                      {skillPoints[skill] || 0}
                    </span>
                  ) : (
                    <PointStepper value={skillPoints[skill] || 0} max={5} onChange={n => onSkillChange(skill, n)} />
                  )}
                  <span style={{
                    fontSize: 15, fontWeight: 700, color: "#e8c46a",
                    minWidth: 24, textAlign: "center", flexShrink: 0,
                    background: "#20180a", border: "0.5px solid #6b5423", borderRadius: 5,
                    padding: "1px 4px", textShadow: "0 0 6px rgba(212,168,67,0.45)",
                  }}>
                    {skillTotalValue(statPoints, skillPoints, skill)}
                  </span>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// DERIVED STATS — the read-only combat numbers the sheet computes
// from Stats & Skills (Speed, Defenses, etc.), matching the formulas
// printed on the paper character sheet.
// ══════════════════════════════════════════════════════════════════
function DerivedStats({ statPoints, skillPoints }) {
  const st = skill => skillTotalValue(statPoints, skillPoints, skill);
  const essence = statPoints.Essence || 0;

  // Each row's name is bold with its calculation in italics underneath —
  // matching the paper character sheet — instead of both crammed onto
  // one line, so the number the player actually reads stays the clear
  // focal point on the right. Rows alternate a faint tint (row-alt),
  // same idea and class as the Stats & Skills rows above, so a five-row
  // box stays easy to scan across — see the "row-alt" print rule for how
  // this survives print's flattened-to-white color override.
  const block = (title, rows, footer) => (
    <div className="sheet-box" style={{
      background: "#161b27", border: "0.5px solid #2d3555", borderRadius: 8, padding: "10px 12px",
      display: "flex", flexDirection: "column", gap: 2, flex: "1 1 220px",
    }}>
      <div style={{ fontSize: 12, color: TEXT.label, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 5 }}>
        {title}
      </div>
      {rows.map(([label, value, formula], i) => (
        <div key={label} className={i % 2 === 1 ? "row-alt" : undefined} style={{
          display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
          padding: "2px 4px", borderRadius: 4,
          background: i % 2 === 1 ? "rgba(255,255,255,0.03)" : "transparent",
        }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: TEXT.name }}>{label}</div>
            {formula && <div style={{ fontSize: 11, color: TEXT.faint, fontStyle: "italic" }}>{formula}</div>}
          </div>
          <span style={{ fontSize: 16, fontWeight: 500, color: TEXT.name, flexShrink: 0 }}>{value}</span>
        </div>
      ))}
      {footer && (
        <div style={{ fontSize: 11, color: TEXT.faint, fontStyle: "italic", marginTop: 4 }}>
          {footer}
        </div>
      )}
    </div>
  );

  return (
    <div className="derived-stats-row" style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
      {block("Vitals", [
        ["Speed",          1 + (statPoints.Agility || 0), "= 1 + Agility"],
        ["Resting Health", statPoints.Body || 0, "= Body"],
        ["Reflex",         st("Insight"), "= Insight"],
        ["Cards Per Day",  2 * ((statPoints.Cunning || 0) + (statPoints.Mind || 0)), "= 2 × (Cunning + Mind)"],
      ])}
      {block("Defenses", [
        ["Parry Defense",    8 + Math.max(st("Melee"), st("Brawl")), "= 8 + Melee or Brawl"],
        ["Dodge Defense",    8 + Math.max(st("Acrobatics"), st("Brawl")), "= 8 + Acrobatics or Brawl"],
        ["Bodily Defense",   8 + st("Resilience"), "= 8 + Resilience"],
        ["Mental Defense",   8 + st("Composure"), "= 8 + Composure"],
        ["Instinct Defense", 8 + st("Insight"), "= 8 + Insight"],
      ])}
      {block("Health", [
        ["Shallow Health", 5, "(base)"],
        ["Deep Health",    5, "(base)"],
      ], "Feature/technique bonuses to these aren't tracked yet.")}
      {block("Resists", [
        ["Physical Resist",  essence, "= Essence"],
        ["Fire Resist",      essence, "= Essence"],
        ["Frost Resist",     essence, "= Essence"],
        ["Brilliant Resist", essence, "= Essence"],
        ["Shadow Resist",    essence, "= Essence"],
      ], "Essence adds to each Resist — equipment/effect bonuses aren't tracked yet.")}
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// BUILD PANEL — character name, stats, export/import/share, and the
// build list. Rendered both on the standalone "My build" tab and in
// the sticky sidebar next to the technique list on wide screens.
// ══════════════════════════════════════════════════════════════════
function XPTiles({ knownXP, unknownCount, totalXP }) {
  return (
    <>
      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap" }}>
        <div style={{
          background:"#161b27", border:"0.5px solid #2d3555",
          borderRadius:8, padding:"8px 14px", minWidth:110,
        }}>
          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:4 }}>Technique XP</div>
          <div style={{ fontSize:22, fontWeight:500 }}>
            {unknownCount > 0 ? `${knownXP}+` : `${knownXP}`}
            <span style={{ fontSize:13, color:TEXT.faint, marginLeft:4 }}>XP</span>
          </div>
        </div>
        <div style={{
          background:"#161b27", border:"0.5px solid #2d3555",
          borderRadius:8, padding:"8px 14px", minWidth:110,
        }}>
          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:4 }}>Total XP</div>
          <div style={{ fontSize:22, fontWeight:500 }}>
            {unknownCount > 0 ? `${totalXP}+` : `${totalXP}`}
            <span style={{ fontSize:13, color:TEXT.faint, marginLeft:4 }}>XP</span>
          </div>
        </div>
      </div>
      {unknownCount > 0 && (
        <div style={{ fontSize:13, color:TEXT.faint, fontStyle:"italic", marginTop:-8, marginBottom:16 }}>
          {unknownCount} technique{unknownCount > 1 ? "s" : ""} not fully configured yet — XP varies by level.
        </div>
      )}
    </>
  );
}


function BuildPanel({
  buildRows, knownXP, unknownCount, totalXP,
  notes, configs, techFeaturesById,
  addTech, removeTech, removeInstance, duplicateInstance,
}) {
  return (
    <>
      <XPTiles knownXP={knownXP} unknownCount={unknownCount} totalXP={totalXP} />

      {/* Build list — one row per distinct technique. Plain repeats
          (no per-copy data) collapse into a ×N row; techniques with
          notes or Feature-builder choices per copy get one row each,
          since those copies aren't interchangeable. */}
      {buildRows.length === 0 ? (
        <div style={{ textAlign:"center", padding:"32px 16px", color:TEXT.faint, fontSize:15 }}>
          No techniques added yet — head to Techniques to pick some.
        </div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
          {buildRows.map(({ tech: t, uids }) => {
            const count      = uids.length;
            const uid        = uids[0];
            const isDistinct = t.free_text || needsLevelPicker(t);
            const repeatable = isRepeatable(t);
            const cfg        = needsLevelPicker(t) ? configs[uid] : null;
            const xpEach     = cfg ? cfg.level * 3 : techXP(t);
            const totalXP    = xpEach != null ? xpEach * count : null;

            let subtitle = null;
            if (t.free_text) {
              if (notes[uid]) subtitle = notes[uid];
            } else if (needsLevelPicker(t)) {
              if (cfg) {
                const feats = techFeaturesById[t.id] || [];
                const names = Object.entries(cfg.picks)
                  .map(([id, n]) => {
                    const name = feats.find(f => f.id === id)?.feature_name;
                    return name ? (n > 1 ? `${name} ×${n}` : name) : null;
                  })
                  .filter(Boolean);
                subtitle = names.length > 0 ? names.join(", ") : null;
              } else {
                subtitle = "Not configured yet";
              }
            }

            return (
              <div key={isDistinct ? uid : t.id} style={{
                display:"flex", alignItems:"center", gap:8,
                background:"#161b27",
                border:"0.5px solid #2d3555",
                borderRadius:8,
                padding:"8px 10px",
              }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{
                    fontFamily:"'MedievalSharp', Georgia, serif", fontWeight:"bold",
                    fontSize:15, color:TEXT.name,
                    overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap",
                  }}>
                    {t.name}{!isDistinct && count > 1 ? ` ×${count}` : ""}
                  </div>
                  <span style={{ fontSize:13, color:"#d4a843" }}>
                    {cfg ? `Level ${cfg.level}` : lvlLabel(t.level_min, t.level_max)}
                  </span>
                  {subtitle && (
                    <div style={{
                      fontSize:12, color:TEXT.faint, marginTop:2,
                      overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap",
                    }}>
                      {subtitle}
                    </div>
                  )}
                </div>
                <span style={{ fontSize:13, color:TEXT.faint, flexShrink:0 }}>
                  {totalXP != null ? `${totalXP} XP` : "? XP"}
                </span>
                {repeatable && (
                  <button
                    onClick={() => needsLevelPicker(t) ? duplicateInstance(uid) : addTech(t.id)}
                    aria-label={needsLevelPicker(t) ? `Add another copy of ${t.name} with the same features` : `Add another ${t.name}`}
                    style={{
                      background:"transparent", border:"0.5px solid #2d3555", borderRadius:4,
                      color:TEXT.muted, fontSize:15, lineHeight:1, padding:"2px 7px", flexShrink:0,
                    }}
                  >
                    +
                  </button>
                )}
                <button
                  onClick={() => isDistinct ? removeInstance(uid) : removeTech(t.id)}
                  aria-label={`Remove ${t.name}`}
                  style={{
                    background:"transparent", border:"none",
                    color:TEXT.faint, fontSize:18, lineHeight:1, padding:"2px 4px", flexShrink:0,
                  }}
                >
                  ✕
                </button>
              </div>
            );
          })}
        </div>
      )}
    </>
  );
}


// ══════════════════════════════════════════════════════════════════
// MAIN APP COMPONENT
// Holds all state and renders the three views.
// ══════════════════════════════════════════════════════════════════
function App() {

  // ── Loaded data ────────────────────────────────────────────────
  const [techniques, setTechniques] = useState([]);
  const [features,   setFeatures]   = useState([]);   // features.json — Feature-builder options
  const [glossary,   setGlossary]   = useState([]);   // glossary.json — capitalized game terms
  const [loading,    setLoading]    = useState(true);
  const [loadError,  setLoadError]  = useState(null);

  // ── UI state ───────────────────────────────────────────────────
  const [view,       setView]       = useState("build"); // browse | build | sheet
  const [search,     setSearch]     = useState("");
  const [skillFilter, setSkillFilter] = useState([]);   // selected "related skills" chips
  const [tagFilter,  setTagFilter]  = useState([]);     // selected "tags" chips
  const [levelMin,   setLevelMin]   = useState(1);
  const [levelMax,   setLevelMax]   = useState(5);
  const [healingOnly, setHealingOnly] = useState(false);
  const [cardsOnly,   setCardsOnly]   = useState(false);
  const [advancedOpen, setAdvancedOpen] = useState(false);

  // ── Character slots ────────────────────────────────────────────
  // localStorage can hold several characters (see the CHARACTER SLOTS
  // helpers above App()) — `activeId` is which one is currently open,
  // `characters` is the [{id, name}] list the switcher shows. This
  // whole block of state (build through noteRows) is just "whatever
  // the active character's data is" — switching characters means
  // reloading every one of these from the new slot; see switchCharacter/
  // addCharacterSlot below.
  //
  // `initialCharacterRef` computes the starting slot exactly once (it
  // does localStorage reads and possibly a one-time migration — see
  // loadActiveCharacterState — so it must not re-run on every render).
  const initialCharacterRef = useRef(null);
  if (initialCharacterRef.current === null) {
    initialCharacterRef.current = loadActiveCharacterState();
  }
  const initialCharacter = initialCharacterRef.current;

  const [activeId, setActiveId] = useState(initialCharacter.activeId);
  const [characters, setCharacters] = useState(initialCharacter.characters);
  const [build,      setBuild]      = useState(initialCharacter.data.build); // array of { uid, id } — see file-header note
  const [charName,   setCharName]   = useState(initialCharacter.data.charName);
  const [charConcept, setCharConcept] = useState(initialCharacter.data.charConcept);
  const [shareMsg,   setShareMsg]   = useState("");
  // Per-copy free-text notes, keyed by build-entry uid.
  const [notes, setNotes] = useState(initialCharacter.data.notes);
  // Per-copy Feature-builder choices ({ level, picks: { featureId: count } }),
  // keyed by build-entry uid.
  const [configs, setConfigs] = useState(initialCharacter.data.configs);
  // Per-copy custom name for a Feature-built build (e.g. naming an
  // all-Wing-Clip Battle Maneuver "Wing Clip"), keyed by uid like notes/configs.
  const [renames, setRenames] = useState(initialCharacter.data.renames);
  // Per-copy "expended this encounter" checkbox state, shown only on the
  // Character Sheet for Encounter techniques.
  const [expended, setExpended] = useState(initialCharacter.data.expended);
  // Stats & Skills point-buy: { Agility: 2, ... } / { Acrobatics: 1, ... }.
  const [statPoints, setStatPoints] = useState(initialCharacter.data.statPoints);
  const [skillPoints, setSkillPoints] = useState(initialCharacter.data.skillPoints);
  const [xpBudget, setXpBudget] = useState(initialCharacter.data.xpBudget);
  // Freeform scratchpad — a big text box plus a short quick-note list,
  // both saved with the character like everything else.
  const [charNotes, setCharNotes] = useState(initialCharacter.data.charNotes);
  const [noteRows, setNoteRows] = useState(initialCharacter.data.noteRows);
  const importRef = useRef();

  // Loads one character's data into all of the state above — used by
  // switchCharacter (an existing slot) and addCharacterSlot (a brand
  // new one, already holding the data in memory so it skips straight
  // back out to localStorage and back in).
  const applyCharacterData = data => {
    setBuild(data.build);
    setNotes(data.notes);
    setConfigs(data.configs);
    setRenames(data.renames);
    setExpended(data.expended);
    setStatPoints(data.statPoints);
    setSkillPoints(data.skillPoints);
    setXpBudget(data.xpBudget);
    setCharName(data.charName);
    setCharConcept(data.charConcept);
    setCharNotes(data.charNotes);
    setNoteRows(data.noteRows);
  };
