            <span style={{ fontSize:13, color:TEXT.faint, marginLeft:4 }}>XP</span>
          </div>
        </div>
      </div>
      {unknownCount > 0 && (
        <div style={{ fontSize:13, color:TEXT.faint, fontStyle:"italic", marginTop:-8, marginBottom:16 }}>
          {unknownCount} technique{unknownCount > 1 ? "s" : ""} not fully configured yet — XP varies by level.
        </div>
      )}
    </>
  );
}


// Builder tab's "My Build" sidebar — the compact, editable mirror of
// whatever's shown in TechCard on the Techniques tab. `buildRows` is
// already grouped one row per distinct technique (see the App-level
// useMemo that builds it), so this just renders that list plus the XP
// summary tiles; the actual add/remove/duplicate logic all lives in App.
function BuildPanel({
  buildRows, knownXP, unknownCount, totalXP,
  notes, configs, techFeaturesById,
  addTech, removeTech, removeInstance, duplicateInstance,
}) {
  return (
    <>
      <XPTiles knownXP={knownXP} unknownCount={unknownCount} totalXP={totalXP} />

      {/* Build list — one row per distinct technique. Plain repeats
          (no per-copy data) collapse into a ×N row; techniques with
          notes or Feature-builder choices per copy get one row each,
          since those copies aren't interchangeable. */}
      {buildRows.length === 0 ? (
        <div style={{ textAlign:"center", padding:"32px 16px", color:TEXT.faint, fontSize:15 }}>
          No techniques added yet — head to Techniques to pick some.
        </div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
          {buildRows.map(({ tech: t, uids }) => {
            const count      = uids.length;
            const uid        = uids[0];
            const isDistinct = t.free_text || needsLevelPicker(t);
            const repeatable = isRepeatable(t);
            const cfg        = needsLevelPicker(t) ? configs[uid] : null;
            const xpEach     = cfg ? cfg.level * 3 : techXP(t);
            const totalXP    = xpEach != null ? xpEach * count : null;

            let subtitle = null;
            if (t.free_text) {
              if (notes[uid]) subtitle = notes[uid];
            } else if (needsLevelPicker(t)) {
              if (cfg) {
                const feats = techFeaturesById[t.id] || [];
                const names = Object.entries(cfg.picks)
                  .map(([id, n]) => {
                    const name = feats.find(f => f.id === id)?.feature_name;
                    return name ? (n > 1 ? `${name} ×${n}` : name) : null;
                  })
                  .filter(Boolean);
                subtitle = names.length > 0 ? names.join(", ") : null;
              } else {
                subtitle = "Not configured yet";
              }
            }

            return (
              <div key={isDistinct ? uid : t.id} style={{
                display:"flex", alignItems:"center", gap:8,
                background:"#161b27",
                border:"0.5px solid #2d3555",
                borderRadius:8,
                padding:"8px 10px",
              }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{
                    fontFamily:"'MedievalSharp', Georgia, serif", fontWeight:"bold",
                    fontSize:15, color:TEXT.name,
                    overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap",
                  }}>
                    {t.name}{!isDistinct && count > 1 ? ` ×${count}` : ""}
                  </div>
                  <span style={{ fontSize:13, color:"#d4a843" }}>
                    {cfg ? `Level ${cfg.level}` : lvlLabel(t.level_min, t.level_max)}
                  </span>
                  {subtitle && (
                    <div style={{
                      fontSize:12, color:TEXT.faint, marginTop:2,
                      overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap",
                    }}>
                      {subtitle}
                    </div>
                  )}
                </div>
                <span style={{ fontSize:13, color:TEXT.faint, flexShrink:0 }}>
                  {totalXP != null ? `${totalXP} XP` : "? XP"}
                </span>
                {repeatable && (
                  <button
                    onClick={() => needsLevelPicker(t) ? duplicateInstance(uid) : addTech(t.id)}
                    aria-label={needsLevelPicker(t) ? `Add another copy of ${t.name} with the same features` : `Add another ${t.name}`}
                    style={{
                      background:"transparent", border:"0.5px solid #2d3555", borderRadius:4,
                      color:TEXT.muted, fontSize:15, lineHeight:1, padding:"2px 7px", flexShrink:0,
                    }}
                  >
                    +
                  </button>
                )}
                <button
                  onClick={() => isDistinct ? removeInstance(uid) : removeTech(t.id)}
                  aria-label={`Remove ${t.name}`}
                  style={{
                    background:"transparent", border:"none",
                    color:TEXT.faint, fontSize:18, lineHeight:1, padding:"2px 4px", flexShrink:0,
                  }}
                >
                  ✕
                </button>
              </div>
            );
          })}
        </div>
      )}
    </>
  );
}


// ══════════════════════════════════════════════════════════════════
// MAIN APP COMPONENT
// Holds all state (the active character's data, plus the fetched
// techniques/features/items/backgrounds/glossary) and renders whichever
// of the five tabs `view` currently points at: build, browse
// (Techniques), items, sheet (Character sheet), notes.
// ══════════════════════════════════════════════════════════════════
function App() {

  // ── Loaded data ────────────────────────────────────────────────
  const [techniques, setTechniques] = useState([]);
  const [features,   setFeatures]   = useState([]);   // features.json — Feature-builder options
  const [glossary,   setGlossary]   = useState([]);   // glossary.json — capitalized game terms
  const [items,       setItems]       = useState([]); // items.json — Inventory picker
  const [backgrounds, setBackgrounds] = useState([]); // backgrounds.json
  const [loading,    setLoading]    = useState(true);
  const [loadError,  setLoadError]  = useState(null);

  // ── UI state ───────────────────────────────────────────────────
  const [view,       setView]       = useState("sheet"); // build | browse | items | sheet | notes
  const [search,     setSearch]     = useState("");
  const [skillFilter, setSkillFilter] = useState([]);   // selected "related skills" chips
  const [tagFilter,  setTagFilter]  = useState([]);     // selected "tags" chips
  const [levelMin,   setLevelMin]   = useState(1);
  const [levelMax,   setLevelMax]   = useState(5);
  const [healingOnly, setHealingOnly] = useState(false);
  const [cardsOnly,   setCardsOnly]   = useState(false);
  const [advancedOpen, setAdvancedOpen] = useState(false);

  // ── Character slots ────────────────────────────────────────────
  // localStorage can hold several characters (see the CHARACTER SLOTS
  // helpers above App()) — `activeId` is which one is currently open,
  // `characters` is the [{id, name}] list the switcher shows. This
  // whole block of state (build through noteRows) is just "whatever
  // the active character's data is" — switching characters means
  // reloading every one of these from the new slot; see switchCharacter/
  // addCharacterSlot below.
  //
  // `initialCharacterRef` computes the starting slot exactly once (it
  // does localStorage reads and possibly a one-time migration — see
  // loadActiveCharacterState — so it must not re-run on every render).
  const initialCharacterRef = useRef(null);
  if (initialCharacterRef.current === null) {
    initialCharacterRef.current = loadActiveCharacterState();
  }
  const initialCharacter = initialCharacterRef.current;

  const [activeId, setActiveId] = useState(initialCharacter.activeId);
  const [characters, setCharacters] = useState(initialCharacter.characters);
  const [build,      setBuild]      = useState(initialCharacter.data.build); // array of { uid, id } — see file-header note
  const [charName,   setCharName]   = useState(initialCharacter.data.charName);
  const [charConcept, setCharConcept] = useState(initialCharacter.data.charConcept);
  const [shareMsg,   setShareMsg]   = useState("");
  // Per-copy free-text notes, keyed by build-entry uid.
  const [notes, setNotes] = useState(initialCharacter.data.notes);
  // Per-copy Feature-builder choices ({ level, picks: { featureId: count } }),
  // keyed by build-entry uid.
  const [configs, setConfigs] = useState(initialCharacter.data.configs);
  // Per-copy custom name for a Feature-built build (e.g. naming an
  // all-Wing-Clip Battle Maneuver "Wing Clip"), keyed by uid like notes/configs.
  const [renames, setRenames] = useState(initialCharacter.data.renames);
  // Per-copy "expended this encounter" checkbox state, shown only on the
  // Character Sheet for Encounter techniques.
  const [expended, setExpended] = useState(initialCharacter.data.expended);
  // Stats & Skills point-buy: { Agility: 2, ... } / { Acrobatics: 1, ... }.
  const [statPoints, setStatPoints] = useState(initialCharacter.data.statPoints);
  const [skillPoints, setSkillPoints] = useState(initialCharacter.data.skillPoints);
  const [xpBudget, setXpBudget] = useState(initialCharacter.data.xpBudget);
  // Freeform scratchpad — a big text box plus a short quick-note list,
  // both saved with the character like everything else.
  const [charNotes, setCharNotes] = useState(initialCharacter.data.charNotes);
  const [noteRows, setNoteRows] = useState(initialCharacter.data.noteRows);
  // Freeform GM-granted abilities the player writes in themselves — see
  // emptyCharacterData. Never touches XP math anywhere.
  const [customTechniques, setCustomTechniques] = useState(initialCharacter.data.customTechniques);
  // Background picks — see emptyCharacterData for the shape.
  const [selectedBackgrounds, setSelectedBackgrounds] = useState(initialCharacter.data.selectedBackgrounds);
  const [backgroundType, setBackgroundType] = useState(initialCharacter.data.backgroundType);
  // Order of the Backgrounds/Techniques blocks on the Character Sheet.
  const [sheetSectionOrder, setSheetSectionOrder] = useState(initialCharacter.data.sheetSectionOrder);
  // Which supplements are enabled — see emptyCharacterData/Sources panel.
  const [enabledSupplements, setEnabledSupplements] = useState(initialCharacter.data.enabledSupplements);
  // Inventory — see emptyCharacterData for the shape.
  const [inventory, setInventory] = useState(initialCharacter.data.inventory);
  const [gold, setGold] = useState(initialCharacter.data.gold);
  const [customItems, setCustomItems] = useState(initialCharacter.data.customItems);
  // GM-granted custom crafting materials — see emptyCharacterData.
  const [customMaterials, setCustomMaterials] = useState(initialCharacter.data.customMaterials);
  // Attack Workspace — see emptyCharacterData for the shape.
  const [customAttacks, setCustomAttacks] = useState(initialCharacter.data.customAttacks);
  // Current Shallow/Deep Health — see emptyCharacterData for why this
  // is session state, not part of the build proper.
  const [currentHealth, setCurrentHealth] = useState(initialCharacter.data.currentHealth);
  const importRef = useRef();
  const importAllRef = useRef();

  // Loads one character's data into all of the state above — used by
  // switchCharacter (an existing slot) and addCharacterSlot (a brand
  // new one, already holding the data in memory so it skips straight
  // back out to localStorage and back in).
  const applyCharacterData = data => {
    setBuild(data.build);
    setNotes(data.notes);
    setConfigs(data.configs);
    setRenames(data.renames);
    setExpended(data.expended);
    setStatPoints(data.statPoints);
    setSkillPoints(data.skillPoints);
    setXpBudget(data.xpBudget);
    setCharName(data.charName);
    setCharConcept(data.charConcept);
    setCharNotes(data.charNotes);
    setNoteRows(data.noteRows);
    setCustomTechniques(data.customTechniques);
    setSelectedBackgrounds(data.selectedBackgrounds);
    setBackgroundType(data.backgroundType);
    setInventory(data.inventory);
    setGold(data.gold);
    setCustomItems(data.customItems);
    setCustomMaterials(data.customMaterials);
    setCustomAttacks(data.customAttacks);
    setSheetSectionOrder(data.sheetSectionOrder);
    setEnabledSupplements(data.enabledSupplements);
    setCurrentHealth(data.currentHealth);
  };

  // The active character's data, in the same shape emptyCharacterData/
  // applyCharacterData use — the single source of truth for "what does
  // this character's save file look like right now," shared by the
  // persist effect, duplicateCharacter, and doExportAll below.
  const currentCharacterData = () => ({
    build, notes, configs, renames, expended,
    statPoints, skillPoints, xpBudget,
    charName, charConcept, charNotes, noteRows, customTechniques,
    selectedBackgrounds, backgroundType, inventory, gold, customItems, customMaterials,
    customAttacks, sheetSectionOrder, enabledSupplements, currentHealth,
  });

  // Switches to an existing character slot.
  const switchCharacter = id => {
    if (id === activeId) return;
    setActiveId(id);
    applyCharacterData(loadCharacterData(id));
  };

  // Creates a new character slot from `data` (defaults fill in anything
  // missing) and switches to it — used by "+ New character", importing
  // a build file, and opening a share link for a build that isn't
  // already open here. None of these ever touch the character you were
  // already on; they just add a slot and switch, so nothing you're
  // working on can be overwritten by someone else's link or file.
  const addCharacterSlot = (data = {}, { switchView } = {}) => {
    const id = makeUid();
    const full = { ...emptyCharacterData(), ...data };
    saveCharacterData(id, full);
    setCharacters(cs => [...cs, { id, name: full.charName || "" }]);
    setActiveId(id);
    applyCharacterData(full);
    if (switchView) setView(switchView);
    return id;
  };

  // Copies the active character into a brand-new slot — everything
  // (build, stats, inventory, notes, the works) via the same JSON
  // round-trip used for backup/restore, so the copy shares no object
  // references with the original. Handy for branching off a variant
  // build without losing the original or re-entering it by hand.
  const duplicateCharacter = () => {
    const data = JSON.parse(JSON.stringify(currentCharacterData()));
    data.charName = data.charName ? `${data.charName} (Copy)` : "";
    addCharacterSlot(data);
  };

  // Deletes a character slot — always leaves at least one behind, and
  // switches to the first remaining one if the active slot was deleted.
  const deleteCharacter = id => {
    if (characters.length <= 1) return;
    localStorage.removeItem(`flagonquest-char-${id}`);
    setCharacters(cs => {
      const next = cs.filter(c => c.id !== id);
      if (id === activeId) {
        setActiveId(next[0].id);
        applyCharacterData(loadCharacterData(next[0].id));
      }
      return next;
    });
  };

  // ── Fetch JSON data on first load ──────────────────────────────
  // Promise.all fetches both files simultaneously so we only wait once.
  // Paths are relative to index.html, so "data/techniques.json" works
  // on GitHub Pages and on localhost:8000 equally.
  useEffect(() => {
    Promise.all([
      fetch("data/techniques.json").then(r => {
        if (!r.ok) throw new Error(`techniques.json returned ${r.status}`);
        return r.json();
      }),
      fetch("data/features.json").then(r => {
        if (!r.ok) throw new Error(`features.json returned ${r.status}`);
        return r.json();
      }),
      fetch("data/items.json").then(r => {
        if (!r.ok) throw new Error(`items.json returned ${r.status}`);
        return r.json();
      }),
      fetch("data/backgrounds.json").then(r => {
        if (!r.ok) throw new Error(`backgrounds.json returned ${r.status}`);
        return r.json();
      }),
      // Glossary is a nice-to-have, not core data — a missing/broken file
      // just means no term gets a tooltip, not a load error for the app.
      fetch("data/glossary.json").then(r => r.ok ? r.json() : []).catch(() => []),
    ])
    .then(([techData, featData, itemData, backgroundData, glossaryData]) => {
      setTechniques(techData);
      setFeatures(featData);
      setItems(itemData);
      setBackgrounds(backgroundData);
      setGlossary(Array.isArray(glossaryData) ? glossaryData : []);
      setLoading(false);
    })
    .catch(err => {
      setLoadError(err.message);
      setLoading(false);
    });
  }, []); // empty [] = run once on mount only

  // ── Load a shared build from the URL hash ──────────────────────
  // If someone opens a share link like index.html#build=abc123, this
  // decodes it and adds it as a brand-new character slot rather than
  // touching whatever's currently active — opening a link should never
  // be able to overwrite a character you're already working on. Each
  // restored technique gets a fresh uid; share links carry the technique
  // list, character name, and Stats & Skills, but not notes/Feature
  // choices (kept out to keep the URL short), so those come back blank.
  //
  // Because the address bar mirrors the active character's build live
  // (see the sync effect below), most hash values we ever see are just
  // an echo of what's already open — adding a new slot for those too
  // would spawn a fresh duplicate character on every refresh. So: only
  // act when the hash's technique list actually differs from the active
  // build, i.e. someone opened a link this browser didn't just write
  // itself. `buildRef` sidesteps the stale-closure problem of reading
  // `build` from a listener that's only attached once — a URL differing
  // only in its fragment (e.g. pasting a different share link into an
  // already-open tab) doesn't reload the page, it only fires
  // "hashchange", so this needs to keep working long after mount.
  const buildRef = useRef(build);
  useEffect(() => { buildRef.current = build; }, [build]);
  useEffect(() => {
    const applyHash = () => {
      const hash = window.location.hash;
      if (!hash.startsWith("#build=")) return;
      const decoded = decBuild(hash.slice(7));
      if (!decoded) return;
      const isEcho = decoded.ids && JSON.stringify(decoded.ids) === JSON.stringify(buildRef.current.map(e => e.id));
      if (isEcho) return;
      addCharacterSlot({
        build: (decoded.ids || []).map(id => ({ uid: makeUid(), id })),
        charName: decoded.name || "",
        statPoints:  { ...emptyCharacterData().statPoints,  ...(decoded.stats  || {}) },
        skillPoints: { ...emptyCharacterData().skillPoints, ...(decoded.skills || {}) },
      }, { switchView: "sheet" });
    };
    applyHash();
    window.addEventListener("hashchange", applyHash);
    return () => window.removeEventListener("hashchange", applyHash);
  }, []);

  // ── Retain across refresh: keep the address bar live ────────────
  // Writes the same {ids, name, stats, skills} encoding "Copy share
  // link" uses into the URL hash on every change, via replaceState (no
  // new history entries, no navigation). Two things fall out of this:
  // the address bar is always a current, copy-pasteable link to this
  // exact build, and — since the hash-loading effect above only acts on
  // hashes it didn't itself write — a plain refresh just re-reads the
  // active character straight back out of localStorage instead.
  useEffect(() => {
    const encoded = encBuild({ ids: build.map(e => e.id), name: charName, stats: statPoints, skills: skillPoints });
    const url = window.location.href.split("#")[0] + "#build=" + encoded;
    window.history.replaceState(null, "", url);
  }, [build, charName, statPoints, skillPoints]);

  // ── Persist the active character, and keep the switcher list synced ─
  useEffect(() => {
    saveCharacterData(activeId, currentCharacterData());
  }, [activeId, build, notes, configs, renames, expended, statPoints, skillPoints, xpBudget, charName, charConcept, charNotes, noteRows, customTechniques, selectedBackgrounds, backgroundType, inventory, gold, customItems, customMaterials, customAttacks, sheetSectionOrder, enabledSupplements, currentHealth]);
  useEffect(() => {
    localStorage.setItem("flagonquest-characters", JSON.stringify(characters));
  }, [characters]);
  useEffect(() => {
    localStorage.setItem("flagonquest-active-character", activeId);
  }, [activeId]);
  // Keeps the switcher's label for the active character following
  // whatever's currently typed into "Character name."
  useEffect(() => {
    setCharacters(cs => cs.some(c => c.id === activeId && c.name === charName)
      ? cs
      : cs.map(c => c.id === activeId ? { ...c, name: charName } : c));
  }, [charName, activeId]);

  const setNote = (uid, text) => setNotes(n => ({ ...n, [uid]: text }));
  const setRename = (uid, text) => setRenames(r => ({ ...r, [uid]: text }));
  const setExpendedFor = (uid, val) => setExpended(x => ({ ...x, [uid]: val }));
  const setHealthTrack = (track, value) => setCurrentHealth(h => ({ ...h, [track]: value }));
  const addNoteRow    = () => setNoteRows(r => [...r, { id: makeUid(), text: "" }]);
  const updateNoteRow = (id, text) => setNoteRows(r => r.map(row => row.id === id ? { ...row, text } : row));
  const removeNoteRow = id => setNoteRows(r => r.filter(row => row.id !== id));
  const setStat  = (stat, n)  => setStatPoints(p => ({ ...p, [stat]: Math.min(5, Math.max(0, n)) }));
  const setSkill = (skill, n) => setSkillPoints(p => ({ ...p, [skill]: Math.min(5, Math.max(0, n)) }));

  // Total XP spent on Stats & Skills (triangular cost, doubled for stats).
  const statSkillXP = useMemo(() => {
    let total = 0;
    STATS.forEach(s => { total += statTotalCost(statPoints[s] || 0); });
    ALL_STAT_SKILLS.forEach(s => { total += skillTotalCost(skillPoints[s] || 0); });
    return total;
  }, [statPoints, skillPoints]);

  // ── Features grouped by the technique they belong to ────────────
  const techFeaturesById = useMemo(() => {
    const map = {};
    features.forEach(f => {
      (map[f.technique_id] ??= []).push(f);
    });
    return map;
  }, [features]);

  // ── Every related skill / tag seen across the loaded techniques ─
  // Powers the "Related skills" and "Tags" multiselects in Advanced filters.
  const allSkills = useMemo(() => {
    const set = new Set();
    techniques.forEach(t => splitCSV(t.related_skills).forEach(s => set.add(s)));
    return [...set].sort();
  }, [techniques]);

  const allTags = useMemo(() => {
    const set = new Set();
    techniques.forEach(t => splitCSV(t.tags).forEach(tag => set.add(tag)));
    return [...set].sort();
  }, [techniques]);

  const toggleSkill = skill => setSkillFilter(cur =>
    cur.includes(skill) ? cur.filter(s => s !== skill) : [...cur, skill]
  );
  const toggleTag = tag => setTagFilter(cur =>
    cur.includes(tag) ? cur.filter(t => t !== tag) : [...cur, tag]
  );

  // ── Filtered technique list ────────────────────────────────────
  // useMemo = only recalculate when one of the listed deps changes.
  const visible = useMemo(() => techniques.filter(t => {
    if (!matchesLevel(t, levelMin, levelMax)) return false;
    if (healingOnly && !t.healing) return false;
    if (cardsOnly && !t.use_cards) return false;
    if (skillFilter.length > 0) {
      const techSkills = splitCSV(t.related_skills);
      if (!skillFilter.some(s => techSkills.includes(s))) return false;
    }
    if (tagFilter.length > 0) {
      const techTags = splitCSV(t.tags);
      if (!tagFilter.some(tag => techTags.includes(tag))) return false;
    }
    if (search) {
      const q = search.toLowerCase();
      // Search the technique's full text — every field a player might
      // type a fragment of, not just name/effects. The literal word
      // "Special" is added whenever a technique has one, since that's the
      // label shown on its card — searching "special" should surface every
      // technique that has one, not just ones whose special text happens
      // to contain that word.
      const hay = [
        t.name, t.tags, t.related_skills,
        t.description, t.condition, t.action, t.cost, t.target,
        t.effects, t.special, t.prereqs, t.special ? "Special" : null,
      ].filter(Boolean).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  // Default sort: Level first (a Draft's null level_min sorts last, via
  // Infinity, since there's nothing to rank it against), then
  // alphabetically within the same Level — no UI control to change
  // this, just a stable, predictable default browsing order.
  }).sort((a, b) => {
    const diff = (a.level_min ?? Infinity) - (b.level_min ?? Infinity);
    return diff !== 0 ? diff : a.name.localeCompare(b.name);
  }), [techniques, search, skillFilter, tagFilter, levelMin, levelMax, healingOnly, cardsOnly]);

  // ── Build entries paired with their technique object ────────────
  const buildEntries = useMemo(() =>
    build.map(e => ({ ...e, tech: techniques.find(t => t.id === e.id) })).filter(e => e.tech),
  [build, techniques]);

  // XP for one build entry: a Feature-built copy uses its *chosen*
  // level (level × 3), since we actually know it; everything else
  // falls back to the technique's fixed level, or null if it's a
  // range/draft technique we can't auto-price.
  function entryXP(e) {
    const cfg = configs[e.uid];
    if (cfg && cfg.level != null) return cfg.level * 3;
    return techXP(e.tech);
  }

  // One row per distinct technique for display — a plain repeatable
  // technique (no per-copy data) collapses into a "×N" row, but a
  // technique with its own notes or Feature-builder choices per copy
  // always gets one row per copy, since those copies differ.
  const buildRows = useMemo(() => {
    const rows = [];
    const groupIndex = {};
    build.forEach(({ uid, id }) => {
      const tech = techniques.find(t => t.id === id);
      if (!tech) return;
      if (tech.free_text || needsLevelPicker(tech)) {
        rows.push({ tech, uids: [uid] });
      } else if (id in groupIndex) {
        rows[groupIndex[id]].uids.push(uid);
      } else {
        groupIndex[id] = rows.length;
        rows.push({ tech, uids: [uid] });
      }
    });
    return rows;
  }, [build, techniques]);

  // ── XP totals ──────────────────────────────────────────────────
  const knownXP      = buildEntries.reduce((sum, e) => sum + (entryXP(e) ?? 0), 0);
  const unknownCount = buildEntries.filter(e => entryXP(e) == null).length;
  const totalXP      = knownXP + statSkillXP;

  // ── Build mutations ────────────────────────────────────────────
  // Duplicate/Encounter techniques can be added more than once; every
  // other technique still only ever has one copy in the build.
  const addTech = id => setBuild(b => {
    const tech = techniques.find(t => t.id === id);
    if (tech && !isRepeatable(tech) && b.some(e => e.id === id)) return b;
    return [...b, { uid: makeUid(), id }];
  });

  // ── Undo toast for accidental removals ───────────────────────────
  // Remembers only the single most recent removal — a new one just
  // replaces whatever was pending — and auto-dismisses after a few
  // seconds so it doesn't linger. Scoped to techniques and items (both
  // built-in and custom), the removals that cost real XP/gold to redo;
  // small per-field removals (a stat row, a note line) aren't covered.
  const undoTimerRef = useRef(null);
  const [undoInfo, setUndoInfo] = useState(null); // { message, restore }
  const offerUndo = (message, restore) => {
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    setUndoInfo({ message, restore });
    undoTimerRef.current = setTimeout(() => setUndoInfo(null), 8000);
  };
  const performUndo = () => {
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    if (undoInfo) undoInfo.restore();
    setUndoInfo(null);
  };

  // Removes one copy (whichever was added most recently) — used by the
  // simple "Remove"/"Remove one" buttons and the build list's ✕ for
  // techniques with no per-copy data. For a non-repeatable technique
  // that's its only copy, so it behaves like a full removal.
  const removeTech = id => {
    const idx = build.map(e => e.id).lastIndexOf(id);
    if (idx === -1) return;
    const uid = build[idx].uid;
    const savedNote = notes[uid], savedConfig = configs[uid], savedRename = renames[uid], savedExpended = expended[uid];
    setBuild(b => [...b.slice(0, idx), ...b.slice(idx + 1)]);
    setNotes(n => { if (!(uid in n)) return n; const c = { ...n }; delete c[uid]; return c; });
    setConfigs(c => { if (!(uid in c)) return c; const cc = { ...c }; delete cc[uid]; return cc; });
    setRenames(r => { if (!(uid in r)) return r; const c = { ...r }; delete c[uid]; return c; });
    setExpended(x => { if (!(uid in x)) return x; const c = { ...x }; delete c[uid]; return c; });
    const techName = (techniques.find(t => t.id === id) || {}).name || "technique";
    offerUndo(`Removed ${techName}`, () => {
      setBuild(b => [...b.slice(0, idx), { uid, id }, ...b.slice(idx)]);
      if (savedNote !== undefined) setNotes(n => ({ ...n, [uid]: savedNote }));
      if (savedConfig !== undefined) setConfigs(c => ({ ...c, [uid]: savedConfig }));
      if (savedRename !== undefined) setRenames(r => ({ ...r, [uid]: savedRename }));
      if (savedExpended !== undefined) setExpended(x => ({ ...x, [uid]: savedExpended }));
    });
  };

  // Removes one specific copy by its uid — used for free_text/Feature
  // rows, where each copy carries its own notes/config that a plain
  // "remove the last one" wouldn't target correctly.
  const removeInstance = uid => {
    const idx = build.findIndex(e => e.uid === uid);
    if (idx === -1) return;
    const id = build[idx].id;
    const savedNote = notes[uid], savedConfig = configs[uid], savedRename = renames[uid], savedExpended = expended[uid];
    setBuild(b => b.filter(e => e.uid !== uid));
    setNotes(n => { if (!(uid in n)) return n; const c = { ...n }; delete c[uid]; return c; });
    setConfigs(c => { if (!(uid in c)) return c; const cc = { ...c }; delete cc[uid]; return cc; });
    setRenames(r => { if (!(uid in r)) return r; const c = { ...r }; delete c[uid]; return c; });
    setExpended(x => { if (!(uid in x)) return x; const c = { ...x }; delete c[uid]; return c; });
    const techName = (techniques.find(t => t.id === id) || {}).name || "technique";
    offerUndo(`Removed ${techName}`, () => {
      setBuild(b => [...b.slice(0, idx), { uid, id }, ...b.slice(idx)]);
      if (savedNote !== undefined) setNotes(n => ({ ...n, [uid]: savedNote }));
      if (savedConfig !== undefined) setConfigs(c => ({ ...c, [uid]: savedConfig }));
      if (savedRename !== undefined) setRenames(r => ({ ...r, [uid]: savedRename }));
      if (savedExpended !== undefined) setExpended(x => ({ ...x, [uid]: savedExpended }));
    });
  };

  // Creates a new copy with the same Feature-builder config as an
  // existing one — the "purchase another copy with the same features"
  // option, alongside "+ Build another copy" for different features.
  const duplicateInstance = uid => {
    const entry = build.find(e => e.uid === uid);
    const cfg   = configs[uid];
    if (!entry) return;
    const newUid = makeUid();
    setBuild(b => [...b, { uid: newUid, id: entry.id }]);
    if (cfg) {
      setConfigs(c => ({ ...c, [newUid]: { level: cfg.level, picks: { ...cfg.picks } } }));
    }
    if (renames[uid]) {
      setRenames(r => ({ ...r, [newUid]: renames[uid] }));
    }
  };

  // Saves a Feature-builder configuration: pass an existing uid to
  // edit that copy in place, or null to add a brand-new copy.
  const saveConfig = (techId, uid, cfg) => {
    if (uid) {
      setConfigs(c => ({ ...c, [uid]: cfg }));
    } else {
      const newUid = makeUid();
      setBuild(b => [...b, { uid: newUid, id: techId }]);
      setConfigs(c => ({ ...c, [newUid]: cfg }));
    }
  };

  const clearBuild = () => {
    if (!confirm("Clear the current build, including Stats & Skills?")) return;
    setBuild([]);
    setNotes({});
    setConfigs({});
    setRenames({});
    setExpended({});
    setStatPoints(Object.fromEntries(STATS.map(s => [s, 0])));
    setSkillPoints(Object.fromEntries(ALL_STAT_SKILLS.map(s => [s, 0])));
  };

  // Drag-to-reorder on the Builder tab — moves every copy of `draggedId`
  // (as a block, keeping their own relative order) to sit right before
  // `targetId`. Only reorders which distinct technique comes first;
  // never touches per-copy data, since it's just rearranging the same
  // entries, not adding/removing any.
  const [dragId, setDragId] = useState(null);
  const moveTechniqueGroup = (draggedId, targetId) => {
    if (draggedId === targetId) return;
    setBuild(b => {
      const order  = [];
      const groups = {};
      b.forEach(entry => {
        if (!(entry.id in groups)) { groups[entry.id] = []; order.push(entry.id); }
        groups[entry.id].push(entry);
      });
      const fromIdx = order.indexOf(draggedId);
      const toIdx   = order.indexOf(targetId);
      if (fromIdx === -1 || toIdx === -1) return b;
      order.splice(fromIdx, 1);
      order.splice(toIdx, 0, draggedId);
      return order.flatMap(id => groups[id]);
    });
  };

  // ── Custom techniques — freeform, no XP, no data-file entry ─────
  const addCustomTechnique = () => {
    setCustomTechniques(cs => [...cs, { id: makeUid(), title: "", text: "" }]);
  };
  const updateCustomTechnique = (id, field, value) => {
    setCustomTechniques(cs => cs.map(c => c.id === id ? { ...c, [field]: value } : c));
  };
  const removeCustomTechnique = id => {
    const idx = customTechniques.findIndex(c => c.id === id);
    if (idx === -1) return;
    const removed = customTechniques[idx];
    setCustomTechniques(cs => cs.filter(c => c.id !== id));
    offerUndo(`Removed ${removed.title || "custom technique"}`, () => {
      setCustomTechniques(cs => [...cs.slice(0, idx), removed, ...cs.slice(idx)]);
    });
  };
  const moveCustomTechnique = (draggedId, targetId) => {
    if (draggedId === targetId) return;
    setCustomTechniques(cs => {
      const from = cs.findIndex(c => c.id === draggedId);
      const to   = cs.findIndex(c => c.id === targetId);
      if (from === -1 || to === -1) return cs;
      const next = [...cs];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  };

  // ── Custom items — freeform, no data-file entry. Can still carry a
  // Slot (sharing SLOT_CAPACITY with real items), manually-entered flat
  // stats, and any number of attached Masterwork powers (for the one
  // in-game ability that stacks more than one on an item) — see
  // CustomItemTile for how those combine into its stat badges.
  const addCustomItem = () => {
    setCustomItems(cs => [...cs, { id: makeUid(), name: "", text: "", qty: 1, slot: "", equipped: false, stats: {}, powers: [] }]);
  };
  const updateCustomItem = (id, field, value) => {
    setCustomItems(cs => cs.map(c => c.id === id ? { ...c, [field]: value } : c));
  };
  const removeCustomItem = id => {
    const idx = customItems.findIndex(c => c.id === id);
    if (idx === -1) return;
    const removed = customItems[idx];
    setCustomItems(cs => cs.filter(c => c.id !== id));
    offerUndo(`Removed ${removed.name || "custom item"}`, () => {
      setCustomItems(cs => [...cs.slice(0, idx), removed, ...cs.slice(idx)]);
    });
  };
  const moveCustomItem = (draggedId, targetId) => {
    if (draggedId === targetId) return;
    setCustomItems(cs => {
      const from = cs.findIndex(c => c.id === draggedId);
      const to   = cs.findIndex(c => c.id === targetId);
      if (from === -1 || to === -1) return cs;
      const next = [...cs];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  };

  // ── Custom materials — GM-granted crafting materials, no data-file
  // entry (see CustomMaterialTile). Same shape of handlers as custom
  // items above, minus anything equip-related since materials aren't worn.
  const addCustomMaterial = () => {
    setCustomMaterials(cs => [...cs, { id: makeUid(), name: "", level: 1, types: [], qty: 1 }]);
  };
  const updateCustomMaterial = (id, field, value) => {
    setCustomMaterials(cs => cs.map(c => c.id === id ? { ...c, [field]: value } : c));
  };
  const toggleCustomMaterialType = (id, type) => {
    setCustomMaterials(cs => cs.map(c => c.id === id
      ? { ...c, types: c.types.includes(type) ? c.types.filter(t => t !== type) : [...c.types, type] }
      : c));
  };
  const removeCustomMaterial = id => {
    const idx = customMaterials.findIndex(c => c.id === id);
    if (idx === -1) return;
    const removed = customMaterials[idx];
    setCustomMaterials(cs => cs.filter(c => c.id !== id));
    offerUndo(`Removed ${removed.name || "custom material"}`, () => {
      setCustomMaterials(cs => [...cs.slice(0, idx), removed, ...cs.slice(idx)]);
    });
  };

  // Equipped — Character Sheet only, same slot-capacity rule as real
  // items (toggleEquipped below), just checked against inventory AND
  // customItems together since they share the same body slots.
  const toggleCustomItemEquipped = id => {
    setCustomItems(cs => {
      const entry = cs.find(c => c.id === id);
      if (!entry) return cs;
      if (entry.equipped) {
        return cs.map(c => c.id === id ? { ...c, equipped: false } : c);
      }
      if (entry.slot) {
        const capacity = SLOT_CAPACITY[entry.slot] || 1;
        const usedByInventory = inventory.reduce((sum, e) => {
          if (!e.equipped) return sum;
          const it = items.find(i => i.id === e.itemId);
          return (it && it.slot === entry.slot) ? sum + slotCost(it) : sum;
        }, 0);
        const usedByCustom = cs.reduce((sum, c) => (c.id !== id && c.equipped && c.slot === entry.slot) ? sum + 1 : sum, 0);
        if (usedByInventory + usedByCustom + 1 > capacity) return cs;
      }
      return cs.map(c => c.id === id ? { ...c, equipped: true } : c);
    });
  };
  const addCustomItemStat = (id, key) => {
    setCustomItems(cs => cs.map(c => c.id === id ? { ...c, stats: { ...c.stats, [key]: 0 } } : c));
  };
  const customItemStatChange = (id, key, value) => {
    setCustomItems(cs => cs.map(c => c.id === id ? { ...c, stats: { ...c.stats, [key]: value } } : c));
  };
  const removeCustomItemStat = (id, key) => {
    setCustomItems(cs => cs.map(c => {
      if (c.id !== id) return c;
      const stats = { ...c.stats };
      delete stats[key];
      return { ...c, stats };
    }));
  };
  // Weapon stats — opt-in (see CustomItemTile's "+ Add weapon stats");
  // this is also how an Improvised Weapon gets built now, instead of a
  // dedicated data-file item — see customWeapon{Accuracy,Parry,Range,
  // Damage} and their "improvised" modifier.
  const addCustomItemWeapon = id => {
    setCustomItems(cs => cs.map(c => c.id === id ? {
      ...c,
      weapon: {
        accuracy: null, damageBase: null, damageStat: null, damageType: "Physical",
        range: "", skill: "", weaponDefense: null, improvised: false,
      },
    } : c));
  };
  const removeCustomItemWeapon = id => {
    setCustomItems(cs => cs.map(c => c.id === id ? { ...c, weapon: null } : c));
  };
  const customItemWeaponChange = (id, field, value) => {
    setCustomItems(cs => cs.map(c => c.id === id ? { ...c, weapon: { ...c.weapon, [field]: value } } : c));
  };
  const addCustomItemPower = (id, itemId) => {
    setCustomItems(cs => cs.map(c => {
      if (c.id !== id) return c;
      const power = items.find(i => i.id === itemId);
      const level = power?.levels?.[0];
      return { ...c, powers: [...(c.powers || []), { id: makeUid(), itemId, ...(level != null ? { level } : {}) }] };
    }));
  };
  const customItemPowerLevelChange = (id, powerId, level) => {
    setCustomItems(cs => cs.map(c => c.id === id
      ? { ...c, powers: (c.powers || []).map(p => p.id === powerId ? { ...p, level } : p) }
      : c));
  };
  const removeCustomItemPower = (id, powerId) => {
    setCustomItems(cs => cs.map(c => c.id === id
      ? { ...c, powers: (c.powers || []).filter(p => p.id !== powerId) }
      : c));
  };

  // ── Attack Workspace — freeform rows the player fills in (a spell
  // attack, an equipped weapon the auto-list can't see, etc.) alongside
  // the auto-listed equipped-weapon rows below.
  const addCustomAttack = () => {
    setCustomAttacks(a => [...a, { id: makeUid(), name: "", accuracy: "", damage: "", range: "", skill: "", notes: "" }]);
  };
  const updateCustomAttack = (id, field, value) => {
    setCustomAttacks(a => a.map(r => r.id === id ? { ...r, [field]: value } : r));
  };
  const removeCustomAttack = id => {
    setCustomAttacks(a => a.filter(r => r.id !== id));
  };
  // An auto-listed weapon row's Notes lives on its inventory entry or
  // custom item (attackNote) rather than in customAttacks, since the row
  // itself is computed fresh from what's equipped, not stored. A row's
  // key is either an inventory uid or a custom item id (both from the
  // same makeUid() pool), so only one of these two ever actually
  // contains it — the other bails out to the same array reference,
  // rather than mapping over everything for nothing.
  const setWeaponAttackNote = (key, note) => {
    setInventory(inv => inv.some(e => e.uid === key) ? inv.map(e => e.uid === key ? { ...e, attackNote: note } : e) : inv);
    setCustomItems(cs => cs.some(c => c.id === key) ? cs.map(c => c.id === key ? { ...c, attackNote: note } : c) : cs);
  };

  // ── Sources — which supplements' items/backgrounds are offered for
  // picking (Items tab search, Backgrounds picker) — see the Sources
  // panel on Builder and emptyCharacterData. The list of known
  // supplements is derived from the data itself (every distinct
  // `supplement` value across items and backgrounds) rather than
  // hardcoded, so a future supplement just needs the data tagged —
  // no code change to show up here.
  const allSupplements = useMemo(() => {
    const set = new Set();
    items.forEach(i => { if (i.supplement) set.add(i.supplement); });
    backgrounds.forEach(b => { if (b.supplement) set.add(b.supplement); });
    return [...set].sort();
  }, [items, backgrounds]);
  const toggleSupplement = name => {
    setEnabledSupplements(list => list.includes(name) ? list.filter(s => s !== name) : [...list, name]);
  };

  // ── Backgrounds — pick at most one General, and one Settler-or-
  // Wildfolk. Clicking a background swaps it in for whichever one was
  // picked before in the same *slot* — General is its own slot, but
  // Settler and Wildfolk share one slot (mutually exclusive with each
  // other, not just within themselves), since a character is one or the
  // other regardless of which the toggle happens to be showing. A
  // Goblin clan background (Category = the clan's own name, not
  // General/Settler/Wildfolk) has no exclusivity at all — see
  // backgroundSlot — so both of a clan's tribal bonuses, or bonuses
  // from different clans, can all be picked together freely. Clicking
  // the selected one again deselects it. Order is drag-reorderable,
  // same as techniques.
  const toggleBackground = bg => {
    setSelectedBackgrounds(ids => {
      if (ids.includes(bg.id)) return ids.filter(id => id !== bg.id);
      const slot = backgroundSlot(bg);
      const sameSlotIds = new Set(backgrounds.filter(b => backgroundSlot(b) === slot).map(b => b.id));
      return [...ids.filter(id => !sameSlotIds.has(id)), bg.id];
    });
  };
  const moveBackground = (draggedId, targetId) => {
    if (draggedId === targetId) return;
    setSelectedBackgrounds(ids => {
      const from = ids.indexOf(draggedId);
      const to   = ids.indexOf(targetId);
      if (from === -1 || to === -1) return ids;
      const next = [...ids];
      next.splice(from, 1);
      next.splice(to, 0, draggedId);
      return next;
    });
  };
  // Character Sheet only — swaps which of Backgrounds/Techniques prints
  // first, same drag-reorder pattern (and shared dragId) as everything
  // else. Only two keys ever exist, so this is really just a toggle,
  // but it reuses the general splice-based move rather than a bespoke
  // swap function.
  const moveSheetSection = (draggedKey, targetKey) => {
    if (draggedKey === targetKey) return;
    setSheetSectionOrder(order => {
      const from = order.indexOf(draggedKey);
      const to   = order.indexOf(targetKey);
      if (from === -1 || to === -1) return order;
      const next = [...order];
      next.splice(from, 1);
      next.splice(to, 0, draggedKey);
      return next;
    });
  };

  // ── Inventory — quantity per distinct item, no per-copy config —
  // except for a Masterwork item with more than one valid build level
  // (item.levels), where the *level* also distinguishes copies: adding
  // an item already carried at that same level just bumps its quantity,
  // but a different level gets its own row so e.g. a level-1 and a
  // level-3 Cowl of Tranquility show as two separate tiles instead of
  // one "qty 2" tile that can't say which level either copy actually is.
  const addInventoryItem = itemId => {
    setInventory(inv => {
      const item = items.find(i => i.id === itemId);
      const levels = (item && item.levels) || [];
      const hasLevel = levels.length > 0;
      const defaultLevel = hasLevel ? levels[0] : undefined;
      const existing = inv.find(e => e.itemId === itemId && (!hasLevel || e.level === defaultLevel));
      if (existing) return inv.map(e => e === existing ? { ...e, qty: e.qty + 1 } : e);
      return [...inv, { uid: makeUid(), itemId, qty: 1, ...(hasLevel ? { level: defaultLevel } : {}) }];
    });
  };
  const setInventoryQty = (uid, qty) => {
    setInventory(inv => inv.map(e => e.uid === uid ? { ...e, qty: Math.max(1, qty) } : e));
  };
  const removeInventoryItem = uid => {
    const idx = inventory.findIndex(e => e.uid === uid);
    if (idx === -1) return;
    const removed = inventory[idx];
    const itemName = (items.find(i => i.id === removed.itemId) || {}).name || "item";
    setInventory(inv => inv.filter(e => e.uid !== uid));
    offerUndo(`Removed ${itemName}`, () => {
      setInventory(inv => [...inv.slice(0, idx), removed, ...inv.slice(idx)]);
    });
  };
  // Manual reordering via the Items tab's drag handles — same splice
  // pattern as moveBackground/moveCustomTechnique, reusing the same
  // shared dragId/setDragId state.
  const moveInventoryItem = (draggedUid, targetUid) => {
    if (draggedUid === targetUid) return;
    setInventory(inv => {
      const from = inv.findIndex(e => e.uid === draggedUid);
      const to   = inv.findIndex(e => e.uid === targetUid);
      if (from === -1 || to === -1) return inv;
      const next = [...inv];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  };
  // A Masterwork item's power is built onto a base item (e.g. a Torso
  // enchantment onto Light or Heavy Armor) — see item.base_item_options.
  // Only meaningful for items that have options to pick from; harmless
  // no-op to set it on anything else.
  const setInventoryBaseItem = (uid, baseItemId) => {
    setInventory(inv => inv.map(e => e.uid === uid ? { ...e, baseItemId: baseItemId || null } : e));
  };
  // Which of a Masterwork item's valid levels this particular copy was
  // built at — see item.levels. Doesn't merge with any other row already
  // at that level; two copies you deliberately set to the same level
  // just stay as two separate tiles until you remove one.
  const setInventoryLevel = (uid, level) => {
    setInventory(inv => inv.map(e => e.uid === uid ? { ...e, level } : e));
  };

  // Equipped — Character Sheet only (see InventorySection's showEquip).
  // Equipped items are treated as physically distinct from the rest of a
  // stack: equipping one copy out of a qty > 1 stack splits a single
  // qty-1 equipped copy off into its own entry, leaving the rest behind
  // as a separate unequipped stack — "10 swords, equip one" becomes an
  // equipped sword card plus an unworn stack of 9, rather than the whole
  // stack of 10 reading as equipped. Unequipping folds back into a
  // matching unequipped stack (same item/level/base item) if one exists,
  // rather than leaving two same-item cards sitting side by side.
  // Equipping is blocked when it would overflow the item's (effective)
  // slot capacity — InventorySection disables the checkbox for this, but
  // this function re-checks the same rule itself rather than trusting
  // the UI alone.
  const toggleEquipped = uid => {
    setInventory(inv => {
      const entry = inv.find(e => e.uid === uid);
      if (!entry) return inv;
      if (entry.equipped) {
        const twin = inv.find(e => e.uid !== uid && !e.equipped && e.itemId === entry.itemId
          && e.level === entry.level && e.baseItemId === entry.baseItemId);
        if (twin) {
          return inv
            .map(e => e.uid === twin.uid ? { ...e, qty: e.qty + entry.qty } : e)
            .filter(e => e.uid !== uid);
        }
        return inv.map(e => e.uid === uid ? { ...e, equipped: false } : e);
      }
      const item = items.find(i => i.id === entry.itemId);
      if (item) {
        const slot = effectiveSlot(item);
        if (slot) {
          const capacity = SLOT_CAPACITY[slot] || 1;
          const used = inv.reduce((sum, e) => {
            if (e.uid === uid || !e.equipped) return sum;
            const it = items.find(i => i.id === e.itemId);
            return (it && effectiveSlot(it) === slot) ? sum + slotCost(it) : sum;
          }, 0);
          if (used + slotCost(item) > capacity) return inv;
        }
      }
      if (entry.qty > 1) {
        const rest = { ...entry, qty: entry.qty - 1 };
        const equippedCopy = { ...entry, uid: makeUid(), qty: 1, equipped: true };
        return inv.flatMap(e => e.uid === uid ? [rest, equippedCopy] : [e]);
      }
      return inv.map(e => e.uid === uid ? { ...e, equipped: true } : e);
    });
  };

  // Sums every equipped item's flat stat bonuses (ITEM_STAT_FIELDS) into
  // one { key: total } object DerivedStats adds onto its usual formulas
  // — Parry Defense is the one exception: rather than a single manually-
  // designated Parry weapon, it auto-uses the best (highest) Weapon
  // Defense among every currently equipped weapon, floored at 0 so a
  // weapon with a Weapon Defense penalty (e.g. an Improvised Weapon —
  // see customWeaponParry) never makes you worse off than parrying
  // bare-handed. Non-numeric stat
  // values (e.g. Lightfoot Shoes' "[Level]" Speed) are skipped — those
  // still need a human to apply them. A Masterwork item built onto a
  // chosen base item (see base_item_options) also adds the base item's
  // own stats — e.g. Dauntless Wrap on Heavy Armor gets both the
  // enchantment's bonus and Heavy Armor's Physical Resist/penalties —
  // and a weapon enchantment's Weapon Defense falls back to its base
  // weapon's the same way.
  const equipmentBonuses = useMemo(() => {
    const totals = {};
    const addStats = it => ITEM_STAT_FIELDS.forEach(([key]) => {
      const v = it[key];
      if (typeof v === "number") totals[key] = (totals[key] || 0) + v;
    });
    const parryValues = [];
    inventory.forEach(e => {
      if (!e.equipped) return;
      const item = items.find(i => i.id === e.itemId);
      if (!item) return;
      addStats(item);
      const baseItem = e.baseItemId ? items.find(i => i.id === e.baseItemId) : null;
      if (baseItem) addStats(baseItem);
      const wd = item.weapon_defense ?? baseItem?.weapon_defense;
      if (typeof wd === "number") parryValues.push(wd);
    });
    // Custom items — their own manually-entered stats, plus every
    // attached Masterwork power's own stats (see CustomItemTile), plus
    // its own weapon stats' Weapon Defense (customWeaponParry) if any.
    customItems.forEach(c => {
      if (!c.equipped) return;
      ITEM_STAT_FIELDS.forEach(([key]) => {
        const v = c.stats?.[key];
        if (typeof v === "number") totals[key] = (totals[key] || 0) + v;
      });
      (c.powers || []).forEach(p => {
        const power = items.find(i => i.id === p.itemId);
        if (power) addStats(power);
      });
      const wd = customWeaponParry(c.weapon);
      if (typeof wd === "number") parryValues.push(wd);
    });
    totals.parry_defense = (totals.parry_defense || 0) + Math.max(0, ...parryValues);
    return totals;
  }, [inventory, items, customItems]);

  // Sums every known technique's max-Health bonus (Toughened Body/
  // Resolve/Spirit currently) into the same { shallow_health,
  // deep_health } shape DerivedStats' Health block expects — a
  // Duplicate-tagged technique learned more than once naturally counts
  // each copy, since buildEntries already has one entry per copy. Only
  // permanent increases to the *maximum* belong here; techniques that
  // just heal Health during play (Second Wind, Healing Magic, etc. —
  // see the unrelated "Healing" filter flag) aren't tracked as a sheet
  // number at all, since they're one-time effects, not a standing bonus.
  const techniqueHealthBonuses = useMemo(() => {
    const totals = { shallow_health: 0, deep_health: 0 };
    buildEntries.forEach(e => {
      if (typeof e.tech.shallow_health_bonus === "number") totals.shallow_health += e.tech.shallow_health_bonus;
      if (typeof e.tech.deep_health_bonus === "number") totals.deep_health += e.tech.deep_health_bonus;
    });
    return totals;
  }, [buildEntries]);

  // Auto-listed rows for the Attack Workspace — every equipped weapon
  // (Held-slot, or Unarmed's virtual Held slot — see effectiveSlot) that
  // actually has an offensive profile (Accuracy/Damage/Range). A
  // Masterwork weapon enchantment doesn't carry these itself; they come
  // from whichever base weapon it's built onto (see onBaseItemChange),
  // same fallback as InventoryTile's own weaponInfo line. A Shield or a
  // still-unset enchantment has neither and is left off the list.
  // A Thrown weapon (or anything shaped the same way — see
  // parseDualModeWeapon) gets its Accuracy/Range as a { melee, ranged }
  // pair instead of a single value, since it can attack either way;
  // Damage doesn't change with mode, so it stays a single value. Skill
  // isn't shown here (see the Might Requirement/Skill note above
  // AttackWorkspace) — it's still used internally to resolve dual mode
  // and Accuracy's Skill Total, just not carried into the row output.
  // Accuracy is the full attack-roll modifier (relevant Skill Total +
  // the weapon's own flat bonus — see resolveAccuracy), not just the
  // weapon's flat number, same reasoning as Damage's Stat bonus.
  // A custom item with weapon stats (see CustomItemTile) shows up the
  // same way as a real weapon, just resolved through customWeapon* —
  // that's the whole point of building an Improvised Weapon there now
  // instead of picking a dedicated data-file item.
  const equippedWeaponAttacks = useMemo(() => {
    const rows = [];
    inventory.forEach(e => {
      if (!e.equipped) return;
      const item = items.find(i => i.id === e.itemId);
      if (!item || effectiveSlot(item) !== "Held") return;
      const baseItem = e.baseItemId ? items.find(i => i.id === e.baseItemId) : null;
      const accuracy = item.accuracy ?? baseItem?.accuracy;
      const rawDamage = item.damage ?? baseItem?.damage;
      const range = item.range ?? baseItem?.range;
      const skill = item.relevant_skill ?? baseItem?.relevant_skill;
      if (accuracy == null && rawDamage == null && range == null) return;
      const dual = parseDualModeWeapon(range, skill);
      rows.push({
        key: e.uid,
        name: item.name,
        accuracy: dual
          ? {
              melee: resolveAccuracy(accuracy, dual.meleeSkill, statPoints, skillPoints),
              ranged: resolveAccuracy(accuracy, dual.rangedSkill, statPoints, skillPoints),
            }
          : resolveAccuracy(accuracy, skill, statPoints, skillPoints),
        damage: resolveDamage(rawDamage, statPoints),
        range: dual
          ? { melee: dual.meleeRange, ranged: resolveRange(dual.rangedRange, statPoints) }
          : resolveRange(range, statPoints),
        notes: e.attackNote || "",
      });
    });
    customItems.forEach(c => {
      if (!c.equipped || !c.weapon) return;
      const w = c.weapon;
      if (w.accuracy == null && w.damageBase == null && (!w.range)) return;
      rows.push({
        key: c.id,
        name: c.name.trim() || "Custom item",
        accuracy: resolveAccuracy(customWeaponAccuracy(w), w.skill, statPoints, skillPoints),
        damage: customWeaponDamage(w, statPoints),
        range: customWeaponRange(w),
        notes: c.attackNote || "",
      });
    });
    return rows;
  }, [inventory, items, customItems, statPoints, skillPoints]);

  // ── Export build as a .json file download ─────────────────────
  // Includes each copy's notes and Feature-builder choices (by name,
  // so the file stays readable and survives future data updates), plus
  // Stats & Skills and the XP budget.
  function doExport() {
    const payload = {
      charName,
      charConcept,
      xpBudget,
      statPoints,
      skillPoints,
      charNotes,
      noteRows,
      customTechniques: customTechniques.map(c => ({ title: c.title, text: c.text })),
      backgroundType,
      backgrounds: selectedBackgrounds,
      sheetSectionOrder,
      enabledSupplements,
      gold,
      inventory: inventory.map(e => ({
        id: e.itemId, qty: e.qty,
        ...(typeof e.level === "number" ? { level: e.level } : {}),
        ...(e.attackNote ? { attackNote: e.attackNote } : {}),
      })),
      customItems: customItems.map(c => ({
        name: c.name, text: c.text, qty: c.qty, slot: c.slot || "",
        stats: c.stats || {},
        powers: (c.powers || []).map(p => ({ id: p.itemId, ...(p.level != null ? { level: p.level } : {}) })),
        ...(c.weapon ? { weapon: c.weapon } : {}),
        ...(c.attackNote ? { attackNote: c.attackNote } : {}),
      })),
      customMaterials: customMaterials.map(c => ({ name: c.name, level: c.level, types: c.types, qty: c.qty })),
      customAttacks: customAttacks.map(r => ({ name: r.name, accuracy: r.accuracy, damage: r.damage, range: r.range, skill: r.skill, notes: r.notes })),
      exportedAt: new Date().toISOString(),
      techniques: buildEntries.map(e => {
        const cfg = configs[e.uid];
        const out = { id: e.tech.id, name: e.tech.name, xp: entryXP(e) };
        if (cfg) {
          out.level    = cfg.level;
          out.features = Object.entries(cfg.picks)
            .map(([fid, count]) => {
              const name = (techFeaturesById[e.tech.id] || []).find(f => f.id === fid)?.feature_name;
              return name ? { name, count } : null;
            })
            .filter(Boolean);
          if (renames[e.uid]) out.customName = renames[e.uid];
        } else {
          out.level = lvlLabel(e.tech.level_min, e.tech.level_max);
        }
        if (notes[e.uid]) out.note = notes[e.uid];
        return out;
      }),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a    = Object.assign(document.createElement("a"), {
      href:     URL.createObjectURL(blob),
      download: `${(charName || "build").replace(/\s+/g, "-")}.json`,
    });
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ── Import a previously exported .json file ────────────────────
  // Lands in a brand-new character slot and switches to it, same as
  // opening a share link — never overwrites whichever character you
  // had open when you clicked "Import build."
  function doImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const newBuild   = [];
        const newNotes   = {};
        const newConfigs = {};
        const newRenames = {};
        data.techniques.forEach(t => {
          const uid = makeUid();
          newBuild.push({ uid, id: t.id });
          if (t.note) newNotes[uid] = t.note;
          if (Array.isArray(t.features) && typeof t.level === "number") {
            // Supports both the current export shape ({name, count}) and
            // the older one (plain name strings, implicitly count 1).
            const techFeats = techFeaturesById[t.id] || [];
            const picks = {};
            t.features.forEach(entry => {
              const name  = typeof entry === "string" ? entry : entry.name;
              const count = typeof entry === "string" ? 1 : (entry.count || 1);
              const feat  = techFeats.find(f => f.feature_name === name);
              if (feat) picks[feat.id] = count;
            });
            newConfigs[uid] = { level: t.level, picks };
            if (t.customName) newRenames[uid] = t.customName;
          }
        });
        addCharacterSlot({
          build: newBuild,
          notes: newNotes,
          configs: newConfigs,
          renames: newRenames,
          charName:    typeof data.charName === "string" ? data.charName : "",
          charConcept: typeof data.charConcept === "string" ? data.charConcept : "",
          xpBudget:    typeof data.xpBudget === "string" ? data.xpBudget : "75",
          statPoints:  { ...emptyCharacterData().statPoints,  ...(data.statPoints  || {}) },
          skillPoints: { ...emptyCharacterData().skillPoints, ...(data.skillPoints || {}) },
          charNotes:   typeof data.charNotes === "string" ? data.charNotes : "",
          noteRows:    Array.isArray(data.noteRows) ? data.noteRows.map(r => ({ id: makeUid(), text: r.text ?? "" })) : [],
          customTechniques: Array.isArray(data.customTechniques)
            ? data.customTechniques.map(c => ({ id: makeUid(), title: c.title ?? "", text: c.text ?? "" }))
            : [],
          backgroundType: data.backgroundType === "Wildfolk" ? "Wildfolk" : "Settler",
          selectedBackgrounds: Array.isArray(data.backgrounds) ? data.backgrounds.filter(id => typeof id === "string") : [],
          sheetSectionOrder: Array.isArray(data.sheetSectionOrder)
              && data.sheetSectionOrder.length === 2
              && ["backgrounds", "techniques"].every(k => data.sheetSectionOrder.includes(k))
            ? data.sheetSectionOrder
            : ["backgrounds", "techniques"],
          enabledSupplements: Array.isArray(data.enabledSupplements)
            ? data.enabledSupplements.filter(s => typeof s === "string")
            : ["Base Game"],
          gold: typeof data.gold === "string" ? data.gold : "",
          inventory: Array.isArray(data.inventory)
            ? data.inventory.filter(e => e && typeof e.id === "string").map(e => ({
                uid: makeUid(), itemId: e.id, qty: Number(e.qty) > 0 ? Number(e.qty) : 1,
                ...(typeof e.level === "number" ? { level: e.level } : {}),
                ...(typeof e.attackNote === "string" ? { attackNote: e.attackNote } : {}),
              }))
            : [],
          customItems: Array.isArray(data.customItems)
            ? data.customItems.map(c => {
                const stats = {};
                if (c.stats && typeof c.stats === "object") {
                  ITEM_STAT_FIELDS.forEach(([key]) => {
                    if (typeof c.stats[key] === "number") stats[key] = c.stats[key];
                  });
                }
                const powers = Array.isArray(c.powers)
                  ? c.powers
                      .filter(p => p && typeof p.id === "string" && items.some(i => i.id === p.id))
                      .map(p => ({ id: makeUid(), itemId: p.id, ...(typeof p.level === "number" ? { level: p.level } : {}) }))
                  : [];
                const weapon = (c.weapon && typeof c.weapon === "object") ? {
                  accuracy: typeof c.weapon.accuracy === "number" ? c.weapon.accuracy : null,
                  damageBase: typeof c.weapon.damageBase === "number" ? c.weapon.damageBase : null,
                  damageStat: STATS.includes(c.weapon.damageStat) ? c.weapon.damageStat : null,
                  damageType: typeof c.weapon.damageType === "string" ? c.weapon.damageType : "Physical",
                  range: typeof c.weapon.range === "string" ? c.weapon.range : "",
                  skill: typeof c.weapon.skill === "string" ? c.weapon.skill : "",
                  weaponDefense: typeof c.weapon.weaponDefense === "number" ? c.weapon.weaponDefense : null,
                  improvised: !!c.weapon.improvised,
                } : null;
                return {
                  id: makeUid(), name: c.name ?? "", text: c.text ?? "", qty: Number(c.qty) > 0 ? Number(c.qty) : 1,
                  slot: typeof c.slot === "string" && ITEM_SLOTS.includes(c.slot) ? c.slot : "",
                  equipped: false, stats, powers, weapon,
                  ...(typeof c.attackNote === "string" ? { attackNote: c.attackNote } : {}),
                };
              })
            : [],
          customMaterials: Array.isArray(data.customMaterials)
            ? data.customMaterials.map(c => ({
                id: makeUid(), name: c.name ?? "",
                level: Math.min(5, Math.max(1, Number(c.level) > 0 ? Number(c.level) : 1)),
                types: Array.isArray(c.types) ? c.types.filter(t => MATERIAL_TYPES.includes(t)) : [],
                qty: Number(c.qty) > 0 ? Number(c.qty) : 1,
              }))
            : [],
          customAttacks: Array.isArray(data.customAttacks)
            ? data.customAttacks.map(r => ({
                id: makeUid(),
                name: typeof r.name === "string" ? r.name : "",
                accuracy: typeof r.accuracy === "string" ? r.accuracy : "",
                damage: typeof r.damage === "string" ? r.damage : "",
                range: typeof r.range === "string" ? r.range : "",
                skill: typeof r.skill === "string" ? r.skill : "",
                notes: typeof r.notes === "string" ? r.notes : "",
              }))
            : [],
        });
      } catch {
        alert("Couldn't read that file — make sure it's a FlagonQuest build export.");
      }
    };
    reader.readAsText(file);
    e.target.value = ""; // reset so the same file can be imported again
  }

  // ── Backup / restore every character slot at once ───────────────
  // Everything lives in localStorage only — there's no account or
  // server copy — so clearing browser data or switching devices would
  // otherwise lose every character with no way back. This is a raw
  // round-trip of each slot's save data (not the human-readable single-
  // character export above), meant only for restoring into this same
  // app, so it skips all the field-by-field validation doImport does.
  function doExportAll() {
    const payload = {
      flagonquestBackup: true,
      exportedAt: new Date().toISOString(),
      characters: characters.map(c => ({
        name: c.name,
        data: c.id === activeId ? currentCharacterData() : loadCharacterData(c.id),
      })),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a    = Object.assign(document.createElement("a"), {
      href:     URL.createObjectURL(blob),
      download: "flagonquest-all-characters.json",
    });
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // Restores every character from a doExportAll() file — each one lands
  // in its own brand-new slot (never overwriting what's currently open),
  // same "always additive" rule as a single-character import.
  function doImportAll(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        const list = Array.isArray(parsed.characters) ? parsed.characters : null;
        if (!list || list.length === 0) throw new Error("no characters in file");
        list.forEach(entry => {
          const data = { ...emptyCharacterData(), ...(entry && entry.data) };
          addCharacterSlot(data);
        });
      } catch {
        alert("Couldn't read that file — make sure it's a FlagonQuest \"backup all\" file.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  // ── Generate a shareable URL ───────────────────────────────────
  // Encodes the build's technique IDs, character name, and Stats &
  // Skills into the URL hash — notes/Feature choices are left out to
  // keep the link short.
  function doShare() {
    const encoded = encBuild({ ids: build.map(e => e.id), name: charName, stats: statPoints, skills: skillPoints });
    const url = window.location.href.split("#")[0] + "#build=" + encoded;
    // Put the link in the address bar first — this always succeeds, so the
    // fallback message below is guaranteed true even if clipboard access
    // is blocked (common on non-secure origins or restrictive browsers).
    window.history.replaceState(null, "", url);

    const legacyCopy = () => {
      const ta = document.createElement("textarea");
      ta.value = url;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch { ok = false; }
      document.body.removeChild(ta);
      return ok;
    };

    (navigator.clipboard?.writeText(url) ?? Promise.reject())
      .catch(() => { if (!legacyCopy()) throw new Error("copy failed"); })
      .then(() => setShareMsg("Link copied!"))
      .catch(() => setShareMsg("Link ready in your address bar — copy it from there"));
    setTimeout(() => setShareMsg(""), 4500);
  }

  // ── Style helpers ──────────────────────────────────────────────
  const tabStyle = key => ({
    padding: "6px 14px", fontSize: 15, fontWeight: 500, borderRadius: 6,
    background:  view === key ? "#d4a843" : "transparent",
    color:       view === key ? "#0a0e18" : TEXT.muted,
    border: `0.5px solid ${view === key ? "#d4a843" : "#2d3555"}`,
    transition: "all 0.15s",
  });

  // A cooler, book-ish blue instead of the app's amber tab color, and set
  // off from the other tabs by a divider — it leaves the app (opens the
  // rulebook in a new tab), so it reads as a different kind of link.
  const rulebookLinkStyle = {
    padding: "6px 14px", fontSize: 15, fontWeight: 500, borderRadius: 6,
    background: "#0f2230", color: "#7fb8d9",
    border: "0.5px solid #3d6a8a",
    textDecoration: "none", display: "inline-flex", alignItems: "center",
    transition: "all 0.15s",
  };

  // Shared look for the toggle-able chip buttons in Advanced filters
  // (Related skills, Tags) — active chips light up gold.
  const filterChipStyle = active => ({
    padding: "3px 10px", fontSize: 13, borderRadius: 20,
    fontWeight: active ? 500 : 400,
    whiteSpace: "nowrap",
    background: active ? "#d4a84322" : "transparent",
    color:      active ? "#d4a843" : TEXT.muted,
    border: `0.5px solid ${active ? "#d4a843" : "#2d3555"}`,
  });

  const actionBtn = (danger = false) => ({
    padding: "6px 14px", fontSize: 14, fontWeight: 500, borderRadius: 6,
    background: "transparent",
    color:  danger ? "#c0392b" : TEXT.muted,
    border: `0.5px solid ${danger ? "#c0392b" : "#2d3555"}`,
    display: "flex", alignItems: "center", gap: 5,
  });

  // Renders one TechCard, wired up to the live build/notes/configs state.
  // Shared by Browse (every matching technique) and the Character Sheet
  // (only techniques you actually know) so both stay pixel-for-pixel
  // the same card, with the same Add/Edit/Notes/Feature-builder controls.
  const renderTechCard = (t, readOnly = false) => {
    const instanceUids = build.filter(e => e.id === t.id).map(e => e.uid);
    return (
      <TechCard
        key={t.id}
        tech={t}
        instances={instanceUids}
        techFeatures={techFeaturesById[t.id] || []}
        notes={notes}
        onNoteChange={setNote}
        configs={configs}
        onSaveConfig={saveConfig}
        onDuplicateInstance={duplicateInstance}
        onAdd={addTech}
        onRemove={removeTech}
        onRemoveInstance={removeInstance}
        renames={renames}
        onRenameChange={setRename}
        expended={expended}
        onExpendedChange={setExpendedFor}
        glossary={glossary}
        readOnly={readOnly}
      />
    );
  };

  // Every technique currently in the build, deduped, in the order each
  // was first added — what the Builder tab renders (one merged card per
  // technique, so every build of it can be reviewed/edited together).
  const knownTechs = useMemo(() => {
    const seen = new Set();
    const list = [];
    build.forEach(({ id }) => {
      if (seen.has(id)) return;
      seen.add(id);
      const t = techniques.find(tt => tt.id === id);
      if (t) list.push(t);
    });
    return list;
  }, [build, techniques]);

  // What the read-only Character Sheet renders: one card per *distinct
  // build*, not per technique — but only for genuinely Feature-built
  // techniques (tech.features). Those get the full treatment: renamed,
  // split into their own card per distinct level+picks, so a Battle
  // Maneuver built two different ways shows up as two separate
  // technique-shaped tiles. Everything else that just needs the level
  // picker without Features data — a Buildable/Duplicate technique like
  // Temper Soulblade — stays a single merged card like any other plain
  // repeatable technique: one "(known N×)" badge, no rename, no per-copy
  // level shown (that distinction lives in each copy's own Notes entry
  // instead, same as it always has). Order follows first appearance in
  // `build`.
  const sheetCards = useMemo(() => {
    const cards = [];
    const index = {};
    build.forEach(({ uid, id }) => {
      const tech = techniques.find(t => t.id === id);
      if (!tech) return;
      let key, cfg = null;
      if (tech.features) {
        cfg = configs[uid] ?? null;
        // Grouping is always by the actual build (level + picks, order-
        // independent so click order doesn't matter) — a rename is just a
        // cosmetic label for that group, never the grouping key itself.
        // Otherwise renaming a copy right before an Upgrade (which keeps
        // the same rename but changes the level) would wrongly merge two
        // genuinely different builds under one badge/level/prereqs.
        key = `${id}::${cfg ? cfg.level + "|" + JSON.stringify(Object.entries(cfg.picks).sort()) : uid}`;
      } else {
        key = id;
      }
      if (key in index) {
        const card = cards[index[key]];
        card.uids.push(uid);
        if (!card.name && renames[uid]) card.name = renames[uid].trim() || null;
      } else {
        const rn = tech.features ? (renames[uid] || "").trim() : "";
        index[key] = cards.length;
        cards.push({ tech, name: rn || null, cfg, uids: [uid] });
      }
    });
    return cards;
  }, [build, techniques, configs, renames]);

  const renderSheetCard = card => (
    <TechCard
      key={`${card.tech.id}-${card.uids[0]}`}
      tech={card.tech}
      instances={card.uids}
      techFeatures={techFeaturesById[card.tech.id] || []}
      notes={notes}
      onNoteChange={setNote}
      configs={configs}
      onSaveConfig={saveConfig}
      onDuplicateInstance={duplicateInstance}
      onAdd={addTech}
      onRemove={removeTech}
      onRemoveInstance={removeInstance}
      renames={renames}
      onRenameChange={setRename}
      expended={expended}
      onExpendedChange={setExpendedFor}
      glossary={glossary}
      readOnly
      group={card.tech.features ? { name: card.name, cfg: card.cfg, uids: card.uids } : null}
      skillTotals={{ statPoints, skillPoints }}
    />
  );

  // ── Loading and error screens ──────────────────────────────────
  if (loading) return (
    <div style={{
      minHeight: "100vh", display:"flex", alignItems:"center",
      justifyContent: "center", background: "#0d1117",
      color: TEXT.faint, fontFamily: "'MedievalSharp', Georgia, serif", fontSize: 18,
    }}>
      Loading FlagonQuest data…
    </div>
  );

  if (loadError) return (
    <div style={{
      minHeight: "100vh", padding: 40, background: "#0d1117",
      color: "#c0392b", fontFamily: "system-ui, sans-serif",
      fontSize: 16, lineHeight: 1.6, maxWidth: 620,
    }}>
      <strong>Couldn't load data files</strong>
      <p style={{ marginTop: 10, color: TEXT.muted }}>
        Error: {loadError}
      </p>
      <p style={{ marginTop: 10, color: TEXT.faint }}>
        If you're testing locally, open a terminal in your repo folder and run:
        <br />
        <code style={{ color:"#d4a843" }}>python -m http.server 8000</code>
        <br />
        Then visit <code style={{ color:"#d4a843" }}>localhost:8000</code> instead of
        opening the HTML file directly.
      </p>
    </div>
  );

  // ── Main render ────────────────────────────────────────────────
  return (
    <div style={{ fontFamily:"system-ui, -apple-system, sans-serif", color:"#e8dfc8" }}>

      {/* ════════ HEADER ════════════════════════════════════════ */}
      <div className="no-print site-header" style={{
        padding: "12px 20px",
        borderBottom: "0.5px solid #2d3555",
        background: "#0a0e18",
      }}>
        <div className="site-header-brand" style={{ textAlign: "center" }}>
          <div style={{
            fontFamily: "'MedievalSharp', Georgia, serif",
            fontSize: 22, fontWeight: "bold",
            color: "#d4a843", letterSpacing: "0.04em",
          }}>
            FlagonQuest
          </div>
          <div style={{ fontSize:13, color:TEXT.faint, marginTop:1 }}>
            A beer-and-pretzels TTRPG for the modern gamer
          </div>
        </div>

        {/* Character switcher — localStorage can hold more than one
            character (see CHARACTER SLOTS above App()); this picks
            which one is active. New/imported/shared characters always
            land in a fresh slot, never overwrite whichever one is open
            here. */}
        <div className="site-header-left" style={{ display:"flex", alignItems:"center", gap:6 }}>
          <select
            value={activeId}
            onChange={e => switchCharacter(e.target.value)}
            style={{
              background: "#1e2435", border: "0.5px solid #2d3555", borderRadius: 6,
              color: TEXT.body, fontSize: 14, padding: "6px 8px", fontFamily: "inherit",
              maxWidth: 160,
            }}
          >
            {characters.map(c => (
              <option key={c.id} value={c.id}>{c.name || "Unnamed hero"}</option>
            ))}
          </select>
          <button
            onClick={() => addCharacterSlot({}, { switchView: "build" })}
            title="New character"
            style={actionBtn()}
          >
            + New
          </button>
          <button
            onClick={duplicateCharacter}
            title="Duplicate this character into a new slot"
            style={actionBtn()}
          >
            Duplicate
          </button>
          {characters.length > 1 && (
            <button
