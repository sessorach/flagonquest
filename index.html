              onClick={() => { if (confirm(`Delete "${charName || "Unnamed hero"}"? This can't be undone.`)) deleteCharacter(activeId); }}
              title="Delete this character"
              style={actionBtn(true)}
            >
              Delete
            </button>
          )}
        </div>

        {/* Tab navigation */}
        <div className="site-header-nav" style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
          <button onClick={() => setView("build")} style={tabStyle("build")}>
            Builder
          </button>
          <button onClick={() => setView("browse")} style={tabStyle("browse")}>
            Techniques
          </button>
          <button onClick={() => setView("items")} style={tabStyle("items")}>
            Items
          </button>
          <button onClick={() => setView("sheet")} style={tabStyle("sheet")}>
            Character sheet
          </button>
          <button onClick={() => setView("notes")} style={tabStyle("notes")}>
            Notes
          </button>

          {/* Divider + Rulebook + Glossary grouped into their own flex
              item, so the pair wraps to the next line as a unit instead
              of splitting — Glossary alone left stranded on its own
              line if there wasn't quite enough room for both. */}
          <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
            <div style={{ width:56, display:"flex", justifyContent:"center", alignItems:"center", flexShrink:0 }} aria-hidden="true">
              <div style={{ width:1, height:22, background:"#2d3555" }} />
            </div>

            <a
              href="rulebook.html"
              target="_blank"
              rel="noopener noreferrer"
              className="rulebook-link"
              style={rulebookLinkStyle}
            >
              Rulebook
            </a>
            <a
              href="glossary.html"
              target="_blank"
              rel="noopener noreferrer"
              className="rulebook-link"
              style={rulebookLinkStyle}
            >
              Glossary
            </a>
          </div>
        </div>
      </div>


      {/* ════════ BROWSE VIEW ═══════════════════════════════════ */}
      {view === "browse" && (
        <div style={{ padding: 16 }}>

          {/* Search bar + advanced filters toggle */}
          <div style={{
            display: "flex", gap: 10, marginBottom: 10,
            flexWrap: "wrap", alignItems: "center",
          }}>
            <input
              type="text"
              placeholder="Search everything — name, tags, cost, effects…"
              value={search}
              onChange={e => setSearch(e.target.value)}
              style={{ flex:"1 1 200px", minWidth:150 }}
            />
            <button onClick={() => setAdvancedOpen(o => !o)} style={actionBtn()}>
              {advancedOpen ? "▲" : "▼"} Advanced
            </button>
          </div>

          {/* Advanced filters — level range, healing, card use, related skills, tags */}
          {advancedOpen && (
            <div style={{
              display: "flex", flexDirection: "column", gap: 12,
              fontSize: 14, color: TEXT.muted,
              background: "#12161f", border: "0.5px solid #2d3555",
              borderRadius: 8, padding: "10px 14px", marginBottom: 12,
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 18, flexWrap: "wrap" }}>
                {/* Level range controls */}
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ color:"#d4a843", fontWeight:500 }}>
                    Lv {levelMin}–{levelMax}
                  </span>
                  <input
                    type="range" min={1} max={5} value={levelMin}
                    onChange={e => setLevelMin(Math.min(+e.target.value, levelMax))}
                    style={{ width: 60 }}
                  />
                  <input
                    type="range" min={1} max={5} value={levelMax}
                    onChange={e => setLevelMax(Math.max(+e.target.value, levelMin))}
                    style={{ width: 60 }}
                  />
                </div>
                <label style={{ display:"flex", alignItems:"center", gap:4, cursor:"pointer" }}>
                  <input
                    type="checkbox"
                    checked={healingOnly}
                    onChange={e => setHealingOnly(e.target.checked)}
                  />
                  Healing
                </label>
                <label style={{ display:"flex", alignItems:"center", gap:4, cursor:"pointer" }}>
                  <input
                    type="checkbox"
                    checked={cardsOnly}
                    onChange={e => setCardsOnly(e.target.checked)}
                  />
                  Uses cards
                </label>
              </div>

              {/* Related skills — click to toggle; matches techniques with ANY selected skill */}
              {allSkills.length > 0 && (
                <div>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                    <span style={{ color:TEXT.faint }}>Related skills</span>
                    {skillFilter.length > 0 && (
                      <button
                        onClick={() => setSkillFilter([])}
                        style={{ background:"transparent", border:"none", color:"#c0392b", fontSize:13, padding:0 }}
                      >
                        Clear
                      </button>
                    )}
                  </div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                    {allSkills.map(skill => (
                      <button key={skill} onClick={() => toggleSkill(skill)} style={filterChipStyle(skillFilter.includes(skill))}>
                        {skill}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Tags — click to toggle; matches techniques with ANY selected tag */}
              {allTags.length > 0 && (
                <div>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                    <span style={{ color:TEXT.faint }}>Tags</span>
                    {tagFilter.length > 0 && (
                      <button
                        onClick={() => setTagFilter([])}
                        style={{ background:"transparent", border:"none", color:"#c0392b", fontSize:13, padding:0 }}
                      >
                        Clear
                      </button>
                    )}
                  </div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                    {allTags.map(tag => (
                      <button key={tag} onClick={() => toggleTag(tag)} style={filterChipStyle(tagFilter.includes(tag))}>
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Result count */}
          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:12 }}>
            {visible.length} technique{visible.length !== 1 ? "s" : ""}
            {search || skillFilter.length > 0 || tagFilter.length > 0 ? " matching filters" : " total"}
          </div>

          {/* List (left) + sticky build panel (right on wide screens) */}
          <div className="browse-layout">
            <div className="tech-list">
              {visible.length === 0 ? (
                <div style={{
                  textAlign:"center",
                  padding: "60px 20px", color:TEXT.faint, fontSize:16,
                }}>
                  No techniques match those filters.
                </div>
              ) : visible.map(t => renderTechCard(t))}
            </div>

            <div className="browse-build-panel">
              <BuildPanel
                buildRows={buildRows}
                knownXP={knownXP} unknownCount={unknownCount} totalXP={totalXP}
                notes={notes} configs={configs} techFeaturesById={techFeaturesById}
                addTech={addTech} removeTech={removeTech}
                removeInstance={removeInstance} duplicateInstance={duplicateInstance}
              />
            </div>
          </div>
        </div>
      )}


      {/* ════════ BUILDER VIEW ══════════════════════════════════ */}
      {view === "build" && (
        <div style={{ maxWidth:1160, margin:"0 auto", padding:20 }}>

          {/* Character name */}
          <div style={{ marginBottom:14 }}>
            <div style={{
              fontSize: 13, color: TEXT.faint, marginBottom: 6,
              textTransform: "uppercase", letterSpacing: "0.07em",
            }}>
              Character name
            </div>
            <input
              type="text"
              placeholder="Enter a name…"
              value={charName}
              onChange={e => setCharName(e.target.value)}
              style={{ width:"100%", maxWidth:360, fontFamily:"'MedievalSharp', Georgia, serif", fontSize:17 }}
            />
          </div>

          {/* Character concept — a short line shown in smaller text under
              the name, on this tab and on the Character Sheet */}
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize: 12, color: TEXT.faint, marginBottom: 5 }}>
              Concept
            </div>
            <input
              type="text"
              placeholder="A one-line concept — “disgraced knight turned bartender”…"
              value={charConcept}
              onChange={e => setCharConcept(e.target.value)}
              style={{ width:"100%", maxWidth:360, fontSize:13 }}
            />
          </div>

          {/* Whole-build actions */}
          <div style={{ display:"flex", gap:8, marginBottom:24, flexWrap:"wrap", alignItems:"center" }}>
            <button onClick={doExport} style={actionBtn()}>
              <i className="ti ti-download" aria-hidden="true" /> Export build
            </button>
            <button onClick={() => importRef.current.click()} style={actionBtn()}>
              <i className="ti ti-upload" aria-hidden="true" /> Import build
            </button>
            <input ref={importRef} type="file" accept=".json" onChange={doImport} style={{ display:"none" }} />
            <button onClick={doShare} style={actionBtn()}>
              <i className="ti ti-link" aria-hidden="true" /> Copy share link
            </button>
            {build.length > 0 && (
              <button onClick={clearBuild} style={actionBtn(true)}>Clear build</button>
            )}
            {shareMsg && (
              <span style={{ fontSize:14, color:"#d4a843" }}>{shareMsg}</span>
            )}
          </div>

          {/* All-characters backup — everything lives in this browser's
              localStorage only, so clearing browser data or switching
              devices loses every character with no way back unless it's
              backed up like this first. Separate from Export/Import
              build above, which is just the one active character. */}
          <div style={{ marginBottom:24 }}>
            <div style={{ fontSize:13, color:TEXT.faint, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.07em" }}>
              All characters
            </div>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
              <button onClick={doExportAll} style={actionBtn()}>
                <i className="ti ti-download" aria-hidden="true" /> Backup all characters
              </button>
              <button onClick={() => importAllRef.current.click()} style={actionBtn()}>
                <i className="ti ti-upload" aria-hidden="true" /> Restore all characters
              </button>
              <input ref={importAllRef} type="file" accept=".json" onChange={doImportAll} style={{ display:"none" }} />
            </div>
            <div style={{ fontSize:12, color:TEXT.faint, marginTop:6 }}>
              Every character is stored only in this browser — back them all up to a file before clearing browser data or switching devices. Restoring adds each one as a new character rather than overwriting anything.
            </div>
          </div>

          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.07em" }}>
            Sources
          </div>
          <SourcesSection
            supplements={allSupplements}
            enabledSupplements={enabledSupplements}
            onToggle={toggleSupplement}
          />
          <div style={{ height:24 }} />

          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.07em" }}>
            Stats &amp; Skills
          </div>
          <StatsPanel
            statPoints={statPoints} skillPoints={skillPoints}
            onStatChange={setStat} onSkillChange={setSkill}
            xpBudget={xpBudget} onBudgetChange={setXpBudget}
            statSkillXP={statSkillXP}
            techniqueXP={knownXP} techniqueXPUnknown={unknownCount > 0}
          />
          <div style={{ height:24 }} />

          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.07em" }}>
            Background
          </div>
          <BackgroundsSection
            backgrounds={backgrounds}
            backgroundType={backgroundType} onBackgroundTypeChange={setBackgroundType}
            selectedIds={selectedBackgrounds} onToggle={toggleBackground} onMove={moveBackground}
            dragId={dragId} setDragId={setDragId}
            enabledSupplements={enabledSupplements}
          />
          <div style={{ height:24 }} />

          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.07em" }}>
            Techniques
          </div>
          <XPTiles knownXP={knownXP} unknownCount={unknownCount} totalXP={totalXP} />
          {knownTechs.length === 0 ? (
            <div style={{ textAlign:"center", padding:"32px 16px", color:TEXT.faint, fontSize:15 }}>
              No techniques added yet — head to Techniques to pick some.
            </div>
          ) : (
            <div className="tech-list">
              {/* Drag the grip to reorder — the handle is the only
                  draggable bit, so it doesn't fight with buttons/inputs
                  inside the card itself. Dropping anywhere on a card
                  (not just its handle) works, to make targeting easier. */}
              {knownTechs.map(t => (
                <div
                  key={t.id}
                  onDragOver={e => { if (dragId) e.preventDefault(); }}
                  onDrop={e => { e.preventDefault(); if (dragId) moveTechniqueGroup(dragId, t.id); setDragId(null); }}
                  style={{ display:"flex", gap:6, alignItems:"stretch", opacity: dragId === t.id ? 0.5 : 1 }}
                >
                  <div
                    draggable
                    onDragStart={e => { e.dataTransfer.effectAllowed = "move"; setDragId(t.id); }}
                    onDragEnd={() => setDragId(null)}
                    title="Drag to reorder"
                    aria-label={`Drag to reorder ${t.name}`}
                    style={{
                      display:"flex", alignItems:"center", justifyContent:"center",
                      width:22, flexShrink:0, cursor:"grab", color:TEXT.faint, fontSize:16,
                      userSelect:"none",
                    }}
                  >
                    ⠿
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    {renderTechCard(t)}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Custom techniques — freeform GM-granted abilities, kept
              separate from knownTechs/build since they're not real
              data-file techniques and never cost XP. Same drag-to-reorder
              handle as real techniques above, just reordering their own
              separate list instead of build. */}
          {customTechniques.length > 0 && (
            <div className="tech-list" style={{ marginTop: 10 }}>
              {customTechniques.map(c => (
                <div
                  key={c.id}
                  onDragOver={e => { if (dragId) e.preventDefault(); }}
                  onDrop={e => { e.preventDefault(); if (dragId) moveCustomTechnique(dragId, c.id); setDragId(null); }}
                  style={{ display:"flex", gap:6, alignItems:"stretch", opacity: dragId === c.id ? 0.5 : 1 }}
                >
                  <div
                    draggable
                    onDragStart={e => { e.dataTransfer.effectAllowed = "move"; setDragId(c.id); }}
                    onDragEnd={() => setDragId(null)}
                    title="Drag to reorder"
                    aria-label={`Drag to reorder ${c.title || "custom technique"}`}
                    style={{
                      display:"flex", alignItems:"center", justifyContent:"center",
                      width:22, flexShrink:0, cursor:"grab", color:TEXT.faint, fontSize:16,
                      userSelect:"none",
                    }}
                  >
                    ⠿
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <CustomTechniqueCard
                      tech={c}
                      onTitleChange={v => updateCustomTechnique(c.id, "title", v)}
                      onTextChange={v => updateCustomTechnique(c.id, "text", v)}
                      onRemove={() => removeCustomTechnique(c.id)}
                    />
                  </div>
                </div>
              ))}
            </div>
          )}
          <button
            onClick={addCustomTechnique}
            style={{ marginTop: 10, ...actionBtn() }}
          >
            + Add custom technique
          </button>
        </div>
      )}


      {/* ════════ ITEMS VIEW ════════════════════════════════════
          Gold and the item picker/inventory live here, not the Builder
          — the Character Sheet shows the same inventory read-only, plus
          Equipped controls (see the Sheet view below). Parry Defense is
          computed automatically from whatever's equipped there, no
          manual picker needed. */}
      {view === "items" && (
        <div style={{ maxWidth:1160, margin:"0 auto", padding:20 }}>
          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.07em" }}>
            Inventory
          </div>
          <InventorySection
            items={items} inventory={inventory} gold={gold} onGoldChange={setGold}
            onAdd={addInventoryItem} onQtyChange={setInventoryQty} onRemove={removeInventoryItem}
            onLevelChange={setInventoryLevel} onBaseItemChange={setInventoryBaseItem}
            customItems={customItems} onAddCustomItem={addCustomItem}
            onUpdateCustomItem={updateCustomItem} onRemoveCustomItem={removeCustomItem}
            onAddCustomItemStat={addCustomItemStat} onCustomItemStatChange={customItemStatChange}
            onRemoveCustomItemStat={removeCustomItemStat} onAddCustomItemPower={addCustomItemPower}
            onCustomItemPowerLevelChange={customItemPowerLevelChange} onRemoveCustomItemPower={removeCustomItemPower}
            onAddCustomItemWeapon={addCustomItemWeapon} onRemoveCustomItemWeapon={removeCustomItemWeapon}
            onCustomItemWeaponChange={customItemWeaponChange} statPoints={statPoints} skillPoints={skillPoints}
            enabledSupplements={enabledSupplements}
            dragId={dragId} setDragId={setDragId}
            onMoveInventoryItem={moveInventoryItem} onMoveCustomItem={moveCustomItem}
            customMaterials={customMaterials} onAddCustomMaterial={addCustomMaterial}
            onUpdateCustomMaterial={updateCustomMaterial} onToggleCustomMaterialType={toggleCustomMaterialType}
            onRemoveCustomMaterial={removeCustomMaterial}
          />
        </div>
      )}


      {/* ════════ CHARACTER SHEET VIEW ══════════════════════════
          A flat, read-only record of everything picked on the
          Builder: Stats & Skills, derived combat numbers, and the
          same technique tiles as everywhere else, but with every
          editable control (notes, Feature-builder, Add/Remove)
          stripped out — nothing on this page changes anything. */}
      {view === "sheet" && (
        <div className="sheet-page" style={{ maxWidth:1160, margin:"0 auto", padding:16 }}>
          {/* Character name + summary header */}
          <div className="sheet-header" style={{
            display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12,
            flexWrap: "wrap",
            borderBottom: "0.5px solid #2d3555",
            paddingBottom: 14, marginBottom: 20,
          }}>
            {/* On screen this is just a plain flex group, same as always —
                the "sheet-box" class only picks up a border in print (see
                the @media print rules), so the name/icon/concept reads as
                its own boxed block on the printed page without changing
                anything here on screen. */}
            <div className="sheet-box" style={{ display:"flex", alignItems:"flex-start", gap:12 }}>
              <img
                src="assets/mug-icon.png"
                alt=""
                style={{ height:54, width:"auto", flexShrink:0 }}
              />
              <div>
                <div style={{
                  fontFamily: "'MedievalSharp', Georgia, serif",
                  fontSize: 28, fontWeight: "bold", color: "#d4a843",
                }}>
                  {charName || "Unnamed hero"}
                </div>
                {charConcept && (
                  <div style={{ fontSize:14, color:TEXT.muted, fontStyle:"italic", marginTop:3 }}>
                    {charConcept}
                  </div>
                )}
                {unknownCount > 0 && (
                  <div style={{ fontSize:15, color:TEXT.faint, marginTop:5 }}>
                    {unknownCount} technique{unknownCount > 1 ? "s" : ""} not fully configured
                  </div>
                )}
              </div>
            </div>

            {/* Print-only — hidden on screen (the StatsPanel bar below
                already shows this number there); on the printed page it's
                the compact stand-in for that whole bar, boxed on its own
                to the right of the name/concept box. */}
            <div className="sheet-box print-only" style={{
              display: "none", flexDirection: "column", alignItems: "center", justifyContent: "center",
              minWidth: 90, textAlign: "center", flexShrink: 0, gap: 2,
            }}>
              <div style={{ fontSize:11, color:TEXT.faint, textTransform:"uppercase", letterSpacing:"0.06em" }}>
                Total XP
              </div>
              <div style={{ fontSize:24, fontWeight:700, color:TEXT.name }}>
                {statSkillXP + knownXP}{unknownCount > 0 ? "+" : ""}
              </div>
            </div>

            <div className="no-print" style={{ display:"flex", gap:8, flexShrink:0, flexWrap:"wrap" }}>
              <button
                onClick={() => { if (confirm("Uncheck all expended techniques for a new encounter?")) setExpended({}); }}
                style={actionBtn()}
              >
                Reset expended
              </button>
              <button onClick={() => window.print()} style={actionBtn()}>
                <i className="ti ti-printer" aria-hidden="true" /> Print / Save as PDF
              </button>
            </div>
          </div>

          <StatsPanel
            statPoints={statPoints} skillPoints={skillPoints}
            xpBudget={xpBudget} onBudgetChange={setXpBudget}
            statSkillXP={statSkillXP}
            techniqueXP={knownXP} techniqueXPUnknown={unknownCount > 0}
            readOnly
          />
          <div style={{ height:14 }} />
          <DerivedStats
            statPoints={statPoints} skillPoints={skillPoints}
            equipmentBonuses={equipmentBonuses} techniqueBonuses={techniqueHealthBonuses}
            currentHealth={currentHealth} onHealthChange={setHealthTrack}
            glossary={glossary}
          />
          <div style={{ height:14 }} />
          <AttackWorkspace
            weaponRows={equippedWeaponAttacks}
            customAttacks={customAttacks}
            onAddCustomAttack={addCustomAttack}
            onUpdateCustomAttack={updateCustomAttack}
            onRemoveCustomAttack={removeCustomAttack}
            onWeaponNoteChange={setWeaponAttackNote}
          />

          {(() => {
            // Backgrounds and Techniques print in whichever order
            // sheetSectionOrder says — drag-reorderable (same dragId
            // used everywhere else) since some players want Backgrounds
            // at the bottom instead of right under the Attack Workspace.
            // Backgrounds drops out entirely (no handle, nothing to
            // drag) when nothing's selected, same as before.
            const sectionLabel = { backgrounds: "Backgrounds", techniques: "Techniques" };
            const sectionContent = {
              backgrounds: selectedBackgrounds.length > 0
                ? <BackgroundsSection backgrounds={backgrounds} selectedIds={selectedBackgrounds} readOnly />
                : null,
              techniques: buildEntries.length === 0 && customTechniques.every(c => !c.title.trim() && !c.text.trim()) ? (
                <div style={{ textAlign:"center", padding:"48px 20px", color:TEXT.faint, fontSize:16 }}>
                  Add techniques on the Techniques tab, then see them here.
                </div>
              ) : (
                <div className="tech-list">
                  {sheetCards.map(renderSheetCard)}
                  {customTechniques.map(c => (
                    <CustomTechniqueCard key={c.id} tech={c} readOnly />
                  ))}
                </div>
              ),
            };
            const orderedKeys = sheetSectionOrder.filter(key => sectionContent[key] != null);
            return orderedKeys.map(key => (
              <div
                key={key}
                onDragOver={e => { if (dragId) e.preventDefault(); }}
                onDrop={e => { e.preventDefault(); if (dragId) moveSheetSection(dragId, key); setDragId(null); }}
                style={{ display: "flex", gap: 6, alignItems: "stretch", opacity: dragId === key ? 0.5 : 1, marginTop: 14 }}
              >
                {orderedKeys.length > 1 && (
                  <div
                    draggable
                    onDragStart={e => { e.dataTransfer.effectAllowed = "move"; setDragId(key); }}
                    onDragEnd={() => setDragId(null)}
                    title="Drag to reorder"
                    aria-label={`Drag to reorder ${sectionLabel[key]}`}
                    className="no-print"
                    style={{
                      display: "flex", alignItems: "flex-start", justifyContent: "center",
                      width: 22, flexShrink: 0, cursor: "grab", color: TEXT.faint, fontSize: 16,
                      userSelect: "none", paddingTop: 8,
                    }}
                  >
                    ⠿
                  </div>
                )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  {sectionContent[key]}
                </div>
              </div>
            ));
          })()}

          {(inventory.length > 0 || gold || customItems.length > 0 || customMaterials.length > 0) && (
            <>
              <div style={{ height:14 }} />
              <InventorySection
                items={items} inventory={inventory} gold={gold} readOnly showEquip
                onToggleEquipped={toggleEquipped}
                customItems={customItems} onToggleCustomItemEquipped={toggleCustomItemEquipped}
                customMaterials={customMaterials}
                statPoints={statPoints} skillPoints={skillPoints}
              />
            </>
          )}
        </div>
      )}


      {/* ════════ NOTES VIEW ═══════════════════════════════════
          A freeform scratchpad that saves with the character — a
          big text box plus a short quick-note list. */}
      {view === "notes" && (
        <div style={{ maxWidth:900, margin:"0 auto", padding:20 }}>
          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.07em" }}>
            Notes
          </div>
          <textarea
            value={charNotes}
            onChange={e => setCharNotes(e.target.value)}
            placeholder="Freeform notes about your character, campaign, plans…"
            rows={10}
            style={{ width:"100%", fontSize:14, lineHeight:1.5, marginBottom:28 }}
          />

          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.07em" }}>
            Quick List
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {noteRows.map(row => (
              <div key={row.id} style={{ display:"flex", gap:8, alignItems:"center" }}>
                <input
                  type="text"
                  value={row.text}
                  onChange={e => updateNoteRow(row.id, e.target.value)}
                  placeholder="Note…"
                  style={{ flex:1, fontSize:14 }}
                />
                <button
                  onClick={() => removeNoteRow(row.id)}
                  aria-label="Remove note"
                  style={{
                    background:"transparent", border:"none",
                    color:TEXT.faint, fontSize:18, lineHeight:1, padding:"2px 4px", flexShrink:0,
                  }}
                >
                  ✕
                </button>
              </div>
            ))}
            <button
              onClick={addNoteRow}
              style={{
                fontSize: 13, color: "#d4a843", background: "transparent",
                border: "0.5px solid #a07c2e", borderRadius: 4,
                padding: "4px 10px", alignSelf: "flex-start",
              }}
            >
              + Add row
            </button>
          </div>
        </div>
      )}

      {/* Attribution — shown on every tab, and (since it's not marked
          no-print) at the bottom of the printed Character Sheet too,
          pinned to the physical page bottom there (see .attribution-footer
          in the print CSS) instead of trailing after the last card. */}
      <div className="attribution-footer" style={{ textAlign: "center", padding: "26px 16px 18px", fontSize: 12, color: TEXT.faint }}>
        FlagonQuest is a project by Friendly Flagon Games.
      </div>

      {/* Undo toast — see offerUndo/performUndo above App's remove*
          handlers. Fixed to the viewport so it stays visible regardless
          of scroll position or which tab is open. */}
      {undoInfo && (
        <div className="no-print" style={{
          position: "fixed", left: "50%", bottom: 20, transform: "translateX(-50%)",
          display: "flex", alignItems: "center", gap: 14,
          background: "#1e2435", border: "0.5px solid #2d3555", borderRadius: 8,
          padding: "10px 16px", boxShadow: "0 4px 16px rgba(0,0,0,0.4)",
          zIndex: 200, fontSize: 14,
        }}>
          <span>{undoInfo.message}</span>
          <button
            onClick={performUndo}
            style={{
              background: "none", border: "none", color: "#d4a843",
              fontSize: 14, fontWeight: "bold", cursor: "pointer", padding: 0,
            }}
          >
            Undo
          </button>
        </div>
      )}

    </div>
  );
}

// Mount the React app onto the <div id="root"> in the HTML above
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
