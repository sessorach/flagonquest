<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlagonQuest</title>

  <!-- Tabler Icons webfont — used for the button icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <!-- MedievalSharp — fantasy display font for names/headings (free, OFL license) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

  <!-- React 18 (the UI framework) and ReactDOM (renders it to the page) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone: lets us write JSX (the HTML-in-JS syntax) directly
       in this file without a build step. Fine for a small group tool. -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ── Reset & base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e8dfc8;
      min-height: 100vh;
    }

    /* ── Inputs ────────────────────────────────────────────────── */
    input[type=text], input[type=search], textarea {
      background: #1e2435;
      border: 0.5px solid #2d3555;
      border-radius: 6px;
      padding: 7px 11px;
      color: #e8dfc8;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type=text]:focus,
    input[type=search]:focus,
    textarea:focus { border-color: #d4a843; }

    input[type=range]    { accent-color: #d4a843; cursor: pointer; }
    input[type=checkbox] { accent-color: #d4a843; cursor: pointer; }

    /* ── Technique list (Browse) ──────────────────────────────────
       Always a single column — cards show full technique text now,
       so multiple columns made them too narrow to read comfortably. */
    .tech-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Browse layout: list + build sidebar ────────────────────────
       Mobile/narrow: just the list. The build panel lives on its own
       "My build" tab, same as before.
       Wide screens: list on the left, a sticky build sidebar on the
       right so you can pick techniques and watch your build fill in
       without switching tabs. */
    .browse-layout { display: block; }
    .browse-build-panel { display: none; }
    @media (min-width: 1000px) {
      .browse-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 20px;
        align-items: start;
      }
      .browse-build-panel {
        display: block;
        position: sticky;
        top: 78px;
        max-height: calc(100vh - 96px);
        overflow-y: auto;
        background: #12161f;
        border: 0.5px solid #2d3555;
        border-radius: 8px;
        padding: 16px;
      }
    }

    /* ── Scrollbar ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3555; border-radius: 4px; }

    /* ── Buttons ───────────────────────────────────────────────── */
    button { font-family: inherit; cursor: pointer; }
    button:hover { opacity: 0.85; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    button:disabled:hover { opacity: 0.5; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/*
 ╔═══════════════════════════════════════════════════════════════════╗
 ║  FLAGONQUEST — Technique Browser & Character Builder             ║
 ║  index.html · Phase 1                                            ║
 ╠═══════════════════════════════════════════════════════════════════╣
 ║  HOW THIS FILE WORKS                                             ║
 ║                                                                   ║
 ║  DATA: On page load, the app fetches two JSON files from the     ║
 ║  data/ folder sitting next to this index.html. Those files are   ║
 ║  generated from your spreadsheet by running scripts/convert.py.  ║
 ║                                                                   ║
 ║  LOCAL TESTING: Browsers block fetch() on file:// URLs. To test  ║
 ║  locally, open a terminal in your repo folder and run:           ║
 ║    python -m http.server 8000                                    ║
 ║  Then visit localhost:8000 in your browser.                      ║
 ║                                                                   ║
 ║  BUILD ENTRIES: `build` is an array of { uid, id } — id is the   ║
 ║  technique ID, uid is a unique ID for that specific *copy* (so   ║
 ║  Duplicate/Encounter techniques can be learned more than once).  ║
 ║  Per-copy data — free-text notes and Feature-builder choices —   ║
 ║  are keyed by uid, not by technique id, in the `notes` /         ║
 ║  `configs` state and persisted to localStorage.                  ║
 ║                                                                   ║
 ║  FILTERING: `visible` is techniques.filter(...), recomputed by   ║
 ║  useMemo() only when a filter changes.                           ║
 ║                                                                   ║
 ║  BUILD ROWS: `buildRows` groups build entries for display — a    ║
 ║  plain repeatable technique collapses into one "×N" row, but a   ║
 ║  technique with its own notes or Feature-builder choices per     ║
 ║  copy (free_text / features) always gets one row per copy, since ║
 ║  those copies aren't interchangeable.                            ║
 ║                                                                   ║
 ║  EXPORT/IMPORT: full fidelity, including notes and Feature        ║
 ║  choices. SHARE LINK: technique list + character name only, to   ║
 ║  keep the URL short — notes/Feature choices don't round-trip.    ║
 ║                                                                   ║
 ║  LAYOUT: on wide screens the Browse tab shows the technique list  ║
 ║  and the build panel side by side (see .browse-layout in the     ║
 ║  <style> block). On narrow screens the build panel is reached     ║
 ║  through its own "My build" tab instead. Both places render the  ║
 ║  same <BuildPanel> component so they never drift apart.          ║
 ╚═══════════════════════════════════════════════════════════════════╝
*/

// ── Text color scale ────────────────────────────────────────────────
// Warm off-white/tan tones instead of blue-grey, so body text stands
// out against the dark blue background instead of blending into it.
// Ordered brightest → dimmest; nothing outranks `name`.
const TEXT = {
  name:  "#e8dfc8",  // technique names — brightest text on the page
  body:  "#d3c9a3",  // readable content: field values, effects text
  label: "#a68f52",  // field labels ("Action:", "Cost:", etc.)
  muted: "#9c9576",  // secondary text: tags, skills, inactive nav
  faint: "#726c58",  // least prominent: prereqs, counts, hints
};

// ── Helpers ────────────────────────────────────────────────────────

// Format level range for display.
// e.g. level_min=1, level_max=4 → "Lv 1–4"  |  level_min=null → "Draft"
function lvlLabel(lMin, lMax) {
  if (lMin == null) return "Draft";
  const hi = lMax ?? lMin;
  return lMin === hi ? `Lv ${lMin}` : `Lv ${lMin}–${hi}`;
}

// Does this technique fall within the current level filter range?
// Drafts (no level yet) always pass — there's no toggle to hide them.
// Two ranges overlap when: techMin <= filterMax AND techMax >= filterMin.
function matchesLevel(t, fMin, fMax) {
  if (t.level_min == null) return true;
  const hi = t.level_max ?? t.level_min;
  return t.level_min <= fMax && hi >= fMin;
}

// XP cost of a technique at a fixed level: level × 3.
// Returns null for drafts or range techniques (e.g. Lv 1–4) where we
// don't know which level was purchased — callers that DO know (a
// Feature-built technique's chosen level) compute level × 3 directly
// instead of calling this.
function techXP(t) {
  if (t.level_min == null) return null;
  if (t.level_min !== t.level_max && t.level_max != null) return null;
  return t.level_min * 3;
}

// Encode/decode build state for shareable URL hash.
// Only the technique ID list + character name — see the file-header
// note on why notes/Feature choices are left out of share links.
function encBuild(ids, name) {
  return btoa(JSON.stringify({ ids, name }));
}
function decBuild(str) {
  try { return JSON.parse(atob(str)); } catch { return null; }
}

// Split a comma-separated string into a trimmed array
function splitCSV(str) {
  if (!str) return [];
  return str.split(",").map(s => s.trim()).filter(Boolean);
}

// A unique ID for one *copy* of a technique in the build, so repeated
// purchases (Duplicate/Encounter) can each carry their own notes or
// Feature-builder choices instead of sharing one blob of data.
function makeUid() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

// Is this a Duplicate/Encounter technique — one that can be learned
// (and added to the build) more than once?
function isRepeatable(tech) {
  const tags = splitCSV(tech.tags);
  return tags.includes("Duplicate") || tags.includes("Encounter");
}

// Parses the "Points: Level 1: 3 basic; Level 2: 6 basic; Level 3: 9
// basic/advanced; ..." sentence that Feature-built techniques carry
// in their Effects text, into { [level]: { points, advanced } }.
// Returns null if the text doesn't match that pattern (so callers can
// fall back to an unlimited/unstructured picker instead of guessing).
function parsePointBudget(effectsText) {
  if (!effectsText) return null;
  const re = /Level\s*(\d+):\s*(\d+)\s*basic(\/advanced)?/gi;
  const map = {};
  let m;
  while ((m = re.exec(effectsText))) {
    map[+m[1]] = { points: +m[2], advanced: !!m[3] };
  }
  return Object.keys(map).length > 0 ? map : null;
}


// ══════════════════════════════════════════════════════════════════
// FEATURE BUILDER — pick a level and a set of Features within that
// level's point budget, for Buildable techniques (Battle Maneuver,
// Healing Magic, etc.) that are assembled from the Features sheet
// instead of having fixed effects.
// ══════════════════════════════════════════════════════════════════
function FeatureBuilder({ tech, features, budgetMap, initial, saveLabel, onSave, onCancel }) {
  const availableLevels = [];
  for (let lv = tech.level_min; lv <= (tech.level_max ?? tech.level_min); lv++) {
    if (!budgetMap || budgetMap[lv]) availableLevels.push(lv);
  }

  const [level, setLevel]           = useState(initial?.level ?? availableLevels[0] ?? tech.level_min);
  const [featureIds, setFeatureIds] = useState(initial?.featureIds ?? []);

  const budget           = budgetMap ? budgetMap[level] : null;
  const points           = budget ? budget.points : null;
  const advancedUnlocked = budget ? budget.advanced : true;

  const basicFeatures    = features.filter(f => f.tier === "Basic");
  const advancedFeatures = features.filter(f => f.tier === "Advanced");

  const spent     = featureIds.reduce((sum, id) => sum + (features.find(f => f.id === id)?.point_cost ?? 0), 0);
  const remaining = points != null ? points - spent : null;
  const overBudget = remaining != null && remaining < 0;

  const toggleFeature = f => setFeatureIds(ids =>
    ids.includes(f.id) ? ids.filter(id => id !== f.id) : [...ids, f.id]
  );

  const featureRow = f => {
    const checked  = featureIds.includes(f.id);
    const disabled = !checked && remaining != null && f.point_cost > remaining;
    return (
      <label key={f.id} style={{
        display: "flex", gap: 8, alignItems: "flex-start",
        opacity: disabled ? 0.45 : 1,
        cursor: disabled ? "not-allowed" : "pointer",
      }}>
        <input
          type="checkbox" checked={checked} disabled={disabled}
          onChange={() => toggleFeature(f)}
          style={{ marginTop: 4, flexShrink: 0 }}
        />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 13, color: TEXT.body }}>
            <strong>{f.feature_name}</strong>
            <span style={{ color: TEXT.faint }}> ({f.point_cost} pt{f.point_cost !== 1 ? "s" : ""})</span>
          </div>
          <div style={{ fontSize: 13, color: TEXT.muted, lineHeight: 1.4 }}>{f.description}</div>
          {f.prereq && (
            <div style={{ fontSize: 12, color: TEXT.faint }}>Requires: {f.prereq}</div>
          )}
        </div>
      </label>
    );
  };

  return (
    <div style={{
      background: "#0d1117", border: "0.5px solid #2d3555", borderRadius: 6,
      padding: "10px 12px", display: "flex", flexDirection: "column", gap: 10,
    }}>
      {/* Level picker + point budget */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, color: TEXT.label, fontWeight: 500 }}>Level</span>
        {availableLevels.map(lv => (
          <button
            key={lv}
            onClick={() => setLevel(lv)}
            style={{
              padding: "2px 10px", fontSize: 13, borderRadius: 4,
              background: lv === level ? "#d4a84322" : "transparent",
              color:      lv === level ? "#d4a843" : TEXT.muted,
              border: `0.5px solid ${lv === level ? "#d4a843" : "#2d3555"}`,
            }}
          >
            {lv}
          </button>
        ))}
        {points != null && (
          <span style={{ fontSize: 13, color: overBudget ? "#c0392b" : TEXT.muted, marginLeft: "auto" }}>
            {spent} / {points} pts{overBudget ? ` — over by ${-remaining}` : ""}
          </span>
        )}
      </div>

      {/* Basic-tier features */}
      {basicFeatures.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <div style={{ fontSize: 12, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em" }}>
            Basic
          </div>
          {basicFeatures.map(featureRow)}
        </div>
      )}

      {/* Advanced-tier features — only once the chosen level unlocks them */}
      {advancedFeatures.length > 0 && (
        advancedUnlocked ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ fontSize: 12, color: TEXT.faint, textTransform: "uppercase", letterSpacing: "0.06em" }}>
              Advanced
            </div>
            {advancedFeatures.map(featureRow)}
          </div>
        ) : (
          <div style={{ fontSize: 12, color: TEXT.faint, fontStyle: "italic" }}>
            Advanced features unlock at a higher level.
          </div>
        )
      )}

      <div style={{ display: "flex", gap: 8 }}>
        <button
          onClick={() => onSave({ level, featureIds })}
          disabled={overBudget}
          style={{
            fontSize: 13, color: overBudget ? TEXT.faint : "#d4a843",
            background: "transparent",
            border: `0.5px solid ${overBudget ? "#2d3555" : "#a07c2e"}`,
            borderRadius: 4, padding: "4px 12px",
          }}
        >
          {saveLabel}
        </button>
        <button onClick={onCancel} style={{
          fontSize: 13, color: TEXT.muted, background: "transparent",
          border: "0.5px solid #2d3555", borderRadius: 4, padding: "4px 12px",
        }}>
          Cancel
        </button>
      </div>
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// FEATURES SECTION — shown on a TechCard instead of the usual Add
// button when the technique is Buildable-from-Features. Lists any
// copies already built (level + chosen features), with Edit/Remove
// and — for repeatable techniques — Duplicate (same features again)
// alongside "+ Build another copy" (pick different features).
// ══════════════════════════════════════════════════════════════════
function FeaturesSection({
  tech, features, instances, configs, repeatable,
  onSaveConfig, onDuplicateInstance, onRemoveInstance,
}) {
  const [builderFor, setBuilderFor] = useState(null); // null | "new" | a uid
  const budgetMap = useMemo(() => parsePointBudget(tech.effects), [tech.effects]);

  const smallBtn = {
    fontSize: 12, color: TEXT.muted, background: "transparent",
    border: "0.5px solid #2d3555", borderRadius: 4, padding: "2px 8px",
  };
  const smallDangerBtn = {
    fontSize: 12, color: "#c0392b", background: "transparent",
    border: "0.5px solid #c0392b", borderRadius: 4, padding: "2px 8px",
  };

  const featureName = id => features.find(f => f.id === id)?.feature_name;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ fontSize: 12, color: TEXT.label, fontWeight: 500 }}>
        Built from Features
      </div>

      {/* Copies already learned */}
      {instances.map((uid, i) => {
        const cfg = configs[uid];
        if (builderFor === uid) {
          return (
            <FeatureBuilder
              key={uid}
              tech={tech}
              features={features}
              budgetMap={budgetMap}
              initial={cfg}
              saveLabel="Save changes"
              onCancel={() => setBuilderFor(null)}
              onSave={next => { onSaveConfig(tech.id, uid, next); setBuilderFor(null); }}
            />
          );
        }
        const names = cfg ? cfg.featureIds.map(featureName).filter(Boolean) : [];
        return (
          <div key={uid} style={{
            background: "#0d1117", border: "0.5px solid #2d3555", borderRadius: 6,
            padding: "8px 10px", display: "flex", flexDirection: "column", gap: 4,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, color: TEXT.body }}>
                {instances.length > 1 ? `Copy ${i + 1} — ` : ""}
                {cfg ? `Level ${cfg.level}` : "Not configured"}
              </span>
              <div style={{ display: "flex", gap: 6 }}>
                {repeatable && cfg && (
                  <button onClick={() => onDuplicateInstance(uid)} style={smallBtn}>Duplicate</button>
                )}
                <button onClick={() => setBuilderFor(uid)} style={smallBtn}>Edit</button>
                <button onClick={() => onRemoveInstance(uid)} style={smallDangerBtn}>Remove</button>
              </div>
            </div>
            {names.length > 0 && (
              <div style={{ fontSize: 12, color: TEXT.muted }}>{names.join(", ")}</div>
            )}
          </div>
        );
      })}

      {/* Build the first copy, or another one with different features */}
      {builderFor === "new" ? (
        <FeatureBuilder
          key="new"
          tech={tech}
          features={features}
          budgetMap={budgetMap}
          initial={null}
          saveLabel="Add to build"
          onCancel={() => setBuilderFor(null)}
          onSave={next => { onSaveConfig(tech.id, null, next); setBuilderFor(null); }}
        />
      ) : (instances.length === 0 || repeatable) && (
        <button
          onClick={() => setBuilderFor("new")}
          style={{
            fontSize: 13, color: "#d4a843", background: "transparent",
            border: "0.5px solid #a07c2e", borderRadius: 4,
            padding: "4px 10px", alignSelf: "flex-start",
          }}
        >
          + Build {instances.length > 0 ? "another copy" : "this technique"}
        </button>
      )}
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// TECHNIQUE CARD — shown in the browse list
// Full detail: tags, description, all mechanical fields, complete
// effects/special text, prereqs, and related skills at the bottom.
// ══════════════════════════════════════════════════════════════════
function TechCard({
  tech, instances, techFeatures,
  notes, onNoteChange,
  configs, onSaveConfig, onDuplicateInstance,
  onAdd, onRemove, onRemoveInstance,
}) {
  const tags   = splitCSV(tech.tags);
  const skills = splitCSV(tech.related_skills);

  // "Encounter" is important enough to live in the corner with the level
  // badge — everything else stays in the tags line.
  const hasEncounter = tags.includes("Encounter");
  const otherTags     = tags.filter(t => t !== "Encounter");

  // Duplicate/Encounter techniques can be learned more than once —
  // each purchase is its own build entry, so "Add to build" stays
  // available instead of flipping straight to "Remove".
  const repeatable = isRepeatable(tech);
  const count = instances.length;

  return (
    <div style={{
      background: "#161b27",
      border: "0.5px solid #2d3555",
      borderRadius: 8,
      padding: "12px 14px",
      display: "flex",
      flexDirection: "column",
      gap: 7,
    }}>

      {/* Name + corner badges — Encounter (if present) sits left of Level,
          Level always stays pinned in the far corner */}
      <div style={{ display:"flex", alignItems:"flex-start", gap:8 }}>
        <span style={{
          fontFamily: "'MedievalSharp', Georgia, serif",
          fontWeight: "bold",
          fontSize: 17,
          color: TEXT.name,
          flex: 1,
          lineHeight: 1.3,
        }}>
          {tech.name}
        </span>
        <div style={{ display:"flex", flexDirection:"row", alignItems:"center", gap:4, flexShrink:0 }}>
          {hasEncounter && (
            <span style={{
              fontSize: 17, fontWeight: 500,
              color: "#e6943a",
              background: "#2a1a00",
              border: "0.5px solid #a0672e",
              borderRadius: 4,
              padding: "1px 8px",
              whiteSpace: "nowrap",
            }}>
              Encounter
            </span>
          )}
          <span style={{
            fontSize: 17, fontWeight: 500,
            color: TEXT.name,
            background: "#24221a",
            border: "0.5px solid #5b5540",
            borderRadius: 4,
            padding: "1px 8px",
            whiteSpace: "nowrap",
          }}>
            {lvlLabel(tech.level_min, tech.level_max)}
          </span>
        </div>
      </div>

      {/* Remaining tags — all in one line */}
      {otherTags.length > 0 && (
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", alignItems:"center" }}>
          {otherTags.map(tag => (
            <span key={tag} style={{
              fontSize: 12,
              color: tag === "Buildable" ? "#7F77DD"
                   : tag === "Duplicate" ? "#1D9E75"
                   : TEXT.muted,
              background: "#0d1117",
              border: "0.5px solid #2d3555",
              borderRadius: 3,
              padding: "1px 5px",
            }}>
              {tag}
            </span>
          ))}
        </div>
      )}

      {/* Fluff description — italic and muted */}
      {tech.description && (
        <div style={{ fontSize:14, color:TEXT.muted, fontStyle:"italic", lineHeight:1.5 }}>
          {tech.description}
        </div>
      )}

      {/* Mechanical fields — condition, action, cost, target — each its own line */}
      {[
        ["Condition", tech.condition],
        ["Action",    tech.action],
        ["Cost",      tech.cost],
        ["Target",    tech.target],
      ].filter(([, v]) => v).map(([label, val]) => (
        <div key={label} style={{ fontSize:14, color:TEXT.body, lineHeight:1.4 }}>
          <span style={{ color:TEXT.label, fontWeight:500 }}>{label}: </span>
          {val}
        </div>
      ))}

      {/* Effects — the main rules text, shown in full */}
      {tech.effects && (
        <div style={{
          fontSize: 14, color: TEXT.body, lineHeight: 1.6,
          whiteSpace: "pre-wrap",  // preserves any line breaks in the text
        }}>
          {tech.effects}
        </div>
      )}

      {/* Built from Features — replaces the plain Add/Remove flow below */}
      {tech.features && (
        <FeaturesSection
          tech={tech}
          features={techFeatures}
          instances={instances}
          configs={configs}
          repeatable={repeatable}
          onSaveConfig={onSaveConfig}
          onDuplicateInstance={onDuplicateInstance}
          onRemoveInstance={onRemoveInstance}
        />
      )}

      {/* Free-text notes — one box per copy in the build, since e.g. each
          Soulblade you learn can choose a different weapon type */}
      {tech.free_text && (
        <div>
          <div style={{ fontSize:12, color:TEXT.label, fontWeight:500, marginBottom:4 }}>
            Notes
          </div>
          {instances.length === 0 ? (
            <div style={{ fontSize:13, color:TEXT.faint, fontStyle:"italic" }}>
              Add this to your build, then note your choices for each copy you learn.
            </div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {instances.map((uid, i) => (
                <div key={uid} style={{ display:"flex", gap:6, alignItems:"flex-start" }}>
                  <textarea
                    value={notes[uid] || ""}
                    onChange={e => onNoteChange(uid, e.target.value)}
                    placeholder={instances.length > 1 ? `Copy ${i + 1} notes…` : "Add your notes…"}
                    rows={2}
                    style={{ flex:1, fontSize:13 }}
                  />
                  {instances.length > 1 && (
                    <button
                      onClick={() => onRemoveInstance(uid)}
                      aria-label={`Remove copy ${i + 1}`}
                      style={{ background:"transparent", border:"none", color:TEXT.faint, fontSize:16, lineHeight:1, padding:"2px 4px" }}
                    >
                      ✕
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Special rules text */}
      {tech.special && (
        <div style={{ fontSize:14, color:TEXT.body, lineHeight:1.5 }}>
          <span style={{ color:TEXT.label, fontWeight:500 }}>Special: </span>
          {tech.special}
        </div>
      )}

      {/* Prerequisites */}
      {tech.prereqs && (
        <div style={{ fontSize:13, color:TEXT.faint, lineHeight:1.4 }}>
          <span style={{ fontWeight:500 }}>Prereqs: </span>
          {tech.prereqs}
        </div>
      )}

      {/* Related skills — faint chips at the very bottom, under prereqs */}
      {skills.length > 0 && (
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", alignItems:"center" }}>
          {skills.map(skill => (
            <span key={skill} style={{
              fontSize: 12,
              color: TEXT.faint,
              border: "0.5px solid #232a3d",
              borderRadius: 3,
              padding: "1px 5px",
            }}>
              {skill}
            </span>
          ))}
        </div>
      )}

      {/* Add / Remove button(s) — Features-built techniques manage this
          themselves above, so this row is skipped for those */}
      {!tech.features && (
        <div style={{ marginTop:2, display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
          {repeatable ? (
            <>
              <button
                onClick={() => onAdd(tech.id)}
                style={{
                  fontSize: 13, color: "#d4a843",
                  background: "transparent",
                  border: "0.5px solid #a07c2e",
                  borderRadius: 4, padding: "2px 10px",
                }}
              >
                + Add to build
              </button>
              {count > 0 && (
                <>
                  <span style={{ fontSize:13, color:TEXT.muted }}>Known ×{count}</span>
                  <button
                    onClick={() => onRemove(tech.id)}
                    style={{
                      fontSize: 13, color: "#c0392b",
                      background: "transparent",
                      border: "0.5px solid #c0392b",
                      borderRadius: 4, padding: "2px 10px",
                    }}
                  >
                    Remove one
                  </button>
                </>
              )}
            </>
          ) : count > 0 ? (
            <button
              onClick={() => onRemove(tech.id)}
              style={{
                fontSize: 13, color: "#c0392b",
                background: "transparent",
                border: "0.5px solid #c0392b",
                borderRadius: 4, padding: "2px 10px",
              }}
            >
              Remove
            </button>
          ) : (
            <button
              onClick={() => onAdd(tech.id)}
              style={{
                fontSize: 13, color: "#d4a843",
                background: "transparent",
                border: "0.5px solid #a07c2e",
                borderRadius: 4, padding: "2px 10px",
              }}
            >
              + Add to build
            </button>
          )}
        </div>
      )}
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// SHEET ENTRY — shown on the Character Sheet tab
// Full detail: description, all mechanical fields, effects, prereqs,
// plus this copy's notes or Feature-builder choices, if any.
// ══════════════════════════════════════════════════════════════════
function SheetEntry({ tech, count = 1, note, config, techFeatures }) {
  const tags = splitCSV(tech.tags);
  const configFeatures = config
    ? config.featureIds.map(id => techFeatures.find(f => f.id === id)).filter(Boolean)
    : [];

  return (
    <div style={{
      borderLeft: "2px solid #2d3555",
      paddingLeft: 14,
      marginBottom: 22,
    }}>

      {/* Name + level badge + quantity + tag list */}
      <div style={{ display:"flex", gap:8, alignItems:"baseline", flexWrap:"wrap", marginBottom:5 }}>
        <span style={{
          fontFamily: "'MedievalSharp', Georgia, serif",
          fontWeight: "bold",
          fontSize: 17,
          color: TEXT.name,
        }}>
          {tech.name}
        </span>
        <span style={{ fontSize:13, color:TEXT.name }}>
          {config ? `Level ${config.level}` : lvlLabel(tech.level_min, tech.level_max)}
        </span>
        {count > 1 && (
          <span style={{ fontSize:13, color:TEXT.muted }}>×{count}</span>
        )}
        {tags.map(tag => (
          <span key={tag} style={{ fontSize:12, color:TEXT.faint }}>[{tag}]</span>
        ))}
      </div>

      {/* Fluff description — italic and muted */}
      {tech.description && (
        <div style={{
          fontSize: 14,
          color: TEXT.muted,
          fontStyle: "italic",
          lineHeight: 1.5,
          marginBottom: 7,
        }}>
          {tech.description}
        </div>
      )}

      {/* Mechanical fields — only render the ones that have a value */}
      {[
        ["Condition", tech.condition],
        ["Action",    tech.action],
        ["Cost",      tech.cost],
        ["Target",    tech.target],
      ].filter(([, v]) => v).map(([label, val]) => (
        <div key={label} style={{ fontSize:15, color:TEXT.body, marginBottom:2, lineHeight:1.4 }}>
          <span style={{ color:TEXT.label, fontWeight:500 }}>{label}: </span>
          {val}
        </div>
      ))}

      {/* Effects — the main rules text */}
      {tech.effects && (
        <div style={{
          fontSize: 15,
          color: TEXT.body,
          lineHeight: 1.6,
          marginTop: 5,
          marginBottom: 4,
          whiteSpace: "pre-wrap",  // preserves any line breaks in the text
        }}>
          {tech.effects}
        </div>
      )}

      {/* Features chosen for this copy, if it's Feature-built */}
      {configFeatures.length > 0 && (
        <div style={{ marginTop:6 }}>
          <div style={{ fontSize:15, color:TEXT.label, fontWeight:500, marginBottom:3 }}>
            Features (Level {config.level}):
          </div>
          {configFeatures.map(f => (
            <div key={f.id} style={{ fontSize:14, color:TEXT.body, lineHeight:1.5, marginBottom:4 }}>
              <strong>{f.feature_name}</strong> ({f.point_cost} pt{f.point_cost !== 1 ? "s" : ""}) — {f.description}
            </div>
          ))}
        </div>
      )}

      {/* This copy's notes */}
      {note && (
        <div style={{ fontSize:15, color:TEXT.body, marginTop:4, lineHeight:1.5 }}>
          <span style={{ color:TEXT.label, fontWeight:500 }}>Notes: </span>
          {note}
        </div>
      )}

      {/* Special rules text */}
      {tech.special && (
        <div style={{ fontSize:15, color:TEXT.body, marginTop:4, lineHeight:1.5 }}>
          <span style={{ color:TEXT.label, fontWeight:500 }}>Special: </span>
          {tech.special}
        </div>
      )}

      {/* Prerequisites */}
      {tech.prereqs && (
        <div style={{ fontSize:13, color:TEXT.faint, marginTop:7 }}>
          <span style={{ fontWeight:500 }}>Prereqs: </span>
          {tech.prereqs}
        </div>
      )}
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════
// BUILD PANEL — character name, stats, export/import/share, and the
// build list. Rendered both on the standalone "My build" tab and in
// the sticky sidebar next to the technique list on wide screens.
// ══════════════════════════════════════════════════════════════════
function BuildPanel({
  charName, setCharName, build, buildRows, knownXP, unknownCount,
  notes, configs, techFeaturesById,
  doExport, doImport, importRef, doShare, clearBuild, shareMsg,
  addTech, removeTech, removeInstance, duplicateInstance, actionBtn,
}) {
  return (
    <>
      {/* Character name input */}
      <div style={{ marginBottom:18 }}>
        <div style={{
          fontSize: 13, color: TEXT.faint, marginBottom: 6,
          textTransform: "uppercase", letterSpacing: "0.07em",
        }}>
          Character name
        </div>
        <input
          type="text"
          placeholder="Enter a name…"
          value={charName}
          onChange={e => setCharName(e.target.value)}
          style={{ width:"100%", fontFamily:"'MedievalSharp', Georgia, serif", fontSize:17 }}
        />
      </div>

      {/* Stats row */}
      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap" }}>
        <div style={{
          background:"#161b27", border:"0.5px solid #2d3555",
          borderRadius:8, padding:"8px 14px", minWidth:90,
        }}>
          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:4 }}>Techniques</div>
          <div style={{ fontSize:22, fontWeight:500 }}>{build.length}</div>
        </div>
        <div style={{
          background:"#161b27", border:"0.5px solid #2d3555",
          borderRadius:8, padding:"8px 14px", minWidth:110,
        }}>
          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:4 }}>Technique XP</div>
          <div style={{ fontSize:22, fontWeight:500 }}>
            {unknownCount > 0 ? `${knownXP}+` : `${knownXP}`}
            <span style={{ fontSize:13, color:TEXT.faint, marginLeft:4 }}>XP</span>
          </div>
        </div>
      </div>
      {unknownCount > 0 && (
        <div style={{ fontSize:13, color:TEXT.faint, fontStyle:"italic", marginTop:-8, marginBottom:16 }}>
          {unknownCount} technique{unknownCount > 1 ? "s" : ""} not fully configured yet — XP varies by level.
        </div>
      )}

      {/* Action buttons */}
      <div style={{ display:"flex", gap:8, marginBottom:18, flexWrap:"wrap", alignItems:"center" }}>
        <button onClick={doExport} style={actionBtn()}>
          <i className="ti ti-download" aria-hidden="true" /> Export build
        </button>
        <button onClick={() => importRef.current.click()} style={actionBtn()}>
          <i className="ti ti-upload" aria-hidden="true" /> Import build
        </button>
        <input ref={importRef} type="file" accept=".json" onChange={doImport} style={{ display:"none" }} />
        <button onClick={doShare} style={actionBtn()}>
          <i className="ti ti-link" aria-hidden="true" /> Copy share link
        </button>
        {build.length > 0 && (
          <button onClick={clearBuild} style={actionBtn(true)}>Clear build</button>
        )}
        {shareMsg && (
          <span style={{ fontSize:14, color:"#d4a843" }}>{shareMsg}</span>
        )}
      </div>

      {/* Build list — one row per distinct technique. Plain repeats
          (no per-copy data) collapse into a ×N row; techniques with
          notes or Feature-builder choices per copy get one row each,
          since those copies aren't interchangeable. */}
      {buildRows.length === 0 ? (
        <div style={{ textAlign:"center", padding:"32px 16px", color:TEXT.faint, fontSize:15 }}>
          No techniques added yet — head to Browse to pick some.
        </div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
          {buildRows.map(({ tech: t, uids }) => {
            const count      = uids.length;
            const uid        = uids[0];
            const isDistinct = t.free_text || t.features;
            const repeatable = isRepeatable(t);
            const cfg        = t.features ? configs[uid] : null;
            const xpEach     = cfg ? cfg.level * 3 : techXP(t);
            const totalXP    = xpEach != null ? xpEach * count : null;

            let subtitle = null;
            if (t.free_text) {
              if (notes[uid]) subtitle = notes[uid];
            } else if (t.features) {
              if (cfg) {
                const feats = techFeaturesById[t.id] || [];
                const names = cfg.featureIds.map(id => feats.find(f => f.id === id)?.feature_name).filter(Boolean);
                subtitle = names.length > 0 ? names.join(", ") : null;
              } else {
                subtitle = "Not configured yet";
              }
            }

            return (
              <div key={isDistinct ? uid : t.id} style={{
                display:"flex", alignItems:"center", gap:8,
                background:"#161b27",
                border:"0.5px solid #2d3555",
                borderRadius:8,
                padding:"8px 10px",
              }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{
                    fontFamily:"'MedievalSharp', Georgia, serif", fontWeight:"bold",
                    fontSize:15, color:TEXT.name,
                    overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap",
                  }}>
                    {t.name}{!isDistinct && count > 1 ? ` ×${count}` : ""}
                  </div>
                  <span style={{ fontSize:13, color:"#d4a843" }}>
                    {cfg ? `Level ${cfg.level}` : lvlLabel(t.level_min, t.level_max)}
                  </span>
                  {subtitle && (
                    <div style={{
                      fontSize:12, color:TEXT.faint, marginTop:2,
                      overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap",
                    }}>
                      {subtitle}
                    </div>
                  )}
                </div>
                <span style={{ fontSize:13, color:TEXT.faint, flexShrink:0 }}>
                  {totalXP != null ? `${totalXP} XP` : "? XP"}
                </span>
                {repeatable && (
                  <button
                    onClick={() => t.features ? duplicateInstance(uid) : addTech(t.id)}
                    aria-label={t.features ? `Add another copy of ${t.name} with the same features` : `Add another ${t.name}`}
                    style={{
                      background:"transparent", border:"0.5px solid #2d3555", borderRadius:4,
                      color:TEXT.muted, fontSize:15, lineHeight:1, padding:"2px 7px", flexShrink:0,
                    }}
                  >
                    +
                  </button>
                )}
                <button
                  onClick={() => isDistinct ? removeInstance(uid) : removeTech(t.id)}
                  aria-label={`Remove ${t.name}`}
                  style={{
                    background:"transparent", border:"none",
                    color:TEXT.faint, fontSize:18, lineHeight:1, padding:"2px 4px", flexShrink:0,
                  }}
                >
                  ✕
                </button>
              </div>
            );
          })}
        </div>
      )}
    </>
  );
}


// ══════════════════════════════════════════════════════════════════
// MAIN APP COMPONENT
// Holds all state and renders the three views.
// ══════════════════════════════════════════════════════════════════
function App() {

  // ── Loaded data ────────────────────────────────────────────────
  const [techniques, setTechniques] = useState([]);
  const [features,   setFeatures]   = useState([]);   // features.json — Feature-builder options
  const [loading,    setLoading]    = useState(true);
  const [loadError,  setLoadError]  = useState(null);

  // ── UI state ───────────────────────────────────────────────────
  const [view,       setView]       = useState("browse"); // browse | build | sheet
  const [search,     setSearch]     = useState("");
  const [skillFilter, setSkillFilter] = useState([]);   // selected "related skills" chips
  const [tagFilter,  setTagFilter]  = useState([]);     // selected "tags" chips
  const [levelMin,   setLevelMin]   = useState(1);
  const [levelMax,   setLevelMax]   = useState(5);
  const [healingOnly, setHealingOnly] = useState(false);
  const [cardsOnly,   setCardsOnly]   = useState(false);
  const [advancedOpen, setAdvancedOpen] = useState(false);
  const [build,      setBuild]      = useState([]);       // array of { uid, id } — see file-header note
  const [charName,   setCharName]   = useState("");
  const [shareMsg,   setShareMsg]   = useState("");
  // Per-copy free-text notes, keyed by build-entry uid. Persisted to
  // localStorage since there's no backend.
  const [notes, setNotes] = useState(() => {
    try { return JSON.parse(localStorage.getItem("flagonquest-notes") || "{}"); }
    catch { return {}; }
  });
  // Per-copy Feature-builder choices ({ level, featureIds }), keyed by
  // build-entry uid. Also persisted to localStorage.
  const [configs, setConfigs] = useState(() => {
    try { return JSON.parse(localStorage.getItem("flagonquest-configs") || "{}"); }
    catch { return {}; }
  });
  const importRef = useRef();

  // ── Fetch JSON data on first load ──────────────────────────────
  // Promise.all fetches both files simultaneously so we only wait once.
  // Paths are relative to index.html, so "data/techniques.json" works
  // on GitHub Pages and on localhost:8000 equally.
  useEffect(() => {
    Promise.all([
      fetch("data/techniques.json").then(r => {
        if (!r.ok) throw new Error(`techniques.json returned ${r.status}`);
        return r.json();
      }),
      fetch("data/features.json").then(r => {
        if (!r.ok) throw new Error(`features.json returned ${r.status}`);
        return r.json();
      }),
    ])
    .then(([techData, featData]) => {
      setTechniques(techData);
      setFeatures(featData);
      setLoading(false);
    })
    .catch(err => {
      setLoadError(err.message);
      setLoading(false);
    });
  }, []); // empty [] = run once on mount only

  // ── Load a shared build from the URL hash ──────────────────────
  // If someone opens a share link like index.html#build=abc123, this
  // decodes and restores their build automatically. Each restored
  // technique gets a fresh uid — share links don't carry notes/Feature
  // choices, only which techniques are known and the character name.
  useEffect(() => {
    const hash = window.location.hash;
    if (hash.startsWith("#build=")) {
      const decoded = decBuild(hash.slice(7));
      if (decoded) {
        if (decoded.ids)  setBuild(decoded.ids.map(id => ({ uid: makeUid(), id })));
        if (decoded.name) setCharName(decoded.name);
      }
    }
  }, []);

  // ── Persist per-copy notes/configs to localStorage on change ────
  useEffect(() => {
    localStorage.setItem("flagonquest-notes", JSON.stringify(notes));
  }, [notes]);
  useEffect(() => {
    localStorage.setItem("flagonquest-configs", JSON.stringify(configs));
  }, [configs]);

  const setNote = (uid, text) => setNotes(n => ({ ...n, [uid]: text }));

  // ── Features grouped by the technique they belong to ────────────
  const techFeaturesById = useMemo(() => {
    const map = {};
    features.forEach(f => {
      (map[f.technique_id] ??= []).push(f);
    });
    return map;
  }, [features]);

  // ── Every related skill / tag seen across the loaded techniques ─
  // Powers the "Related skills" and "Tags" multiselects in Advanced filters.
  const allSkills = useMemo(() => {
    const set = new Set();
    techniques.forEach(t => splitCSV(t.related_skills).forEach(s => set.add(s)));
    return [...set].sort();
  }, [techniques]);

  const allTags = useMemo(() => {
    const set = new Set();
    techniques.forEach(t => splitCSV(t.tags).forEach(tag => set.add(tag)));
    return [...set].sort();
  }, [techniques]);

  const toggleSkill = skill => setSkillFilter(cur =>
    cur.includes(skill) ? cur.filter(s => s !== skill) : [...cur, skill]
  );
  const toggleTag = tag => setTagFilter(cur =>
    cur.includes(tag) ? cur.filter(t => t !== tag) : [...cur, tag]
  );

  // ── Filtered technique list ────────────────────────────────────
  // useMemo = only recalculate when one of the listed deps changes.
  const visible = useMemo(() => techniques.filter(t => {
    if (!matchesLevel(t, levelMin, levelMax)) return false;
    if (healingOnly && !t.healing) return false;
    if (cardsOnly && !t.use_cards) return false;
    if (skillFilter.length > 0) {
      const techSkills = splitCSV(t.related_skills);
      if (!skillFilter.some(s => techSkills.includes(s))) return false;
    }
    if (tagFilter.length > 0) {
      const techTags = splitCSV(t.tags);
      if (!tagFilter.some(tag => techTags.includes(tag))) return false;
    }
    if (search) {
      const q = search.toLowerCase();
      // Search the technique's full text — every field a player might
      // type a fragment of, not just name/effects.
      const hay = [
        t.name, t.tags, t.related_skills,
        t.description, t.condition, t.action, t.cost, t.target,
        t.effects, t.special, t.prereqs,
      ].filter(Boolean).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }), [techniques, search, skillFilter, tagFilter, levelMin, levelMax, healingOnly, cardsOnly]);

  // ── Build entries paired with their technique object ────────────
  const buildEntries = useMemo(() =>
    build.map(e => ({ ...e, tech: techniques.find(t => t.id === e.id) })).filter(e => e.tech),
  [build, techniques]);

  // XP for one build entry: a Feature-built copy uses its *chosen*
  // level (level × 3), since we actually know it; everything else
  // falls back to the technique's fixed level, or null if it's a
  // range/draft technique we can't auto-price.
  function entryXP(e) {
    const cfg = configs[e.uid];
    if (cfg && cfg.level != null) return cfg.level * 3;
    return techXP(e.tech);
  }

  // One row per distinct technique for display — a plain repeatable
  // technique (no per-copy data) collapses into a "×N" row, but a
  // technique with its own notes or Feature-builder choices per copy
  // always gets one row per copy, since those copies differ.
  const buildRows = useMemo(() => {
    const rows = [];
    const groupIndex = {};
    build.forEach(({ uid, id }) => {
      const tech = techniques.find(t => t.id === id);
      if (!tech) return;
      if (tech.free_text || tech.features) {
        rows.push({ tech, uids: [uid] });
      } else if (id in groupIndex) {
        rows[groupIndex[id]].uids.push(uid);
      } else {
        groupIndex[id] = rows.length;
        rows.push({ tech, uids: [uid] });
      }
    });
    return rows;
  }, [build, techniques]);

  // ── XP totals ──────────────────────────────────────────────────
  const knownXP      = buildEntries.reduce((sum, e) => sum + (entryXP(e) ?? 0), 0);
  const unknownCount = buildEntries.filter(e => entryXP(e) == null).length;

  // ── Build mutations ────────────────────────────────────────────
  // Duplicate/Encounter techniques can be added more than once; every
  // other technique still only ever has one copy in the build.
  const addTech = id => setBuild(b => {
    const tech = techniques.find(t => t.id === id);
    if (tech && !isRepeatable(tech) && b.some(e => e.id === id)) return b;
    return [...b, { uid: makeUid(), id }];
  });

  // Removes one copy (whichever was added most recently) — used by the
  // simple "Remove"/"Remove one" buttons and the build list's ✕ for
  // techniques with no per-copy data. For a non-repeatable technique
  // that's its only copy, so it behaves like a full removal.
  const removeTech = id => {
    let removedUid = null;
    setBuild(b => {
      const idx = b.map(e => e.id).lastIndexOf(id);
      if (idx === -1) return b;
      removedUid = b[idx].uid;
      return [...b.slice(0, idx), ...b.slice(idx + 1)];
    });
    if (removedUid) {
      setNotes(n => { if (!(removedUid in n)) return n; const c = { ...n }; delete c[removedUid]; return c; });
      setConfigs(c => { if (!(removedUid in c)) return c; const cc = { ...c }; delete cc[removedUid]; return cc; });
    }
  };

  // Removes one specific copy by its uid — used for free_text/Feature
  // rows, where each copy carries its own notes/config that a plain
  // "remove the last one" wouldn't target correctly.
  const removeInstance = uid => {
    setBuild(b => b.filter(e => e.uid !== uid));
    setNotes(n => { if (!(uid in n)) return n; const c = { ...n }; delete c[uid]; return c; });
    setConfigs(c => { if (!(uid in c)) return c; const cc = { ...c }; delete cc[uid]; return cc; });
  };

  // Creates a new copy with the same Feature-builder config as an
  // existing one — the "purchase another copy with the same features"
  // option, alongside "+ Build another copy" for different features.
  const duplicateInstance = uid => {
    const entry = build.find(e => e.uid === uid);
    const cfg   = configs[uid];
    if (!entry) return;
    const newUid = makeUid();
    setBuild(b => [...b, { uid: newUid, id: entry.id }]);
    if (cfg) {
      setConfigs(c => ({ ...c, [newUid]: { level: cfg.level, featureIds: [...cfg.featureIds] } }));
    }
  };

  // Saves a Feature-builder configuration: pass an existing uid to
  // edit that copy in place, or null to add a brand-new copy.
  const saveConfig = (techId, uid, cfg) => {
    if (uid) {
      setConfigs(c => ({ ...c, [uid]: cfg }));
    } else {
      const newUid = makeUid();
      setBuild(b => [...b, { uid: newUid, id: techId }]);
      setConfigs(c => ({ ...c, [newUid]: cfg }));
    }
  };

  const clearBuild = () => {
    if (!confirm("Clear the current build?")) return;
    setBuild([]);
    setNotes({});
    setConfigs({});
  };

  // ── Export build as a .json file download ─────────────────────
  // Includes each copy's notes and Feature-builder choices (by name,
  // so the file stays readable and survives future data updates).
  function doExport() {
    const payload = {
      charName,
      exportedAt: new Date().toISOString(),
      techniques: buildEntries.map(e => {
        const cfg = configs[e.uid];
        const out = { id: e.tech.id, name: e.tech.name, xp: entryXP(e) };
        if (cfg) {
          out.level    = cfg.level;
          out.features = cfg.featureIds
            .map(fid => (techFeaturesById[e.tech.id] || []).find(f => f.id === fid)?.feature_name)
            .filter(Boolean);
        } else {
          out.level = lvlLabel(e.tech.level_min, e.tech.level_max);
        }
        if (notes[e.uid]) out.note = notes[e.uid];
        return out;
      }),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a    = Object.assign(document.createElement("a"), {
      href:     URL.createObjectURL(blob),
      download: `${(charName || "build").replace(/\s+/g, "-")}.json`,
    });
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ── Import a previously exported .json file ────────────────────
  function doImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const newBuild   = [];
        const newNotes   = {};
        const newConfigs = {};
        data.techniques.forEach(t => {
          const uid = makeUid();
          newBuild.push({ uid, id: t.id });
          if (t.note) newNotes[uid] = t.note;
          if (Array.isArray(t.features) && typeof t.level === "number") {
            const techFeats = techFeaturesById[t.id] || [];
            const featureIds = t.features
              .map(name => techFeats.find(f => f.feature_name === name)?.id)
              .filter(Boolean);
            newConfigs[uid] = { level: t.level, featureIds };
          }
        });
        setBuild(newBuild);
        setNotes(n => ({ ...n, ...newNotes }));
        setConfigs(c => ({ ...c, ...newConfigs }));
        if (data.charName) setCharName(data.charName);
      } catch {
        alert("Couldn't read that file — make sure it's a FlagonQuest build export.");
      }
    };
    reader.readAsText(file);
    e.target.value = ""; // reset so the same file can be imported again
  }

  // ── Generate a shareable URL ───────────────────────────────────
  // Encodes the build's technique IDs and character name into the URL
  // hash — notes/Feature choices are left out to keep the link short.
  function doShare() {
    const encoded = encBuild(build.map(e => e.id), charName);
    const url = window.location.href.split("#")[0] + "#build=" + encoded;
    (navigator.clipboard?.writeText(url) ?? Promise.reject())
      .then(() => setShareMsg("Link copied!"))
      .catch(() => setShareMsg("Couldn't auto-copy — grab the URL from your address bar"));
    setTimeout(() => setShareMsg(""), 3500);
  }

  // ── Style helpers ──────────────────────────────────────────────
  const tabStyle = key => ({
    padding: "6px 14px", fontSize: 15, fontWeight: 500, borderRadius: 6,
    background:  view === key ? "#d4a843" : "transparent",
    color:       view === key ? "#0a0e18" : TEXT.muted,
    border: `0.5px solid ${view === key ? "#d4a843" : "#2d3555"}`,
    transition: "all 0.15s",
  });

  // Shared look for the toggle-able chip buttons in Advanced filters
  // (Related skills, Tags) — active chips light up gold.
  const filterChipStyle = active => ({
    padding: "3px 10px", fontSize: 13, borderRadius: 20,
    fontWeight: active ? 500 : 400,
    whiteSpace: "nowrap",
    background: active ? "#d4a84322" : "transparent",
    color:      active ? "#d4a843" : TEXT.muted,
    border: `0.5px solid ${active ? "#d4a843" : "#2d3555"}`,
  });

  const actionBtn = (danger = false) => ({
    padding: "6px 14px", fontSize: 14, fontWeight: 500, borderRadius: 6,
    background: "transparent",
    color:  danger ? "#c0392b" : TEXT.muted,
    border: `0.5px solid ${danger ? "#c0392b" : "#2d3555"}`,
    display: "flex", alignItems: "center", gap: 5,
  });

  // ── Loading and error screens ──────────────────────────────────
  if (loading) return (
    <div style={{
      minHeight: "100vh", display:"flex", alignItems:"center",
      justifyContent: "center", background: "#0d1117",
      color: TEXT.faint, fontFamily: "'MedievalSharp', Georgia, serif", fontSize: 18,
    }}>
      Loading FlagonQuest data…
    </div>
  );

  if (loadError) return (
    <div style={{
      minHeight: "100vh", padding: 40, background: "#0d1117",
      color: "#c0392b", fontFamily: "system-ui, sans-serif",
      fontSize: 16, lineHeight: 1.6, maxWidth: 620,
    }}>
      <strong>Couldn't load data files</strong>
      <p style={{ marginTop: 10, color: TEXT.muted }}>
        Error: {loadError}
      </p>
      <p style={{ marginTop: 10, color: TEXT.faint }}>
        If you're testing locally, open a terminal in your repo folder and run:
        <br />
        <code style={{ color:"#d4a843" }}>python -m http.server 8000</code>
        <br />
        Then visit <code style={{ color:"#d4a843" }}>localhost:8000</code> instead of
        opening the HTML file directly.
      </p>
    </div>
  );

  // ── Main render ────────────────────────────────────────────────
  return (
    <div style={{ fontFamily:"system-ui, -apple-system, sans-serif", color:"#e8dfc8" }}>

      {/* ════════ HEADER ════════════════════════════════════════ */}
      <div style={{
        padding: "12px 20px",
        borderBottom: "0.5px solid #2d3555",
        display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap",
        background: "#0a0e18",
        position: "sticky", top: 0, zIndex: 100,
      }}>
        <div>
          <div style={{
            fontFamily: "'MedievalSharp', Georgia, serif",
            fontSize: 22, fontWeight: "bold",
            color: "#d4a843", letterSpacing: "0.04em",
          }}>
            FlagonQuest
          </div>
          <div style={{ fontSize:13, color:TEXT.faint, marginTop:1 }}>
            Technique browser · Character builder
          </div>
        </div>

        {/* Tab navigation */}
        <div style={{ display:"flex", gap:6, marginLeft:"auto", flexWrap:"wrap" }}>
          <button onClick={() => setView("browse")} style={tabStyle("browse")}>
            Browse
          </button>
          <button onClick={() => setView("build")} style={tabStyle("build")}>
            My build{build.length > 0 ? ` (${build.length})` : ""}
          </button>
          <button onClick={() => setView("sheet")} style={tabStyle("sheet")}>
            Character sheet
          </button>
        </div>
      </div>


      {/* ════════ BROWSE VIEW ═══════════════════════════════════ */}
      {view === "browse" && (
        <div style={{ padding: 16 }}>

          {/* Search bar + advanced filters toggle */}
          <div style={{
            display: "flex", gap: 10, marginBottom: 10,
            flexWrap: "wrap", alignItems: "center",
          }}>
            <input
              type="text"
              placeholder="Search everything — name, tags, cost, effects…"
              value={search}
              onChange={e => setSearch(e.target.value)}
              style={{ flex:"1 1 200px", minWidth:150 }}
            />
            <button onClick={() => setAdvancedOpen(o => !o)} style={actionBtn()}>
              {advancedOpen ? "▲" : "▼"} Advanced
            </button>
          </div>

          {/* Advanced filters — level range, healing, card use, related skills, tags */}
          {advancedOpen && (
            <div style={{
              display: "flex", flexDirection: "column", gap: 12,
              fontSize: 14, color: TEXT.muted,
              background: "#12161f", border: "0.5px solid #2d3555",
              borderRadius: 8, padding: "10px 14px", marginBottom: 12,
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 18, flexWrap: "wrap" }}>
                {/* Level range controls */}
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ color:"#d4a843", fontWeight:500 }}>
                    Lv {levelMin}–{levelMax}
                  </span>
                  <input
                    type="range" min={1} max={5} value={levelMin}
                    onChange={e => setLevelMin(Math.min(+e.target.value, levelMax))}
                    style={{ width: 60 }}
                  />
                  <input
                    type="range" min={1} max={5} value={levelMax}
                    onChange={e => setLevelMax(Math.max(+e.target.value, levelMin))}
                    style={{ width: 60 }}
                  />
                </div>
                <label style={{ display:"flex", alignItems:"center", gap:4, cursor:"pointer" }}>
                  <input
                    type="checkbox"
                    checked={healingOnly}
                    onChange={e => setHealingOnly(e.target.checked)}
                  />
                  Healing
                </label>
                <label style={{ display:"flex", alignItems:"center", gap:4, cursor:"pointer" }}>
                  <input
                    type="checkbox"
                    checked={cardsOnly}
                    onChange={e => setCardsOnly(e.target.checked)}
                  />
                  Uses cards
                </label>
              </div>

              {/* Related skills — click to toggle; matches techniques with ANY selected skill */}
              {allSkills.length > 0 && (
                <div>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                    <span style={{ color:TEXT.faint }}>Related skills</span>
                    {skillFilter.length > 0 && (
                      <button
                        onClick={() => setSkillFilter([])}
                        style={{ background:"transparent", border:"none", color:"#c0392b", fontSize:13, padding:0 }}
                      >
                        Clear
                      </button>
                    )}
                  </div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                    {allSkills.map(skill => (
                      <button key={skill} onClick={() => toggleSkill(skill)} style={filterChipStyle(skillFilter.includes(skill))}>
                        {skill}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Tags — click to toggle; matches techniques with ANY selected tag */}
              {allTags.length > 0 && (
                <div>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                    <span style={{ color:TEXT.faint }}>Tags</span>
                    {tagFilter.length > 0 && (
                      <button
                        onClick={() => setTagFilter([])}
                        style={{ background:"transparent", border:"none", color:"#c0392b", fontSize:13, padding:0 }}
                      >
                        Clear
                      </button>
                    )}
                  </div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                    {allTags.map(tag => (
                      <button key={tag} onClick={() => toggleTag(tag)} style={filterChipStyle(tagFilter.includes(tag))}>
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Result count */}
          <div style={{ fontSize:13, color:TEXT.faint, marginBottom:12 }}>
            {visible.length} technique{visible.length !== 1 ? "s" : ""}
            {search || skillFilter.length > 0 || tagFilter.length > 0 ? " matching filters" : " total"}
          </div>

          {/* List (left) + sticky build panel (right on wide screens) */}
          <div className="browse-layout">
            <div className="tech-list">
              {visible.length === 0 ? (
                <div style={{
                  textAlign:"center",
                  padding: "60px 20px", color:TEXT.faint, fontSize:16,
                }}>
                  No techniques match those filters.
                </div>
              ) : visible.map(t => {
                const instanceUids = build.filter(e => e.id === t.id).map(e => e.uid);
                return (
                  <TechCard
                    key={t.id}
                    tech={t}
                    instances={instanceUids}
                    techFeatures={techFeaturesById[t.id] || []}
                    notes={notes}
                    onNoteChange={setNote}
                    configs={configs}
                    onSaveConfig={saveConfig}
                    onDuplicateInstance={duplicateInstance}
                    onAdd={addTech}
                    onRemove={removeTech}
                    onRemoveInstance={removeInstance}
                  />
                );
              })}
            </div>

            <div className="browse-build-panel">
              <BuildPanel
                charName={charName} setCharName={setCharName}
                build={build} buildRows={buildRows}
                knownXP={knownXP} unknownCount={unknownCount}
                notes={notes} configs={configs} techFeaturesById={techFeaturesById}
                doExport={doExport} doImport={doImport} importRef={importRef}
                doShare={doShare} clearBuild={clearBuild} shareMsg={shareMsg}
                addTech={addTech} removeTech={removeTech}
                removeInstance={removeInstance} duplicateInstance={duplicateInstance}
                actionBtn={actionBtn}
              />
            </div>
          </div>
        </div>
      )}


      {/* ════════ MY BUILD VIEW ═════════════════════════════════ */}
      {view === "build" && (
        <div style={{ maxWidth:640, margin:"0 auto", padding:20 }}>
          <BuildPanel
            charName={charName} setCharName={setCharName}
            build={build} buildRows={buildRows}
            knownXP={knownXP} unknownCount={unknownCount}
            notes={notes} configs={configs} techFeaturesById={techFeaturesById}
            doExport={doExport} doImport={doImport} importRef={importRef}
            doShare={doShare} clearBuild={clearBuild} shareMsg={shareMsg}
            addTech={addTech} removeTech={removeTech}
            removeInstance={removeInstance} duplicateInstance={duplicateInstance}
            actionBtn={actionBtn}
          />
        </div>
      )}


      {/* ════════ CHARACTER SHEET VIEW ══════════════════════════ */}
      {view === "sheet" && (
        <div style={{ maxWidth:680, margin:"0 auto", padding:20 }}>
          {buildEntries.length === 0 ? (
            <div style={{ textAlign:"center", padding:"48px 20px", color:TEXT.faint, fontSize:16 }}>
              Add techniques in Browse, then see them formatted here.
            </div>
          ) : (
            <>
              {/* Character name + summary header */}
              <div style={{
                borderBottom: "0.5px solid #2d3555",
                paddingBottom: 14, marginBottom: 28,
              }}>
                <div style={{
                  fontFamily: "'MedievalSharp', Georgia, serif",
                  fontSize: 28, fontWeight: "bold", color: "#d4a843",
                }}>
                  {charName || "Unnamed hero"}
                </div>
                <div style={{ fontSize:15, color:TEXT.faint, marginTop:5 }}>
                  {buildEntries.length} technique{buildEntries.length !== 1 ? "s" : ""}
                  {" · "}
                  {unknownCount === 0
                    ? `${knownXP} XP`
                    : `${knownXP}+ XP (${unknownCount} variable)`
                  }
                </div>
              </div>

              {/* Techniques in the order they were added to the build —
                  Duplicate/Encounter techniques with no per-copy data
                  collapse into a single entry with a ×N count */}
              {buildRows.map(({ tech: t, uids }) => {
                const isDistinct = t.free_text || t.features;
                const uid = uids[0];
                return (
                  <SheetEntry
                    key={isDistinct ? uid : t.id}
                    tech={t}
                    count={uids.length}
                    note={t.free_text ? notes[uid] : null}
                    config={t.features ? configs[uid] : null}
                    techFeatures={techFeaturesById[t.id] || []}
                  />
                );
              })}
            </>
          )}
        </div>
      )}

    </div>
  );
}

// Mount the React app onto the <div id="root"> in the HTML above
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
