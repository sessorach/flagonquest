/* ═══════════════════════════════════════════════════════════════
   FLAGONQUEST — Technique Browser & Character Builder  v0.1
   ═══════════════════════════════════════════════════════════════

   HOW THIS WORKS (the plain-English tour):

   DATA: The TECHNIQUES array is your spreadsheet in JS form.
   In production, this app will fetch() that data from a JSON
   file on GitHub Pages instead of having it baked in here.

   STATE: React "state" is just variables that cause the screen
   to update when they change. We track:
     • view       — which tab (browse / build / sheet)
     • search     — text in the search box
     • catFilter  — which category chip is selected
     • levelMin/Max — the two level-range sliders
     • showDrafts — whether to show unassigned techniques
     • build      — array of technique IDs the player picked
     • charName   — character name the player typed in

   FILTERING: visibleTechs recalculates via useMemo() whenever
   a filter changes. It's just TECHNIQUES.filter(...) — no magic.

   BUILD: Adding a technique appends its ID to the build array.
   The build panel looks up each ID to show full details.
   Removing splices the ID back out.

   SHARE: Export = JSON file download. Share Link = build IDs
   encoded as base64 in the URL hash (#build=...). On load,
   if that hash is present, the build is auto-populated.
═══════════════════════════════════════════════════════════════ */

// ── Helper functions ──────────────────────────────────────────

// Format level range for display: lMin=1, lMax=4 → "Lv 1–4"
function lvlLabel(lMin, lMax) {
  if (lMin == null) return "Draft";
  const hi = lMax ?? lMin;
  return lMin === hi ? `Lv ${lMin}` : `Lv ${lMin}–${hi}`;
}

// Check if a technique falls within the current level filter range.
// Two ranges overlap if: techMin <= filterMax AND techMax >= filterMin.
function matchesLevel(t, fMin, fMax, showDrafts) {
  if (t.lMin == null) return showDrafts;
  const hi = t.lMax ?? t.lMin;
  return t.lMin <= fMax && hi >= fMin;
}

// Encode build state as a base64 string for URL sharing
function encBuild(ids, name) {
  return btoa(JSON.stringify({ ids, name }));
}
function decBuild(str) {
  try { return JSON.parse(atob(str)); } catch { return null; }
}

        style: {
          fontFamily: "Georgia, 'Times New Roman', serif",

}

// ── Single entry on the character sheet ───────────────────────

  return React.createElement("div", {

    // Name + level + category on one line
    React.createElement("div", { style: { display:"flex", gap:8, alignItems:"baseline", flexWrap:"wrap" } },

        style: { fontFamily:"Georgia, 'Times New Roman', serif", fontWeight:"bold", fontSize:15, color:"var(--text-primary)" }

      React.createElement("span", { style: { fontSize:11, color:"var(--text-accent)" } }, lvlLabel(t.lMin, t.lMax)),
      React.createElement("span", { style: { fontSize:11, color:c, fontStyle:"italic" } }, t.cat)

}

// ── Main App ──────────────────────────────────────────────────
function App() {
  // All the state variables that drive the UI
  const [view,       setView]       = useState("browse");
  const [search,     setSearch]     = useState("");
  const [catFilter,  setCatFilter]  = useState("All");
  const [levelMin,   setLevelMin]   = useState(1);
  const [levelMax,   setLevelMax]   = useState(5);
  const [showDrafts, setShowDrafts] = useState(false);
  const [build,      setBuild]      = useState([]);   // array of technique IDs
  const [charName,   setCharName]   = useState("");
  const [shareMsg,   setShareMsg]   = useState("");
  const importRef = useRef();

  // On first load: check if there's a share link in the URL hash
  useEffect(() => {
    const hash = window.location.hash;
    if (hash.startsWith("#build=")) {
      const decoded = decBuild(hash.slice(7));
      if (decoded) {
        if (decoded.ids)  setBuild(decoded.ids);
        if (decoded.name) setCharName(decoded.name);
      }
    }
  }, []);

  // Filtered technique list — recalculates only when filters change
  const visible = useMemo(() => TECHNIQUES.filter(t => {
    if (catFilter !== "All" && t.cat !== catFilter) return false;
    if (!matchesLevel(t, levelMin, levelMax, showDrafts)) return false;
    if (search) {
      const q = search.toLowerCase();
      if (![t.name, t.cat, t.note, ...t.skills].join(" ").toLowerCase().includes(q)) return false;
    }
    return true;
  }), [search, catFilter, levelMin, levelMax, showDrafts]);

  // Full technique objects for everything in the build
  const buildTechs = useMemo(() =>
    build.map(id => TECHNIQUES.find(t => t.id === id)).filter(Boolean),
  [build]);

  // Running point total (placeholder: all cost 1 until you add a cost column)
  const totalCost = buildTechs.reduce((n, t) => n + t.cost, 0);

  // Build actions
  const addT   = id => setBuild(b => b.includes(id) ? b : [...b, id]);
  const removeT = id => setBuild(b => b.filter(x => x !== id));
  const clearB  = () => { if (confirm("Clear the current build?")) setBuild([]); };

  // Export build as a downloadable JSON file
  function doExport() {
    const payload = {
      charName,
      exportedAt: new Date().toISOString(),
      techniques: buildTechs.map(t => ({ id:t.id, name:t.name, level:lvlLabel(t.lMin,t.lMax), cat:t.cat })),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${(charName || "build").replace(/\s+/g,"-")}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // Import a previously exported JSON file
  function doImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        setBuild(data.techniques.map(t => t.id));
        if (data.charName) setCharName(data.charName);
      } catch { alert("Couldn't read that file — make sure it's a FlagonQuest build export."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  // Generate a share link (build IDs encoded into the URL hash)
  function doShare() {
    const encoded = encBuild(build, charName);
    const url = window.location.href.split("#")[0] + "#build=" + encoded;
    (navigator.clipboard?.writeText(url) ?? Promise.reject())
      .then(() => setShareMsg("Link copied!"))
      .catch(() => setShareMsg("Couldn't auto-copy — grab the URL from your address bar"));
    setTimeout(() => setShareMsg(""), 3500);
  }

  // Reusable button style helpers
  const tabStyle = (key) => ({
    padding: "6px 14px", fontSize: 13, fontWeight: 500, borderRadius: 6,
    background: view===key ? "var(--fill-primary)" : "transparent",
    color: view===key ? "var(--on-primary)" : "var(--text-secondary)",
    border: "0.5px solid " + (view===key ? "var(--fill-primary)" : "var(--border-strong)"),
  });
  const chipStyle = (cat) => {
    const active = catFilter === cat;
    const c = CAT_COLOR[cat];
    return {
      padding: "4px 12px", fontSize: 12, borderRadius: 20,
      fontWeight: active ? 500 : 400, whiteSpace: "nowrap",
      background: active ? (c||"var(--fill-accent)")+"22" : "transparent",
      color: active ? (c||"var(--text-accent)") : "var(--text-secondary)",
      border: "0.5px solid " + (active ? (c||"var(--border-accent)") : "var(--border)"),
    };
  };
  const actStyle = (danger) => ({
    padding: "6px 14px", fontSize: 12, fontWeight: 500, borderRadius: 6,
    background: "transparent",
    color: danger ? "var(--text-danger)" : "var(--text-secondary)",
    border: "0.5px solid " + (danger ? "var(--border-danger)" : "var(--border-strong)"),
    display: "flex", alignItems: "center", gap: 5,
  });

  return React.createElement("div", { style: { fontFamily:"var(--font-sans, system-ui)", color:"var(--text-primary)" } },

    // ── HEADER ─────────────────────────────────────────────────
    React.createElement("div", {
      style: {
        padding: "12px 16px", borderBottom: "0.5px solid var(--border)",
        display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap",
        background: "var(--surface-2)",
      }
    },
      React.createElement("div", null,
        React.createElement("div", {
          style: { fontFamily:"Georgia, serif", fontSize:18, fontWeight:"bold", color:"var(--text-primary)" }
        }, "FlagonQuest"),
        React.createElement("div", { style: { fontSize:11, color:"var(--text-muted)", marginTop:1 } },
          "Technique browser · Character builder")
      ),
      // Nav tabs
      React.createElement("div", { style: { display:"flex", gap:6, marginLeft:"auto", flexWrap:"wrap" } },
        React.createElement("button", { onClick:()=>setView("browse"), style:tabStyle("browse") }, "Browse"),
        React.createElement("button", { onClick:()=>setView("build"),  style:tabStyle("build")  },
          build.length > 0 ? `My build (${build.length})` : "My build"),
        React.createElement("button", { onClick:()=>setView("sheet"),  style:tabStyle("sheet")  }, "Character sheet")
      )
    ),

    // ── BROWSE VIEW ────────────────────────────────────────────
    view === "browse" && React.createElement("div", { style: { padding: 16 } },
      // Search + level controls row
      React.createElement("div", {
        style: { display:"flex", gap:10, marginBottom:12, flexWrap:"wrap", alignItems:"center" }
      },
        React.createElement("input", {
          type: "text", placeholder: "Search name, skill, tree…",
          value: search, onChange: e=>setSearch(e.target.value),
          style: { flex:"1 1 200px", minWidth:140 }
        }),
        React.createElement("div", {
          style: { display:"flex", alignItems:"center", gap:8, fontSize:12, color:"var(--text-secondary)", flexShrink:0 }
        },
          React.createElement("span", null, `Lv ${levelMin}–${levelMax}`),
          React.createElement("input", { type:"range", min:1, max:5, value:levelMin, style:{width:56},
            onChange: e=>setLevelMin(Math.min(+e.target.value, levelMax)) }),
          React.createElement("input", { type:"range", min:1, max:5, value:levelMax, style:{width:56},
            onChange: e=>setLevelMax(Math.max(+e.target.value, levelMin)) }),
          React.createElement("label", { style:{display:"flex",alignItems:"center",gap:4,cursor:"pointer"} },
            React.createElement("input", { type:"checkbox", checked:showDrafts,
              onChange: e=>setShowDrafts(e.target.checked) }),
            "Drafts"
          )
        )
      ),
      // Category filter chips
      React.createElement("div", { style: { display:"flex", gap:6, flexWrap:"wrap", marginBottom:12 } },
        CATEGORIES.map(cat =>
          React.createElement("button", { key:cat, onClick:()=>setCatFilter(cat), style:chipStyle(cat) }, cat)
        )
      ),
      // Result count
      React.createElement("div", { style: { fontSize:11, color:"var(--text-muted)", marginBottom:12 } },
        `${visible.length} technique${visible.length !== 1 ? "s" : ""}`
      ),
      // Card grid — auto-fill fills as many columns as fit
      React.createElement("div", {
        style: { display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(230px, 1fr))", gap:10 }
      },
        visible.length === 0
          ? React.createElement("div", {
              style: { gridColumn:"1/-1", textAlign:"center", padding:"48px 20px",
                color:"var(--text-muted)", fontSize:14 }
            }, "No techniques match those filters.")
          : visible.map(t => React.createElement(TechCard, {
              key:t.id, t, inBuild:build.includes(t.id), onAdd:addT, onRemove:removeT
            }))
      )
    ),

    // ── MY BUILD VIEW ─────────────────────────────────────────
    view === "build" && React.createElement("div", {
      style: { maxWidth:620, margin:"0 auto", padding:20 }
    },
      // Character name input
      React.createElement("div", { style:{marginBottom:20} },
        React.createElement("div", {
          style:{fontSize:11,color:"var(--text-muted)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.06em"}
        }, "Character name"),
        React.createElement("input", {
          type:"text", placeholder:"Enter a name…", value:charName,
          onChange:e=>setCharName(e.target.value),
          style:{width:"100%",maxWidth:320,fontFamily:"Georgia,serif",fontSize:16}
        })
      ),
      // Stats cards row
      React.createElement("div", { style:{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"} },
        [
          { label:"Techniques", value:build.length },
          { label:"Build points", value:`${totalCost} / ?` },
        ].map(({label,value}) =>
          React.createElement("div", {
            key:label,
            style:{background:"var(--surface-1)",borderRadius:8,padding:"10px 16px",minWidth:120}
          },
            React.createElement("div", { style:{fontSize:11,color:"var(--text-muted)",marginBottom:4} }, label),
            React.createElement("div", { style:{fontSize:22,fontWeight:500} }, value)
          )
        ),
        React.createElement("div", {
          style:{fontSize:11,color:"var(--text-muted)",alignSelf:"flex-end",paddingBottom:12,fontStyle:"italic",flex:1}
        }, "Point costs are placeholder (1 each) — real totals once cost column is added.")
      ),
      // Action buttons
      React.createElement("div", { style:{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap",alignItems:"center"} },
        React.createElement("button", { onClick:doExport, style:actStyle(false) },
          React.createElement("i", {className:"ti ti-download","aria-hidden":"true"}), "Export build"),
        React.createElement("button", { onClick:()=>importRef.current.click(), style:actStyle(false) },
          React.createElement("i", {className:"ti ti-upload","aria-hidden":"true"}), "Import build"),
        React.createElement("input", { ref:importRef, type:"file", accept:".json", onChange:doImport, style:{display:"none"} }),
        React.createElement("button", { onClick:doShare, style:actStyle(false) },
          React.createElement("i", {className:"ti ti-link","aria-hidden":"true"}), "Copy share link"),
        build.length > 0 && React.createElement("button", { onClick:clearB, style:actStyle(true) }, "Clear build"),
        shareMsg && React.createElement("span", { style:{fontSize:12,color:"var(--text-accent)"} }, shareMsg)
      ),
      // Build list
      buildTechs.length === 0
        ? React.createElement("div", {
            style:{textAlign:"center",padding:"40px 20px",color:"var(--text-muted)",fontSize:14}
          }, "No techniques added yet — head to Browse to pick some.")
        : React.createElement("div", { style:{display:"flex",flexDirection:"column",gap:6} },
            buildTechs.map(t => {
              const c = CAT_COLOR[t.cat] || "var(--border)";
              return React.createElement("div", {
                key:t.id,
                style:{
                  display:"flex",alignItems:"center",gap:12,
                  background:"var(--surface-2)",border:"0.5px solid var(--border)",
                  borderLeft:`3px solid ${c}`,borderRadius:"0 8px 8px 0",padding:"8px 12px"
                }
              },
                React.createElement("div", { style:{flex:1} },
                  React.createElement("span", {
                    style:{fontFamily:"Georgia,serif",fontWeight:"bold",fontSize:13}
                  }, t.name),
                  React.createElement("span", { style:{fontSize:11,color:"var(--text-accent)",marginLeft:8} },
                    lvlLabel(t.lMin, t.lMax)),
                  React.createElement("span", { style:{fontSize:11,color:c,marginLeft:6} }, t.cat)
                ),
                React.createElement("button", {
                  onClick:()=>removeT(t.id),
                  "aria-label":`Remove ${t.name}`,
                  style:{background:"transparent",border:"none",color:"var(--text-muted)",fontSize:16,lineHeight:1,padding:"2px 4px"}
                }, "✕")
              );
            })
          )
    ),

    // ── CHARACTER SHEET VIEW ──────────────────────────────────
    view === "sheet" && React.createElement("div", {
      style:{ maxWidth:620, margin:"0 auto", padding:20 }
    },
      buildTechs.length === 0
        ? React.createElement("div", {
            style:{textAlign:"center",padding:"40px 20px",color:"var(--text-muted)",fontSize:14}
          }, "Add techniques in Browse, then see them formatted here.")
        : React.createElement("div", null,
            // Character header
            React.createElement("div", {
              style:{borderBottom:"0.5px solid var(--border-strong)",paddingBottom:12,marginBottom:24}
            },
              React.createElement("div", {
                style:{fontFamily:"Georgia,serif",fontSize:24,fontWeight:"bold",color:"var(--text-primary)"}
              }, charName || "Unnamed hero"),
              React.createElement("div", { style:{fontSize:13,color:"var(--text-muted)",marginTop:4} },
                `${buildTechs.length} technique${buildTechs.length!==1?"s":""} · ${totalCost} build points`)
            ),
            // Sections grouped by category
            Object.keys(CAT_COLOR)
              .filter(cat => buildTechs.some(t => t.cat===cat))
              .map(cat => React.createElement("div", { key:cat, style:{marginBottom:28} },
                // Category header
                React.createElement("div", {
                  style:{
                    fontSize:11,fontWeight:500,textTransform:"uppercase",
                    letterSpacing:"0.1em",color:CAT_COLOR[cat],
                    borderBottom:"0.5px solid var(--border)",paddingBottom:6,marginBottom:14
                  }
                }, cat),
                // Technique entries
                buildTechs.filter(t=>t.cat===cat).map(t =>
                  React.createElement(SheetEntry, { key:t.id, t })
                )
              ))
          )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
