<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlagonQuest — Rulebook</title>
  <link rel="icon" href="assets/mug-icon.png">

  <!-- MedievalSharp — fantasy display font for names/headings (free, OFL license) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

  <!-- React 18 (the UI framework) and ReactDOM (renders it to the page) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone: lets us write JSX (the HTML-in-JS syntax) directly
       in this file without a build step, same as index.html. -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ── Reset & base — matches index.html's theme so this reads as the
       same site, not a bolted-on page. ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e8dfc8;
      min-height: 100vh;
    }

    button { font-family: inherit; cursor: pointer; }
    .rulebook-link:hover { opacity: 0.85; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3555; border-radius: 4px; }

    /* ── Site header ───────────────────────────────────────────────
       Same "centered when wrapped" convention as index.html's
       .site-header: narrow screens wrap the brand and nav onto their
       own centered rows (instead of pinned left), each wide enough to
       overflow onto extra centered rows below. On wide screens the
       nav's margin-left: auto pins it to the right of the brand on a
       single row, same as it always has, and the header is pinned to
       the top of the viewport — only at this width, where it's always
       a single compact row; on narrow screens it can wrap onto several
       rows, and pinning that much height would eat too much of a small
       screen permanently (see the 2026-08-03 changelog entry, which
       un-stuck it for exactly this reason). z-index keeps it above the
       sticky TOC below, which re-offsets itself for this header's
       height. */
    .site-header { justify-content: center; }
    @media (min-width: 900px) {
      .site-header { position: sticky; top: 0; z-index: 100; }
      .site-header-nav { margin-left: auto; }
    }

    /* ── Rulebook layout: TOC sidebar + content ─────────────────────
       Narrow screens: TOC sits above the content, not beside it.
       Wide screens: sticky TOC on the left, content on the right. */
    .rulebook-layout { display: block; }
    .rulebook-toc { margin-bottom: 24px; }
    @media (min-width: 900px) {
      .rulebook-layout {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 28px;
        align-items: start;
      }
      .rulebook-toc {
        position: sticky;
        top: 78px;
        max-height: calc(100vh - 96px);
        overflow-y: auto;
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// Same warm off-white/tan text scale as index.html, so this page reads
// as the same site rather than a bolted-on one.
const TEXT = {
  name:  "#e8dfc8",
  body:  "#d3c9a3",
  label: "#a68f52",
  muted: "#9c9576",
  faint: "#726c58",
};

// ── Glossary tooltip — duplicated from index.html ───────────────────
// This is a separate static page (no shared build step between files),
// so the glossary helper/component are kept in sync by hand; they're
// small and change rarely.
function withGlossary(text, glossary) {
  if (!text || !glossary || glossary.length === 0) return text;
  const terms = [...glossary].sort((a, b) => b.term.length - a.term.length);
  const escaped = terms.map(g => g.term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const re = new RegExp(`\\b(${escaped.join("|")})\\b`, "g");
  const byTerm = Object.fromEntries(glossary.map(g => [g.term, g.description]));
  const parts = text.split(re);
  if (parts.length === 1) return text;
  return parts.map((part, i) =>
    byTerm[part] ? <GlossaryTerm key={i} term={part} description={byTerm[part]} /> : part
  );
}

function GlossaryTerm({ term, description }) {
  const [open, setOpen] = useState(false);
  return (
    <span
      onMouseEnter={() => setOpen(true)}
      onMouseLeave={() => setOpen(false)}
      onClick={e => { e.stopPropagation(); setOpen(o => !o); }}
      style={{ position: "relative", borderBottom: "1px dotted #a68f52", cursor: "help" }}
    >
      {term}
      {open && (
        <span style={{
          position: "absolute", left: 0, top: "100%", marginTop: 4, zIndex: 50,
          display: "block", width: 220,
          background: "#12161f", border: "0.5px solid #d4a843", borderRadius: 6,
          padding: "6px 10px", fontSize: 12, lineHeight: 1.4,
          color: TEXT.body, fontStyle: "normal", fontWeight: 400,
          fontFamily: "system-ui, -apple-system, sans-serif",
          whiteSpace: "pre-wrap",
          boxShadow: "0 4px 14px rgba(0,0,0,0.45)",
        }}>
          <strong style={{ color: "#d4a843" }}>{term}</strong>: {description}
        </span>
      )}
    </span>
  );
}

// ── Inline Markdown — just **bold**, applied on top of glossary term
// linking (a bold word can still be a glossary term, and vice versa).
// See the MARKDOWN SOURCES doc in scripts/convert.py for the full syntax.
function renderInline(text, glossary) {
  if (!text) return text;
  const parts = text.split(/\*\*(.+?)\*\*/g);
  if (parts.length === 1) return withGlossary(text, glossary);
  return parts.map((part, i) =>
    i % 2 === 1
      ? <strong key={i} style={{ color: TEXT.name }}>{withGlossary(part, glossary)}</strong>
      : <React.Fragment key={i}>{withGlossary(part, glossary)}</React.Fragment>
  );
}

// ── Block renderer — one blank-line-separated block, shared by the
// normal section body (renderBody, below) and level-4 "term:
// definition" entries (see the level === 4 branch further down, which
// reuses this with compact=true so a bullet list inside one of those
// stays the same small type scale as its prose instead of jumping back
// up to full body size). A block whose lines all start with "- "
// renders as a bullet list (a "  - " line nests as a sub-item of the
// bullet above it). A paragraph block starting with "Example:" renders
// italicized and indented, to set worked examples apart from the
// surrounding rules text at a glance. Anything else is a plain
// paragraph. See the MARKDOWN SOURCES doc in scripts/convert.py for the
// full syntax.
function renderBlock(block, key, glossary, compact = false) {
  const lines = block.split("\n").map(l => l.trimEnd()).filter(l => l.trim());
  const isList = lines.length > 0 && lines.every(l => /^\s*-\s+/.test(l));
  const size = compact ? 14 : 15;
  const lineHeight = compact ? 1.6 : 1.7;
  const gap = compact ? 6 : 10;
  if (!isList) {
    const joined = lines.join(" ");
    const isExample = /^Example:/.test(joined);
    return (
      <p key={key} style={{
        fontSize: size, color: isExample ? TEXT.muted : TEXT.body, lineHeight, marginBottom: gap,
        fontStyle: isExample ? "italic" : "normal",
        marginLeft: isExample ? 18 : 0,
      }}>
        {renderInline(joined, glossary)}
      </p>
    );
  }
  const items = [];
  lines.forEach(l => {
    const m = l.match(/^(\s*)-\s+(.*)$/);
    const indented = m[1].length >= 2;
    if (indented && items.length > 0) {
      (items[items.length - 1].sub ??= []).push(m[2]);
    } else {
      items.push({ text: m[2], sub: null });
    }
  });
  return (
    <ul key={key} style={{ margin: `0 0 ${gap}px 0`, paddingLeft: 22 }}>
      {items.map((it, ii) => (
        <li key={ii} style={{ fontSize: size, color:TEXT.body, lineHeight, marginBottom: 4 }}>
          {renderInline(it.text, glossary)}
          {it.sub && (
            <ul style={{ margin: "4px 0 0 0", paddingLeft: 20 }}>
              {it.sub.map((sub, si) => (
                <li key={si} style={{ fontSize: compact ? 13 : 14, color:TEXT.body, lineHeight:1.6, marginBottom:3 }}>
                  {renderInline(sub, glossary)}
                </li>
              ))}
            </ul>
          )}
        </li>
      ))}
    </ul>
  );
}

function renderBody(body, glossary) {
  const blocks = (body || "").split(/\n\n+/).map(b => b.trim()).filter(Boolean);
  return blocks.map((block, bi) => renderBlock(block, bi, glossary));
}

function App() {
  const [sections, setSections] = useState([]);
  const [glossary, setGlossary] = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [loadError, setLoadError] = useState(null);
  // Which supplement's rules to show — "" means all of them together,
  // same as the whole book read before supplement tags existed. Every
  // section carries a supplement (untagged content defaults to "Base
  // Game" — see parse_markdown_sections in convert.py), so filtering is
  // just an equality check; a chapter's whole nested subtree shares its
  // level-1 heading's tag, so this never splits a chapter in half.
  const [supplementFilter, setSupplementFilter] = useState("");
  const allSupplements = useMemo(
    () => [...new Set(sections.map(s => s.supplement).filter(Boolean))].sort(),
    [sections]
  );
  const visibleSections = useMemo(
    () => supplementFilter ? sections.filter(s => s.supplement === supplementFilter) : sections,
    [sections, supplementFilter]
  );

  useEffect(() => {
    Promise.all([
      fetch("data/rulebook.json").then(r => {
        if (!r.ok) throw new Error(`rulebook.json returned ${r.status}`);
        return r.json();
      }),
      fetch("data/glossary.json").then(r => r.ok ? r.json() : []).catch(() => []),
    ])
    .then(([sectionData, glossaryData]) => {
      setSections(sectionData);
      setGlossary(Array.isArray(glossaryData) ? glossaryData : []);
      setLoading(false);
    })
    .catch(err => {
      setLoadError(err.message);
      setLoading(false);
    });
  }, []);

  const tabStyle = active => ({
    padding: "6px 14px", fontSize: 15, fontWeight: 500, borderRadius: 6,
    background:  active ? "#d4a843" : "transparent",
    color:       active ? "#0a0e18" : TEXT.muted,
    border: `0.5px solid ${active ? "#d4a843" : "#2d3555"}`,
    textDecoration: "none", display: "inline-flex", alignItems: "center",
    transition: "all 0.15s",
  });

  // Same cooler blue as index.html's nav — the Rulebook link always looks
  // like a different kind of link, not just "the active tab."
  const rulebookLinkStyle = {
    padding: "6px 14px", fontSize: 15, fontWeight: 500, borderRadius: 6,
    background: "#0f2230", color: "#7fb8d9",
    border: "0.5px solid #3d6a8a",
    textDecoration: "none", display: "inline-flex", alignItems: "center",
    transition: "all 0.15s",
  };

  if (loading) return (
    <div style={{
      minHeight: "100vh", display:"flex", alignItems:"center",
      justifyContent: "center", color: TEXT.faint,
      fontFamily: "'MedievalSharp', Georgia, serif", fontSize: 18,
    }}>
      Loading the rulebook…
    </div>
  );

  if (loadError) return (
    <div style={{ minHeight:"100vh", padding:40, color:"#c0392b", fontSize:16, lineHeight:1.6, maxWidth:620 }}>
      <strong>Couldn't load the rulebook</strong>
      <p style={{ marginTop:10, color:TEXT.muted }}>Error: {loadError}</p>
    </div>
  );

  return (
    <div style={{ fontFamily:"system-ui, -apple-system, sans-serif" }}>

      {/* ════════ HEADER — same branding/nav as index.html, with
          "Rulebook" as the active tab and everything else linking back. ═══ */}
      <div className="site-header" style={{
        padding: "12px 20px",
        borderBottom: "0.5px solid #2d3555",
        display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap",
        background: "#0a0e18",
      }}>
        <a href="index.html" style={{ textDecoration:"none", color:"inherit", display:"flex", alignItems:"center", gap:10 }}>
          <img src="assets/mug-icon.png" alt="" style={{ height:38, width:"auto", flexShrink:0 }} />
          <div style={{ textAlign: "center" }}>
            <div style={{
              fontFamily: "'MedievalSharp', Georgia, serif",
              fontSize: 22, fontWeight: "bold",
              color: "#d4a843", letterSpacing: "0.04em",
            }}>
              FlagonQuest
            </div>
            <div style={{ fontSize:13, color:TEXT.faint, marginTop:1 }}>
              A beer-and-pretzels TTRPG for the modern gamer
            </div>
          </div>
        </a>

        <div className="site-header-nav" style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6, flexWrap:"wrap" }}>
          <a href="index.html?tab=build" style={tabStyle(false)}>Builder</a>
          <a href="index.html?tab=browse" style={tabStyle(false)}>Techniques</a>
          <a href="index.html?tab=items" style={tabStyle(false)}>Items</a>
          <a href="index.html?tab=sheet" style={tabStyle(false)}>Character sheet</a>
          <a href="index.html?tab=notes" style={tabStyle(false)}>Notes</a>

          {/* Divider + Rulebook + Glossary grouped into their own flex
              item, so the pair wraps to the next line as a unit instead
              of splitting apart. */}
          <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
            <div style={{ width:56, display:"flex", justifyContent:"center", alignItems:"center", flexShrink:0 }} aria-hidden="true">
              <div style={{ width:1, height:22, background:"#2d3555" }} />
            </div>

            <a href="rulebook.html" className="rulebook-link" style={rulebookLinkStyle}>
              Rulebook
            </a>
            <a href="glossary.html" className="rulebook-link" style={rulebookLinkStyle}>
              Glossary
            </a>
          </div>
        </div>
      </div>

      {/* ════════ RULEBOOK CONTENT ═══════════════════════════════ */}
      <div style={{ maxWidth:1160, margin:"0 auto", padding:20 }}>
        {/* Supplement tabs — only worth showing once there's more than
            one supplement's worth of content to pick between. "All"
            (empty filter) reads as the whole book, same as before these
            existed. */}
        {allSupplements.length > 1 && (
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:18 }}>
            <button onClick={() => setSupplementFilter("")} style={tabStyle(supplementFilter === "")}>
              All
            </button>
            {allSupplements.map(s => (
              <button key={s} onClick={() => setSupplementFilter(s)} style={tabStyle(supplementFilter === s)}>
                {s}
              </button>
            ))}
          </div>
        )}
        <div className="rulebook-layout">

          {/* Table of contents */}
          <nav className="rulebook-toc">
            <div style={{ fontSize:13, color:TEXT.faint, marginBottom:8, textTransform:"uppercase", letterSpacing:"0.07em" }}>
              Contents
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:2 }}>
              {/* Only chapters (level 1) and sections (level 2) get a TOC
                  entry — subsections (3) and glossary-style term entries
                  (4) still exist in the page and can be linked to
                  directly, but listing every one would make the TOC
                  longer than the content it's supposed to summarize. */}
              {visibleSections.filter(s => s.level <= 2).map(s => (
                <a
                  key={s.id}
                  href={`#${s.id}`}
                  style={{
                    fontSize: s.level === 2 ? 13 : 14,
                    fontWeight: s.level === 2 ? 400 : 600,
                    color: s.level === 2 ? TEXT.muted : TEXT.body,
                    paddingLeft: s.level === 2 ? 14 : 0,
                    textDecoration: "none",
                    lineHeight: 1.9,
                  }}
                >
                  {s.title}
                </a>
              ))}
            </div>
          </nav>

          {/* Sections */}
          <div>
            {visibleSections.length === 0 ? (
              <div style={{ textAlign:"center", padding:"48px 20px", color:TEXT.faint, fontSize:16 }}>
                No rulebook content yet.
              </div>
            ) : visibleSections.map(s => {
              // Level 4 — a glossary-style term definition (e.g. a Skill
              // under its Stat, a Rules Tag under its section) — reads as
              // a compact run-in entry, term bold inline with its first
              // paragraph, rather than another full heading block. The
              // first block is always short prose (the term glues onto
              // it), but later blocks go through the same compact
              // renderBlock as everything else, so one of these can still
              // have a bullet list after its opening sentence.
              if (s.level === 4) {
                const blocks = (s.body || "").split(/\n\n+/).map(b => b.trim()).filter(Boolean);
                return (
                  <div key={s.id} id={s.id} style={{ marginBottom:14, marginLeft:20 }}>
                    {blocks.length === 0 ? (
                      <div style={{ fontSize:14, color:TEXT.name, fontWeight:600 }}>{s.title}</div>
                    ) : blocks.map((block, i) => {
                      if (i > 0) return renderBlock(block, i, glossary, true);
                      const firstLine = block.split("\n").map(l => l.trim()).filter(Boolean).join(" ");
                      return (
                        <p key={i} style={{ fontSize:14, color:TEXT.body, lineHeight:1.6, marginBottom:6 }}>
                          <strong style={{ color:TEXT.name }}>{s.title}: </strong>
                          {renderInline(firstLine, glossary)}
                        </p>
                      );
                    })}
                  </div>
                );
              }
              const isTop = s.level === 1;
              const isSub = s.level === 3;
              return (
                <div key={s.id} id={s.id} style={{
                  marginBottom: isTop ? 28 : (isSub ? 18 : 24),
                  marginLeft: isSub ? 8 : 0,
                  paddingTop: isTop ? 10 : 0,
                  borderTop: isTop ? "0.5px solid #2d3555" : "none",
                }}>
                  <div style={{
                    fontFamily: "'MedievalSharp', Georgia, serif",
                    fontWeight: "bold",
                    fontSize: isTop ? 24 : (isSub ? 16 : 18),
                    color: isTop ? "#d4a843" : (isSub ? TEXT.muted : TEXT.name),
                    marginTop: isTop ? 14 : 4,
                    marginBottom: 10,
                  }}>
                    {s.title}
                  </div>
                  {renderBody(s.body, glossary)}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* ════════ FOOTER ═══════════════════════════════════════ */}
      <div style={{ textAlign: "center", padding: "26px 16px 18px", fontSize: 12, color: TEXT.faint }}>
        FlagonQuest is a project by Friendly Flagon Games.
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
